<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 — {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div style="max-width:340px;margin:14vh auto;padding:0 20px">
  <div class="center" style="margin-bottom:28px">
    <span class="mark" style="display:inline-block;width:44px;height:44px;line-height:44px;
          border-radius:50%;background:var(--kaki);color:#fff;margin-bottom:10px">班</span>
    <h1 style="margin:0;font-size:1.2rem">{{ app_name }}</h1>
    <div class="tiny muted" style="letter-spacing:.18em">SHIFT SCHEDULER</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="msg {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <div class="card">
    <form method="post">
      <div class="field">
        <label for="password">管理密碼</label>
        <input type="password" id="password" name="password" autofocus required>
      </div>
      <button class="btn primary" style="width:100%">登入</button>
    </form>
  </div>
  <p class="tiny muted center">預設密碼寫在 .env 的 ADMIN_PASSWORD</p>
</div>
</body>
</html>
