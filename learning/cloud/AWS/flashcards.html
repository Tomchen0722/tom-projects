<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAA-C03 互動閃卡</title>
<style>
  :root{--orange:#ff9900;--dark:#232f3e;--bg:#f5f6fa;--good:#1e8e3e;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
  body{background:var(--bg);min-height:100vh;}
  header{background:var(--dark);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{font-size:1.2rem;} header h1 span{color:var(--orange);}
  a.back{color:#fff;text-decoration:none;font-size:.9rem;opacity:.85;}
  .container{max-width:700px;margin:0 auto;padding:24px 16px;}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-btn{padding:8px 16px;border:2px solid #ccc;border-radius:20px;background:#fff;cursor:pointer;font-size:.85rem;transition:.15s;}
  .cat-btn.active{background:var(--dark);color:#fff;border-color:var(--dark);}
  .scene{perspective:1200px;margin-bottom:20px;}
  .flashcard{position:relative;width:100%;min-height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;}
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12);}
  .front{background:linear-gradient(135deg,var(--dark),#37475a);color:#fff;}
  .front .term{font-size:1.6rem;font-weight:700;line-height:1.5;}
  .front .hint{margin-top:16px;font-size:.8rem;opacity:.6;}
  .back{background:#fff;transform:rotateY(180deg);color:#222;}
  .back .def{font-size:1rem;line-height:1.9;text-align:left;}
  .cat-label{position:absolute;top:14px;left:16px;font-size:.75rem;padding:3px 12px;border-radius:20px;background:var(--orange);color:#fff;}
  .counter{text-align:center;color:#666;font-size:.9rem;margin-bottom:12px;}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn{padding:10px 20px;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;font-weight:600;background:#fff;border:2px solid var(--dark);color:var(--dark);}
  .btn:hover{background:var(--dark);color:#fff;}
  .btn.know{border-color:var(--good);color:var(--good);}
  .btn.know:hover{background:var(--good);color:#fff;}
  .btn.orange{background:var(--orange);border-color:var(--orange);color:#fff;}
  .stat-bar{text-align:center;margin-top:16px;font-size:.85rem;color:#555;}
  .done-card{background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12);}
  @media(max-width:600px){.face{padding:20px;}.front .term{font-size:1.25rem;}.back .def{font-size:.9rem;}}
</style>
</head>
<body>
<header>
  <h1>AWS <span>SAA-C03</span> 互動閃卡</h1>
  <a class="back" href="index.html">← 回學習中心</a>
</header>
<div class="container">
  <div class="cats" id="cats"></div>
  <div class="counter" id="counter"></div>
  <div id="stage"></div>
  <div class="controls" id="controls"></div>
  <div class="stat-bar" id="statbar"></div>
</div>

<script>
const CARDS = [
// 運算
{c:"運算",t:"EC2 購買選項比較",d:"On-Demand：隨用隨付，無承諾。<br>Reserved / Savings Plans：1-3 年承諾，省最高 72%，適合穩定負載。<br>Spot：省最高 90%，可被中斷（2 分鐘通知），適合容錯批次。<br>Dedicated Host：實體主機專用，符合 BYOL 授權/合規。"},
{c:"運算",t:"Auto Scaling 政策類型",d:"Target Tracking：維持指標於目標值（如 CPU 50%），最常考。<br>Step Scaling：依警報階梯式增減。<br>Scheduled：可預測流量前預先擴容。<br>Predictive：機器學習預測流量。"},
{c:"運算",t:"Lambda 重要限制",d:"最長執行 15 分鐘；記憶體 128MB–10GB（CPU 隨記憶體等比增加）；暫存 /tmp 最大 10GB；同區域預設併發 1,000。<br>超過 15 分鐘的工作 → 改用 ECS/Fargate/Batch。"},
{c:"運算",t:"ECS vs EKS vs Fargate",d:"ECS：AWS 原生容器編排，簡單。<br>EKS：受管 Kubernetes，適合已用 K8s 的團隊。<br>Fargate：無伺服器運算引擎（ECS/EKS 皆可用），免管 EC2 節點。"},
{c:"運算",t:"Placement Groups 三種類型",d:"Cluster：同機架、低延遲高吞吐 → HPC。<br>Spread：分散於不同硬體，每 AZ 上限 7 台 → 關鍵少量執行個體。<br>Partition：分區隔離故障 → Hadoop/Kafka/Cassandra 大型分散式系統。"},
// 儲存
{c:"儲存",t:"S3 儲存類別總覽",d:"Standard：熱資料。<br>Intelligent-Tiering：存取模式未知，自動分層。<br>Standard-IA / One Zone-IA：低頻存取（One Zone 便宜但單 AZ）。<br>Glacier Instant / Flexible / Deep Archive：封存，取回時間毫秒 / 分鐘-小時 / 12 小時+。"},
{c:"儲存",t:"EBS 磁碟區類型",d:"gp3：通用 SSD，基準 3,000 IOPS 可調至 16,000，比 gp2 便宜。<br>io2：關鍵資料庫，最高 64K IOPS（Block Express 256K），支援 Multi-Attach。<br>st1：吞吐型 HDD（大數據、日誌）。<br>sc1：冷資料 HDD，最便宜。"},
{c:"儲存",t:"EBS vs EFS vs Instance Store",d:"EBS：單一執行個體區塊儲存（限同 AZ），快照到 S3。<br>EFS：跨 AZ 多執行個體共用 NFS（僅 Linux），彈性擴展。<br>Instance Store：實體暫存磁碟，效能極高，停機即消失。"},
{c:"儲存",t:"S3 資料保護功能",d:"Versioning：保留物件所有版本，防誤刪。<br>MFA Delete：刪除需 MFA。<br>Object Lock：WORM 合規模式，指定期間內不可刪改。<br>Replication (CRR/SRR)：跨區域/同區域自動複寫。"},
{c:"儲存",t:"Storage Gateway 三種類型",d:"File Gateway：on-prem 透過 NFS/SMB 存取 S3。<br>Volume Gateway：iSCSI 區塊儲存（Cached：主資料在 S3；Stored：主資料在本地）。<br>Tape Gateway：虛擬磁帶庫取代實體磁帶備份。"},
{c:"儲存",t:"AWS Snow Family",d:"Snowcone：8TB，小型邊緣。<br>Snowball Edge：80TB，PB 級遷移 + 邊緣運算。<br>經驗法則：資料量若透過網路傳輸需超過一週，考慮 Snow 系列。"},
// 資料庫
{c:"資料庫",t:"RDS Multi-AZ vs Read Replica",d:"Multi-AZ：同步複寫到 standby，自動容錯移轉，standby 不可讀 → 高可用。<br>Read Replica：非同步複寫，可跨區域，分擔讀取 → 擴展效能。<br>兩者用途不同，常一起使用。"},
{c:"資料庫",t:"Aurora 重點特性",d:"MySQL/PostgreSQL 相容，效能最高 5x/3x。<br>6 份資料複本跨 3 AZ；最多 15 個低延遲讀取複本。<br>Aurora Serverless：自動擴縮，適合間歇性負載。<br>Global Database：跨區域複寫延遲 <1 秒。"},
{c:"資料庫",t:"DynamoDB 重點特性",d:"全受管 NoSQL，單位數毫秒延遲。<br>On-Demand vs Provisioned 容量模式。<br>DAX：記憶體快取，讀取降至微秒級。<br>Global Tables：多區域多主動讀寫。<br>Streams：變更事件流，可觸發 Lambda。"},
{c:"資料庫",t:"資料庫選型速記",d:"OLTP 關聯式 → RDS / Aurora。<br>OLAP 資料倉儲 → Redshift。<br>鍵值/文件 NoSQL → DynamoDB。<br>記憶體快取 → ElastiCache。<br>圖形 → Neptune。時序 → Timestream。帳本 → QLDB。"},
{c:"資料庫",t:"ElastiCache：Redis vs Memcached",d:"Redis：複寫、持久化、備份、Multi-AZ 容錯移轉、排序集合（排行榜）、Pub/Sub。<br>Memcached：純快取、多執行緒、無持久化、無複寫。<br>考題要 HA 或資料結構 → 選 Redis。"},
// 網路
{c:"網路",t:"Security Group vs Network ACL",d:"SG：執行個體層級、有狀態（回應自動放行）、僅允許規則、規則全部評估。<br>NACL：子網路層級、無狀態（進出都要開）、允許+拒絕規則、依編號順序評估。"},
{c:"網路",t:"VPC 連線方式比較",d:"VPC Peering：兩 VPC 一對一，不可遞移。<br>Transit Gateway：中樞輻射，連接大量 VPC 與 on-prem。<br>PrivateLink / Interface Endpoint：私有存取特定服務，不暴露整個網路。<br>Site-to-Site VPN：加密走網際網路。Direct Connect：專線。"},
{c:"網路",t:"VPC Endpoint 兩種類型",d:"Gateway Endpoint：僅 S3 與 DynamoDB，路由表指向，免費。<br>Interface Endpoint (PrivateLink)：其他多數服務，子網路內 ENI，按小時+流量計費。<br>考題見「私有存取 S3」→ 優先 Gateway Endpoint。"},
{c:"網路",t:"Route 53 路由政策",d:"Simple：單一資源。Weighted：按比例分流（A/B 測試）。<br>Latency：導向延遲最低區域。Failover：主備容錯。<br>Geolocation：依使用者位置。Geoproximity：依地理+偏移值。<br>Multivalue：回傳多個健康 IP。"},
{c:"網路",t:"CloudFront vs Global Accelerator",d:"CloudFront：CDN，快取 HTTP 內容於邊緣，適合網站/影音。<br>Global Accelerator：2 個固定 Anycast IP，走 AWS 骨幹，適合 TCP/UDP 非 HTTP（遊戲、VoIP）、需固定 IP 的場景。"},
{c:"網路",t:"ALB vs NLB vs GWLB",d:"ALB：Layer 7（HTTP/HTTPS），路徑/主機路由，支援 WAF。<br>NLB：Layer 4（TCP/UDP），超高效能、超低延遲、固定 IP。<br>GWLB：Layer 3，部署第三方網路設備（防火牆/IDS）。"},
// 安全
{c:"安全",t:"IAM 政策評估邏輯",d:"1. 明確 Deny 永遠優先。<br>2. SCP、Permission Boundary、Session Policy 皆為上限。<br>3. 預設全部隱含拒絕，需明確 Allow。<br>資源型政策（如 Bucket Policy）與身分型政策取聯集（同帳號內）。"},
{c:"安全",t:"KMS 金鑰類型",d:"AWS 管理金鑰：免費，AWS 自動輪換。<br>客戶管理金鑰 (CMK)：可自訂政策/輪換/停用，CloudTrail 稽核，$1/月。<br>CloudHSM：專用硬體模組，FIPS 140-2 Level 3，完全自控。"},
{c:"安全",t:"威脅偵測與稽核服務區分",d:"GuardDuty：威脅偵測（分析 CloudTrail/VPC Flow/DNS）。<br>Inspector：EC2/ECR/Lambda 弱點掃描。<br>Macie：S3 敏感資料（PII）探索。<br>Config：資源組態合規追蹤。<br>CloudTrail：API 呼叫稽核。<br>Security Hub：彙整以上所有發現。"},
{c:"安全",t:"Shield vs WAF",d:"Shield Standard：免費，自動 L3/L4 DDoS 防護。<br>Shield Advanced：$3,000/月，進階 DDoS + DRT 團隊支援 + 費用保障。<br>WAF：L7 規則過濾（SQLi、XSS、Rate limiting），部署於 CloudFront/ALB/API GW。"},
{c:"安全",t:"Secrets Manager vs Parameter Store",d:"Secrets Manager：付費，內建自動輪換（RDS 等整合），跨帳號存取。<br>Parameter Store：Standard 免費，存組態與密文（SecureString），無原生自動輪換。<br>考題見「自動輪換」→ Secrets Manager。"},
{c:"安全",t:"跨帳號存取的正確做法",d:"使用 IAM Role + STS AssumeRole：目標帳號建立角色並信任來源帳號，來源使用者暫時擔任該角色。<br>絕不共用 Access Key。External ID 可防止「混淆代理人」問題（第三方存取場景）。"},
// 整合與分析
{c:"整合分析",t:"SQS vs SNS vs EventBridge",d:"SQS：拉取式佇列，解耦、緩衝（Standard：至少一次；FIFO：順序+恰好一次）。<br>SNS：推播式發佈/訂閱，一對多扇出 (fan-out)。<br>EventBridge：事件匯流排，規則路由、排程、SaaS 整合。<br>經典模式：SNS + 多個 SQS = fan-out。"},
{c:"整合分析",t:"Kinesis 家族",d:"Data Streams：即時串流，分片計費，保留 1-365 天，可重播。<br>Data Firehose：全受管遞送至 S3/Redshift/OpenSearch，近即時（緩衝約 60 秒+），免管理。<br>考題見「即時處理+自訂消費者」→ Streams；「載入資料湖免維運」→ Firehose。"},
{c:"整合分析",t:"S3 資料分析工具",d:"Athena：無伺服器 SQL 查詢 S3，按掃描量計費。<br>Glue：無伺服器 ETL + Data Catalog。<br>EMR：受管 Hadoop/Spark 大數據框架。<br>QuickSight：BI 視覺化儀表板。"},
{c:"整合分析",t:"Step Functions 使用時機",d:"視覺化工作流程編排多個 Lambda/服務：順序、平行、分支、重試、人工審核等待。<br>考題見「協調多步驟」「長時間工作流」「Lambda 鏈太複雜」→ Step Functions。"},
// 成本
{c:"成本",t:"成本管理工具區分",d:"Cost Explorer：視覺化分析歷史費用與預測。<br>AWS Budgets：預算門檻警示（可用「預測值」觸發）。<br>Cost & Usage Report (CUR)：最詳細帳單明細到 S3。<br>Compute Optimizer：右調 (right-size) 建議。<br>Trusted Advisor：成本/安全/效能檢查。"},
{c:"成本",t:"資料傳輸費用重點",d:"傳入 AWS：免費。同 AZ 內：免費。<br>跨 AZ：每 GB 計費（HA 架構的隱藏成本）。<br>傳出網際網路：最貴。<br>省費技巧：CloudFront 傳出較便宜、Gateway Endpoint 免 NAT 費、同 AZ 部署。"},
{c:"成本",t:"Savings Plans vs Reserved Instances",d:"Compute SP：最彈性，適用任何區域/家族的 EC2+Fargate+Lambda。<br>EC2 Instance SP：綁定區域+家族，折扣更高。<br>Standard RI：可賣二手市場。Convertible RI：可換家族。<br>新考題趨勢偏好 Savings Plans。"},
{c:"成本",t:"S3 成本優化三板斧",d:"1. Lifecycle Policy 自動轉冷儲存與過期刪除。<br>2. Intelligent-Tiering 應對未知存取模式。<br>3. S3 Storage Lens / Storage Class Analysis 分析用量。<br>另注意：不完整的 Multipart Upload 要設定自動清理。"},
{c:"成本",t:"災難復原四策略（成本低→高）",d:"Backup & Restore：僅備份，RTO 數小時+。<br>Pilot Light：核心常駐（DB 複寫），其餘災時啟動。<br>Warm Standby：縮小版全系統常駐，災時擴容。<br>Multi-Site Active-Active：雙站全量，RTO≈0，最貴。"},
// ===== 以下為第 11-22 章補充卡（追加在陣列末端，不影響既有的熟悉度標記索引）=====
// 容器
{c:"容器",t:"ECS vs EKS 四個判斷點",d:"團隊技能：沒有 K8s 經驗選 ECS。<br>可攜性：需多雲／不綁單一雲選 EKS。<br>生態系：要用 Helm、Istio、Argo CD 選 EKS。<br>維運人力：沒有專職平台工程師就別碰 EKS。<br>考題見「最少維運負擔」→ ECS + Fargate。"},
{c:"容器",t:"ECS 的三層 IAM 角色",d:"Task Role：<b>容器內程式</b>存取 AWS 服務用（最常考）。<br>Task Execution Role：<b>ECS 代理人</b>拉映像檔、寫 CloudWatch Logs 用。<br>EC2 Instance Role：EC2 啟動類型時，主機本身用。<br>考題見「容器要存取 S3」→ Task Role，不是 Execution Role。"},
{c:"容器",t:"EKS IRSA 與 VPC CNI",d:"IRSA：把 IAM Role 綁到 <b>ServiceAccount</b>，權限精細到 Pod 層級，取代給整個節點掛大權限。<br>VPC CNI：每個 Pod 拿一個 <b>VPC 真實 IP</b>，好處是網路模型單純，代價是<b>子網路 IP 容易耗盡</b>——考題常見的 EKS 擴展失敗原因。"},
{c:"容器",t:"Fargate vs EC2 啟動類型",d:"Fargate：免管主機、按 vCPU/記憶體計費、無法用 DaemonSet 型的主機層代理。<br>EC2：可用 Spot、可用 GPU、可裝主機層工具、能塞更高密度省成本。<br>考題見「免管理伺服器」→ Fargate；見「GPU / 特殊核心參數 / 最大化密度」→ EC2。"},
// 遷移混合
{c:"遷移混合",t:"遷移工具四選一",d:"<b>DataSync</b>：檔案<b>搬一次</b>或排程同步（NFS/SMB → S3/EFS/FSx）。<br><b>DMS + SCT</b>：資料庫遷移，異質需先用 SCT 轉結構，CDC 達成最小停機。<br><b>MGN</b>：整台伺服器 lift-and-shift。<br><b>Snow 家族</b>：頻寬不足或離線時實體寄送。<br>關鍵區分：<b>DataSync 是搬家，Storage Gateway 是長住</b>。"},
{c:"遷移混合",t:"Storage Gateway 四種",d:"S3 File Gateway：NFS/SMB → S3 物件。<br>FSx File Gateway：SMB → FSx for Windows，地端快取。<br>Volume <b>Cached</b>：主資料<b>在雲</b>，地端只放熱快取 → 解決地端空間不足。<br>Volume <b>Stored</b>：主資料<b>在地端</b>，非同步備份成 EBS 快照 → 解決災難復原。<br>Tape Gateway：虛擬磁帶庫，備份軟體不用換。"},
{c:"遷移混合",t:"邊緣與混合四選一",d:"<b>Outposts</b>：AWS 機架放<b>你的機房</b> → 資料落地法規。<br><b>Local Zones</b>：AWS 的<b>都會據點</b> → 個位數毫秒但不自建機房。<br><b>Wavelength</b>：嵌在<b>電信商 5G</b> 網路內 → 行動極低延遲。<br><b>Snowball Edge</b>：可搬運裝置 → 船舶、工地等<b>斷網</b>環境。"},
{c:"遷移混合",t:"7R 遷移策略",d:"Rehost（純搬遷／lift-and-shift）、Replatform（小改如換 RDS）、Refactor（重寫成雲原生）、Repurchase（改買 SaaS）、Relocate（VMware 整批搬）、Retain（暫時不動）、Retire（直接淘汰）。<br>考題見「最快上雲、改動最小」→ Rehost；見「長期成本與彈性最佳」→ Refactor。"},
// 網路（混合網路，第 19 章）
{c:"網路",t:"Direct Connect 三種 VIF",d:"<b>Private VIF</b>：連 VGW 或 DX Gateway，存取<b>一個</b> VPC 的私有 IP。<br><b>Public VIF</b>：存取 S3/DynamoDB 等<b>公有端點</b>，可跨區域，也可跑 VPN over DX 做加密。<br><b>Transit VIF</b>：接 DX Gateway → <b>Transit Gateway</b>，一條線通到<b>所有</b> VPC。<br>DX 預設<b>不加密</b>。"},
{c:"網路",t:"DX 韌性等級與備援",d:"兩個 DX 位置各兩條 = <b>99.99%</b>（最高韌性）。<br>兩個 DX 位置各一條 = <b>99.9%</b>（高韌性）。<br>單一位置兩條 = 只擋裝置故障，無 SLA。<br><b>DX + VPN 備援</b>＝成本取向的常見答案。<br>自動切換<b>必須跑 BGP</b>；LAG 只提升頻寬，不是跨機房高可用。"},
{c:"網路",t:"Transit Gateway 路由隔離",d:"<b>關聯（association）</b>＝這個附件出去時查哪張路由表。<br><b>傳播（propagation）</b>＝這個附件的網段出現在哪張表。<br>用多張路由表達成 Prod/Dev 隔離但都能通共享服務。<br>陷阱：VPC 附件<b>沒選到的 AZ 走不通</b>；VPC 子網路路由表也要指向 TGW。跨區 Peering 需<b>靜態路由</b>。"},
{c:"網路",t:"Route 53 Resolver 混合 DNS",d:"VPC 內建 resolver 在 <b>CIDR 基底 +2</b>（如 10.0.0.2）。<br><b>Inbound Endpoint</b>：地端 → 查 AWS 的私有名稱。<br><b>Outbound Endpoint + Resolver Rule</b>：AWS → 查地端名稱。<br>題目說「<b>互相</b>解析」→ 兩個都要建。每個 Endpoint 至少兩個 IP 且不同 AZ，SG 要開 <b>TCP 與 UDP 53</b>。"},
{c:"網路",t:"Endpoint / PrivateLink / Peering / TGW",d:"Gateway Endpoint：<b>只有 S3 與 DynamoDB</b>，免費，<b>地端用不到</b>。<br>Interface Endpoint（PrivateLink）：幾乎所有服務，ENI 計費，<b>地端可透過 DX/VPN 使用</b>。<br>Peering：只連兩個 VPC，<b>不可遞移、網段不可重疊</b>。<br>TGW：可遞移中樞，每附件計費。<br>必考：地端私有連 S3 → <b>Interface Endpoint</b>。"},
{c:"網路",t:"CloudFront 內容保護",d:"<b>Signed URL</b>：保護<b>單一檔案</b>。<br><b>Signed Cookie</b>：保護<b>整個路徑</b>的多個檔案，網址不用改。<br><b>S3 預簽章網址</b>：直接對 S3，繞過 CDN，適合使用者直接上傳。<br><b>OAC</b>：讓 S3 只接受該 CloudFront 分佈，儲存貯體維持全私有。<br>判斷點：要保護幾個檔案。"},
{c:"網路",t:"CloudFront Functions vs Lambda@Edge",d:"<b>Functions</b>：邊緣站點、次毫秒、JavaScript 受限子集、<b>不能連網路</b>、便宜 → 標頭/URL 改寫、快取鍵正規化。<br><b>Lambda@Edge</b>：可<b>連網路、讀請求主體</b>、四種觸發點 → A/B 測試、呼叫 API。<br>限制：Lambda@Edge 必須建在 <b>us-east-1</b> 且<b>不支援環境變數</b>。"},
// 儲存（第 20 章）
{c:"儲存",t:"FSx 四種怎麼選",d:"<b>Windows File Server</b>：SMB + <b>AD 整合</b> + NTFS ACL。<br><b>Lustre</b>：HPC/ML，<b>連結 S3</b>，高吞吐 POSIX。<br><b>NetApp ONTAP</b>：<b>NFS + SMB + iSCSI 多協定</b>，SnapMirror。<br><b>OpenZFS</b>：Linux NFS 遷移、ZFS 快照。<br>只是單純 Linux 共用目錄 → <b>選 EFS，不要硬選 FSx</b>。"},
{c:"儲存",t:"FSx for Lustre：Scratch vs Persistent",d:"<b>Scratch</b>：不複寫，硬體故障<b>資料就沒了</b>，便宜，算完即丟的短期批次。<br><b>Persistent</b>：同 AZ 內複寫並<b>自動修復</b>，長期執行、不可遺失。<br>可連結 S3：物件<b>延遲載入</b>成檔案，結果用 HSM 匯出回 S3。吞吐量<b>跟著容量走</b>（每 TiB 多少 MB/s）。"},
{c:"儲存",t:"EFS 儲存類別與吞吐模式",d:"類別：Standard／Standard-IA／One Zone／One Zone-IA。<b>One Zone 約省一半但單 AZ 故障就不可用</b>。<br>吞吐模式：<b>Elastic</b>（建議預設，自動伸縮）／<b>Bursting</b>（跟容量走，<b>資料量小就會撞牆</b>）／Provisioned（手動指定）。<br>「EFS 突然變慢」→ Bursting 信用額度用完，改 Elastic。"},
{c:"儲存",t:"AWS Backup 與 Vault Lock",d:"AWS Backup：EC2/EBS/EFS/FSx/RDS/DynamoDB/S3 等十多種服務，<b>用標籤指派</b>資源，可跨區域與<b>跨帳號</b>複製，Organizations 政策強制套用，還有<b>還原測試計畫</b>。<br>Vault Lock：<b>Governance</b> 可解除／<b>Compliance 不可逆，連 root 都刪不掉</b>。<br>防勒索標準答案＝<b>跨帳號複製 + Compliance 模式</b>。"},
{c:"儲存",t:"S3 Access Point 四種用法",d:"一般 Access Point：每個用途獨立端點與政策，簡化肥大的 bucket policy。<br><b>VPC-only</b>：該存取點只能從指定 VPC 使用。<br><b>Multi-Region Access Point</b>：<b>一個全球端點</b>自動導向延遲最低的區域複本。<br><b>Object Lambda</b>：讀取時<b>即時轉換</b>（去識別化、加浮水印），<b>原始物件不動、不需存第二份</b>。"},
{c:"儲存",t:"S3 Select vs Athena vs Batch Operations",d:"<b>S3 Select</b>：對<b>單一物件</b>下簡單 SQL 過濾，減少傳輸量。<br><b>Athena</b>：對<b>整個資料湖</b>下完整 SQL，有資料表、可 JOIN。<br><b>Batch Operations</b>：吃 S3 Inventory 清單，對<b>幾百萬個既有物件</b>一次做同一件事。<br>對照：生命週期規則管「<b>以後</b>」，Batch Operations 管「<b>現在的既有物件</b>」。"},
// 維運治理（第 21、22 章）
{c:"維運治理",t:"SSM 上線三個前置條件",d:"① <b>SSM Agent</b> 有裝且在跑。<br>② EC2 掛 <b>IAM 執行個體設定檔</b>（AmazonSSMManagedInstanceCore）——<b>最常見的漏掉項</b>。<br>③ 網路通（NAT/IGW 或 Interface Endpoint）。<br>私有子網路要 <b>ssm / ssmmessages / ec2messages</b> 三個端點 + S3 Gateway Endpoint。<br><b>看得到機器但連不進去 = 缺 ssmmessages</b>。"},
{c:"維運治理",t:"SSM 工具的分界",d:"<b>Session Manager</b>：登入，<b>零入站連接埠</b>、可連接埠轉發連私有 RDS、工作階段可錄影稽核。<br><b>Run Command</b>：對一批機器<b>執行一次</b>命令。<br><b>Automation</b>：<b>多步驟</b>跨資源流程（Config 自動修復就是它動手）。<br><b>State Manager</b>：<b>持續維持</b>期望狀態，防組態漂移。"},
{c:"維運治理",t:"Patch Manager 重點",d:"<b>Patch Baseline</b>：可設<b>自動核准延遲天數</b>（如發布 7 天後才裝，避開問題更新）+ 明確核准／拒絕清單。<br><b>Patch Group</b>：標籤鍵名固定是「<b>Patch Group</b>」，<b>中間有空格、大小寫敏感</b>，寫錯不會報錯只會默默套預設基準。<br><b>Maintenance Window</b>：什麼時候能動手。全程<b>不需開任何入站連接埠</b>。"},
{c:"維運治理",t:"Parameter Store vs Secrets Manager",d:"判斷點只有一個：<b>要不要自動輪換</b>。<br><b>Secrets Manager</b>：原生自動輪換、與 RDS 整合、可<b>跨帳號共享</b>、按密文計費。<br><b>Parameter Store</b>：Standard <b>免費</b>、階層式路徑（權限可依路徑分層）、SecureString 用 KMS，但<b>沒有內建輪換</b>。<br>密碼絕不放 User Data 或環境變數。"},
{c:"維運治理",t:"Directory Service 三選一",d:"<b>AWS Managed Microsoft AD</b>：真 AD，可與地端建<b>信任</b>，<b>斷線仍能獨立驗證</b>，支援 FSx for Windows / RDS SQL Server。<br><b>AD Connector</b>：只是<b>代理不存資料</b>，適合「不在雲端放目錄副本」，<b>地端斷線就無法驗證</b>。<br><b>Simple AD</b>：便宜輕量，<b>不支援信任關係與 MFA</b>。<br>Cognito 是給 App 終端使用者，不是員工。"},
{c:"維運治理",t:"Control Tower 三種防護欄",d:"<b>預防性</b>＝ SCP，在 <b>API 呼叫時直接拒絕</b>（要「根本不能做」選它）。<br><b>偵測性</b>＝ Config 規則，<b>事後</b>發現不合規。<br><b>主動性</b>＝ CloudFormation Hooks，<b>部署範本前</b>擋下。<br>記法：主動性看範本、預防性看動作、偵測性看結果。Control Tower 建在 Organizations 之上，非二選一。"},
{c:"維運治理",t:"治理工具對照表",d:"強制<b>不能做</b> → <b>SCP</b>。<br>快速開<b>合規新帳號</b> → <b>Control Tower</b>（Account Factory）。<br>團隊<b>自助佈建但只能用核准架構</b> → <b>Service Catalog</b>（啟動限制讓使用者不需底層權限）。<br>資源<b>分享給其他帳號</b> → <b>RAM</b>。<br>偵測既有資源是否合規 → <b>Config</b>。<br><b>SCP 對管理帳號完全無效</b>，所以管理帳號不放工作負載。"},
{c:"安全",t:"Detective / Audit Manager / Artifact",d:"<b>GuardDuty</b>：有事發生了（偵測）。<br><b>Detective</b>：事情<b>怎麼發生的</b>（把 CloudTrail + Flow Logs + GuardDuty 串成行為圖做<b>根因調查</b>）。<br><b>Audit Manager</b>：<b>我的環境</b>合規嗎（蒐集證據對應 CIS/PCI/SOC2 框架）。<br><b>Artifact</b>：<b>AWS 自己</b>合規嗎（下載 SOC/ISO/PCI 報告、簽 BAA）。"},
{c:"安全",t:"Firewall Manager 的關鍵字",d:"跨帳號集中管理 <b>WAF 規則、Shield Advanced、Security Group 稽核、Network Firewall、DNS Firewall</b>，並自動套用到<b>所有現有與未來</b>的資源。<br>前提：Organizations 全功能 + 啟用 Config + 委派管理員。<br>考題最強關鍵字是「<b>包括未來新建的</b>」——只答 AWS WAF 是錯的。"},
// 整合分析
{c:"整合分析",t:"Amazon MQ vs SQS/SNS",d:"判斷點是「<b>既有協定</b>」。<br>題目提到 <b>JMS / AMQP / MQTT / ActiveMQ / RabbitMQ</b> 且「<b>不想改程式碼</b>」→ <b>Amazon MQ</b>。<br>全新開發或允許改寫 → <b>SQS/SNS</b>（更便宜、幾乎無限擴展、免維運）。<br>MQ 的高可用要選 Active/Standby 部署，擴展性受代理程式規格限制。"},
{c:"整合分析",t:"AppFlow 與 SES",d:"<b>AppFlow</b>：SaaS（Salesforce/SAP/Zendesk/Slack）與 AWS 之間<b>免寫程式</b>的資料流，支援排程、事件觸發、欄位對應與遮罩。關鍵字＝「SaaS 資料進 AWS」+「最少開發工作」。<br><b>SES</b>：寄<b>電子郵件</b>的正解。<b>不要用 SNS 寄產品信</b>；<b>EC2 自架郵件伺服器是錯誤選項</b>（25 埠預設封鎖、IP 進黑名單）。新帳號預設在沙箱模式。"},
// 成本
{c:"成本",t:"混合網路的成本陷阱",d:"<b>Interface Endpoint</b> 是<b>每個 AZ 一個 ENI、每個都跳表</b>——為了「安全」建二十個服務乘三個 AZ 會比 NAT Gateway 還貴。S3/DynamoDB 優先用<b>免費的 Gateway Endpoint</b>。<br><b>TGW</b> 有附件時數費 + 每 GB 處理費；<b>VPC Peering 沒有</b>。<br>能共用一個 VPC 時，<b>RAM 共享子網路</b>最省（同 VPC 內無處理費）。"},
{c:"成本",t:"備份與檔案的省錢手段",d:"<b>EFS 生命週期管理</b>：N 天未存取自動轉 IA，被讀到自動轉回，應用程式無感——EFS 成本題的標準答案。<br><b>S3 Requester Pays</b>：公開資料集讓下載方付傳出費（需已驗證 AWS 身分，不支援匿名）。<br><b>DLM</b>：只有 EBS 快照與 AMI 時用它（輕量、不另收費）；出現 RDS/EFS/DynamoDB/FSx 就要改用 <b>AWS Backup</b>。"}
];

const CATS = ["全部", ...new Set(CARDS.map(c=>c.c))];
let deck=[], pos=0, flipped=false, known=JSON.parse(localStorage.getItem("saa_known")||"[]"), curCat="全部";

function build(cat){
  curCat=cat;
  deck = CARDS.map((c,i)=>({...c,i})).filter(c=>(cat==="全部"||c.c===cat));
  deck.sort(()=>Math.random()-.5);
  pos=0; render();
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.toggle("active",b.textContent.startsWith(cat)));
}
function render(){
  const stage=document.getElementById("stage"), ctrl=document.getElementById("controls");
  const remaining=deck.filter(c=>!known.includes(c.i));
  document.getElementById("statbar").textContent=`已標記熟悉：${known.length} / ${CARDS.length} 張`;
  if(pos>=deck.length){
    stage.innerHTML=`<div class="done-card"><h2>🎉 本輪完成！</h2><p style="margin:12px 0;color:#666;">此分類 ${deck.length} 張已看完</p></div>`;
    ctrl.innerHTML=`<button class="btn orange" onclick="build(curCat)">🔄 再來一輪</button><button class="btn" onclick="resetKnown()">清除熟悉標記</button>`;
    document.getElementById("counter").textContent="";
    return;
  }
  const c=deck[pos]; flipped=false;
  document.getElementById("counter").textContent=`第 ${pos+1} / ${deck.length} 張 ${known.includes(c.i)?"（已標熟悉 ✓）":""}`;
  stage.innerHTML=`<div class="scene"><div class="flashcard" id="fc" onclick="flip()">
    <div class="face front"><span class="cat-label">${c.c}</span><div class="term">${c.t}</div><div class="hint">點擊卡片翻面查看說明</div></div>
    <div class="face back"><span class="cat-label">${c.c}</span><div class="def">${c.d}</div></div>
  </div></div>`;
  ctrl.innerHTML=`
    <button class="btn" onclick="prev()">← 上一張</button>
    <button class="btn know" onclick="mark()">✓ 我熟悉了</button>
    <button class="btn orange" onclick="next()">下一張 →</button>`;
}
window.flip=()=>{flipped=!flipped;document.getElementById("fc").classList.toggle("flipped",flipped);};
window.next=()=>{pos++;render();};
window.prev=()=>{if(pos>0){pos--;render();}};
window.mark=()=>{const i=deck[pos].i;if(!known.includes(i))known.push(i);localStorage.setItem("saa_known",JSON.stringify(known));next();};
window.resetKnown=()=>{known=[];localStorage.setItem("saa_known","[]");render();};
window.build=build;
window.curCat=curCat;

document.getElementById("cats").innerHTML=CATS.map(c=>`<button class="cat-btn" onclick="build('${c}')">${c}（${c==="全部"?CARDS.length:CARDS.filter(x=>x.c===c).length}）</button>`).join("");
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();flip();}if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev();});
build("全部");
</script>

<script data-project="aws">
/* ═══════════════════════════════════════════════════════════
   作品集瀏覽計數器 — 前端追蹤 + 顯示
   ───────────────────────────────────────────────────────────
   使用方式（在頁面底部加兩行）：

     <script>window.ANALYTICS_CONFIG={url:'https://xxx.supabase.co',key:'eyJ...'}<\/script>
     <script src="路徑/analytics.js" data-project="ccna-ccnp"><\/script>

   data-project 對應 projects.json 的 id，首頁請填 hub。
   沒設定 url / key 時會自動退回本機 localStorage 計數，不會報錯。

   顯示計數：在頁面放一個 <span id="view-counter"></span> 即可。
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var CFG = window.ANALYTICS_CONFIG || {};
  var script = document.currentScript;
  var PROJECT = (script && script.getAttribute('data-project')) || 'unknown';
  var PAGE = (function () {
    var f = location.pathname.split('/').pop();
    return f && f !== '' ? f : 'index.html';
  })();
  var LIVE = !!(CFG.url && CFG.key);
  var DEDUPE_MINUTES = 30;

  /* ── 匿名訪客 ID：隨機字串，不含任何個人資訊 ── */
  function visitorId() {
    var k = 'pf:vid', v;
    try {
      v = localStorage.getItem(k);
      if (!v) {
        v = 'v' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(k, v);
      }
    } catch (e) {
      v = 'anon';
    }
    return v;
  }

  /* ── 短時間內重複整理不重複計數 ── */
  function shouldCount() {
    var k = 'pf:seen:' + PROJECT + ':' + PAGE;
    try {
      var last = +(sessionStorage.getItem(k) || 0);
      if (Date.now() - last < DEDUPE_MINUTES * 60000) return false;
      sessionStorage.setItem(k, Date.now());
    } catch (e) { /* 隱私模式下就照常計數 */ }
    return true;
  }

  /* ── 本機備援計數（未設定 Supabase 時使用）── */
  function localBump() {
    var k = 'pf:count:' + PROJECT;
    try {
      var d = JSON.parse(localStorage.getItem(k) || '{"total":0,"days":{}}');
      var today = new Date().toISOString().slice(0, 10);
      d.total++;
      d.days[today] = (d.days[today] || 0) + 1;
      localStorage.setItem(k, JSON.stringify(d));
      return d;
    } catch (e) { return { total: 0, days: {} }; }
  }

  function localRead() {
    try {
      return JSON.parse(localStorage.getItem('pf:count:' + PROJECT) || '{"total":0,"days":{}}');
    } catch (e) { return { total: 0, days: {} }; }
  }

  /* ── 送出一筆瀏覽紀錄 ── */
  function track() {
    if (!shouldCount()) return Promise.resolve();
    if (!LIVE) { localBump(); return Promise.resolve(); }

    return fetch(CFG.url + '/rest/v1/page_views', {
      method: 'POST',
      headers: {
        'apikey': CFG.key,
        'Authorization': 'Bearer ' + CFG.key,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        project_id: PROJECT,
        page_path: PAGE,
        visitor_id: visitorId(),
        referrer: document.referrer ? document.referrer.slice(0, 300) : null
      })
    }).catch(function () { localBump(); });
  }

  /* ── 讀取某專案的統計摘要 ── */
  function summary(projectId) {
    projectId = projectId || PROJECT;
    if (!LIVE) {
      var d = localRead();
      var today = new Date().toISOString().slice(0, 10);
      var ym = today.slice(0, 7);
      var month = Object.keys(d.days).reduce(function (s, k) {
        return k.indexOf(ym) === 0 ? s + d.days[k] : s;
      }, 0);
      return Promise.resolve({
        project_id: projectId, total_views: d.total,
        today_views: d.days[today] || 0, month_views: month, local: true
      });
    }
    return fetch(CFG.url + '/rest/v1/v_views_summary?project_id=eq.' + encodeURIComponent(projectId),
      { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        return rows[0] || { project_id: projectId, total_views: 0, today_views: 0, month_views: 0 };
      })
      .catch(function () { return { project_id: projectId, total_views: 0, today_views: 0, month_views: 0, error: true }; });
  }

  /* ── 讀取全部專案的統計 ── */
  function allSummary() {
    if (!LIVE) return Promise.resolve([]);
    return fetch(CFG.url + '/rest/v1/v_views_summary?order=total_views.desc',
      { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 讀取每日趨勢（近 N 天）── */
  function daily(projectId, days) {
    if (!LIVE) return Promise.resolve([]);
    var since = new Date(Date.now() - (days || 30) * 86400000).toISOString().slice(0, 10);
    var q = '/rest/v1/v_views_daily?day=gte.' + since + '&order=day.asc';
    if (projectId) q += '&project_id=eq.' + encodeURIComponent(projectId);
    return fetch(CFG.url + q, { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 讀取每月統計 ── */
  function monthly(projectId) {
    if (!LIVE) return Promise.resolve([]);
    var q = '/rest/v1/v_views_monthly?order=month.asc';
    if (projectId) q += '&project_id=eq.' + encodeURIComponent(projectId);
    return fetch(CFG.url + q, { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 把數字填進 #view-counter ── */
  function paint() {
    var box = document.getElementById('view-counter');
    if (!box) return;
    summary().then(function (s) {
      box.innerHTML =
        '<span class="vc-item"><b>' + (s.today_views || 0) + '</b> 今日</span>' +
        '<span class="vc-item"><b>' + (s.month_views || 0) + '</b> 本月</span>' +
        '<span class="vc-item"><b>' + (s.total_views || 0) + '</b> 總計</span>' +
        (s.local ? '<span class="vc-note">本機計數</span>' : '');
      box.classList.add('vc-ready');
    });
  }

  window.PortfolioAnalytics = {
    project: PROJECT, live: LIVE,
    track: track, summary: summary, allSummary: allSummary,
    daily: daily, monthly: monthly, paint: paint
  };

  function boot() { track().then(paint); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<!-- portfolio-analytics:end -->
</body>
</html>
