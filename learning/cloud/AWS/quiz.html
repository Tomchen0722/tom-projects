<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAA-C03 互動模擬試題</title>
<style>
  :root{--orange:#ff9900;--dark:#232f3e;--bg:#f5f6fa;--card:#fff;--good:#1e8e3e;--bad:#d93025;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
  body{background:var(--bg);color:#222;min-height:100vh;}
  header{background:var(--dark);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{font-size:1.2rem;}
  header h1 span{color:var(--orange);}
  .container{max-width:860px;margin:0 auto;padding:24px 16px;}
  .card{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;}
  .domain-tag{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:20px;background:#e8f0fe;color:#1a56db;margin-bottom:12px;}
  .q-text{font-size:1.05rem;line-height:1.7;margin-bottom:16px;font-weight:600;}
  .multi-hint{color:#b45309;font-size:.85rem;margin-bottom:10px;}
  .opt{display:block;width:100%;text-align:left;padding:12px 16px;margin:8px 0;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:.95rem;line-height:1.6;transition:.15s;}
  .opt:hover{border-color:var(--orange);background:#fff8ef;}
  .opt.selected{border-color:#1a56db;background:#e8f0fe;}
  .opt.correct{border-color:var(--good);background:#e6f4ea;}
  .opt.wrong{border-color:var(--bad);background:#fce8e6;}
  .opt:disabled{cursor:default;}
  .explain{margin-top:16px;padding:16px;border-radius:8px;background:#fffbe6;border-left:4px solid var(--orange);line-height:1.7;font-size:.92rem;display:none;}
  .explain.show{display:block;}
  .explain .verdict{font-weight:700;margin-bottom:6px;}
  .btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:#e88b00;}
  .btn-outline{background:#fff;border:2px solid var(--dark);color:var(--dark);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;flex-wrap:wrap;}
  .progress-wrap{background:#ddd;border-radius:10px;height:10px;margin-bottom:20px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--orange);width:0;transition:.3s;}
  .stat{font-size:.9rem;color:#555;}
  .result-big{font-size:3rem;font-weight:800;text-align:center;margin:12px 0;}
  .pass{color:var(--good);} .fail{color:var(--bad);}
  .domain-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:.95rem;}
  .setup-opt{padding:16px;border:2px solid #ddd;border-radius:10px;margin:10px 0;cursor:pointer;transition:.15s;}
  .setup-opt:hover{border-color:var(--orange);}
  .setup-opt h3{font-size:1rem;margin-bottom:4px;}
  .setup-opt p{font-size:.85rem;color:#666;}
  a.back{color:#fff;text-decoration:none;font-size:.9rem;opacity:.85;}
  a.back:hover{opacity:1;}
  @media(max-width:600px){.container{padding:16px 10px;}.card{padding:16px;}}
</style>
</head>
<body>
<header>
  <h1>AWS <span>SAA-C03</span> 互動模擬試題</h1>
  <a class="back" href="index.html">← 回學習中心</a>
</header>
<div class="container" id="app"></div>

<script>
// ===== 題庫 =====
// domain: 1=安全架構(30%) 2=彈性架構(26%) 3=高效能架構(24%) 4=成本優化(20%)
// answer: 正確選項索引陣列（多選題含多個）
const QUESTIONS = [
// ---------- Domain 1: 設計安全架構 ----------
{d:1,q:"公司要求 EC2 應用程式存取 S3 儲存貯體，且不得在程式碼或設定檔中儲存任何長期憑證。最安全的做法是？",o:["建立 IAM User 並將 Access Key 存於環境變數","建立 IAM Role 並附加到 EC2 執行個體的 Instance Profile","使用根帳號的 Access Key","將憑證加密後存放於 S3"],a:[1],e:"IAM Role + Instance Profile 讓 EC2 透過臨時憑證存取 AWS 服務，無需儲存長期憑證，是官方最佳實踐。Access Key 屬長期憑證，應避免。"},
{d:1,q:"某公司需確保 S3 中所有物件在靜態時加密，且必須自行管理金鑰輪換並保留金鑰使用稽核紀錄。應選擇哪種加密方式？",o:["SSE-S3","SSE-KMS 搭配客戶管理金鑰 (CMK)","SSE-C","僅使用 HTTPS 傳輸"],a:[1],e:"SSE-KMS 客戶管理金鑰支援自訂輪換政策，且所有金鑰使用都記錄在 CloudTrail，滿足稽核需求。SSE-S3 無法提供金鑰層級稽核；SSE-C 需自行傳送金鑰、管理負擔大。"},
{d:1,q:"安全團隊需要集中檢視多個 AWS 帳號的安全發現（如異常 API 呼叫、遭入侵的執行個體）。哪個服務組合最合適？",o:["CloudWatch + SNS","GuardDuty + Security Hub（跨帳號彙整）","AWS Config 單獨使用","Trusted Advisor"],a:[1],e:"GuardDuty 提供威脅偵測（異常 API、挖礦、入侵跡象），Security Hub 可跨帳號彙整所有安全發現並統一檢視。這是多帳號安全監控的標準組合。"},
{d:1,q:"Web 應用程式部署在 ALB 後方，需防護 SQL Injection 與 XSS 攻擊。應使用哪個服務？",o:["AWS Shield Standard","AWS WAF 關聯至 ALB","Security Group 規則","Network ACL"],a:[1],e:"AWS WAF 可在 ALB、CloudFront、API Gateway 上過濾 Layer 7 攻擊（SQLi、XSS）。Shield 針對 DDoS；SG/NACL 只能控制 IP/Port，無法檢查封包內容。"},
{d:1,q:"公司政策要求：開發人員只能在 us-east-1 與 ap-northeast-1 建立資源，此限制必須套用到 AWS Organizations 中所有帳號且無法被成員帳號管理員繞過。應使用？",o:["每個帳號各自設定 IAM Policy","Service Control Policy (SCP) 限制區域","AWS Config 規則","CloudTrail 監控"],a:[1],e:"SCP 是 Organizations 層級的防護欄，對成員帳號內所有使用者（含 root 與管理員）強制生效，無法被繞過。IAM Policy 可被帳號管理員修改；Config 只能偵測不能預防。"},
{d:1,q:"應用程式需要儲存資料庫密碼，並要求每 30 天自動輪換。最合適的服務是？",o:["SSM Parameter Store (Standard)","AWS Secrets Manager","S3 + KMS","DynamoDB 加密資料表"],a:[1],e:"Secrets Manager 原生支援自動輪換（與 RDS 等整合），這是它與 Parameter Store 最大的差異。Parameter Store 免費但無內建自動輪換。"},
{d:1,q:"VPC 中的私有子網路 EC2 需要存取 S3，但流量不得經過網際網路。最佳做法是？",o:["NAT Gateway","S3 的 Gateway VPC Endpoint","Internet Gateway","VPN 連線"],a:[1],e:"Gateway Endpoint（支援 S3 與 DynamoDB）讓私有子網路直接透過 AWS 內部網路存取 S3，免費且流量不出網際網路。NAT Gateway 會產生費用且流量仍走公有路徑。"},
{d:1,q:"公司要求對 S3 儲存貯體的存取進行精細控制：僅允許特定 VPC Endpoint 的請求。應在哪裡設定此限制？",o:["IAM User Policy","S3 Bucket Policy 搭配 aws:SourceVpce 條件","Security Group","Route Table"],a:[1],e:"Bucket Policy 支援 Condition（如 aws:SourceVpce），可拒絕非指定 VPC Endpoint 的所有存取。這是資源型政策的典型用法。"},
{d:1,q:"需要讓行動 App 使用者透過 Facebook/Google 登入後，取得暫時性 AWS 憑證以上傳照片至 S3。應使用？",o:["IAM Users 為每位使用者建帳號","Amazon Cognito Identity Pool（聯合身分）","共用一組 Access Key","AWS SSO"],a:[1],e:"Cognito Identity Pool 支援社交身分供應商聯合登入，並發放暫時性 AWS 憑證給用戶端直接存取 AWS 資源。為每位 App 使用者建 IAM User 不可擴展也不安全。"},
{d:1,q:"稽核要求記錄所有 AWS 帳號中 API 呼叫的完整歷史，且日誌檔必須防竄改。應如何設計？（選兩項）",o:["啟用 CloudTrail 並寫入 S3","在 S3 啟用 MFA Delete 與 Log File Validation","使用 CloudWatch Metrics","啟用 VPC Flow Logs"],a:[0,1],e:"CloudTrail 記錄所有 API 呼叫；Log File Validation 提供數位簽章驗證日誌完整性，MFA Delete 防止日誌被刪除。CloudWatch Metrics 是效能指標、Flow Logs 是網路流量，皆非 API 稽核。"},
{d:1,q:"某應用需加密 EBS 磁碟區。關於 EBS 加密，下列何者正確？",o:["加密後會顯著降低 IOPS 效能","加密的快照建立的磁碟區自動加密，且加密對效能影響極小","必須自行安裝加密軟體","只有 io2 類型支援加密"],a:[1],e:"EBS 加密使用 KMS，對延遲影響極小；加密快照所還原/複製的磁碟區維持加密。所有磁碟區類型皆支援，無需額外軟體。"},
{d:1,q:"公司有一個 VPC，內含公有與私有子網路。決定子網路是否為「公有」的關鍵因素是？",o:["子網路的 CIDR 大小","路由表中是否有指向 Internet Gateway 的路由","Security Group 設定","是否啟用自動指派公有 IP"],a:[1],e:"公有子網路的定義：其路由表有 0.0.0.0/0 → IGW 的路由。自動指派公有 IP 只是輔助，沒有 IGW 路由仍無法連網。"},
// ---------- Domain 2: 設計彈性架構 ----------
{d:2,q:"應用程式部署於單一 AZ 的 EC2 上，公司要求達到高可用性，即使一個 AZ 故障也能繼續服務。最佳架構是？",o:["在同一 AZ 部署更多 EC2","使用 Auto Scaling Group 跨多個 AZ + ALB","定期建立 AMI 備份","改用更大的執行個體"],a:[1],e:"跨 AZ 的 ASG + ALB 是高可用標準架構：AZ 故障時 ALB 將流量導向健康 AZ，ASG 自動補充執行個體。垂直擴展與備份都無法解決 AZ 級故障。"},
{d:2,q:"RDS MySQL 資料庫需要：(1) AZ 故障時自動容錯移轉 (2) 分擔讀取流量。應如何設計？",o:["啟用 Multi-AZ 即可同時滿足兩者","啟用 Multi-AZ（容錯移轉）+ Read Replica（讀取分流）","僅建立多個 Read Replica","使用更大的執行個體"],a:[1],e:"Multi-AZ 的 standby 不可讀，僅供容錯移轉；Read Replica 分擔讀取但預設無自動容錯移轉。兩個需求需要兩種機制並用。"},
{d:2,q:"公司要求 RPO 5 分鐘、RTO 1 小時的災難復原策略，並希望成本低於完整雙站架構。最合適的 DR 策略是？",o:["Backup & Restore","Pilot Light","Multi-Site Active-Active","僅使用快照"],a:[1],e:"Pilot Light 在 DR 區域保留最小核心（如持續複寫的資料庫），災難時快速擴展其餘元件，可達成分鐘級 RPO 與小時級 RTO，成本遠低於 Active-Active。Backup & Restore 的 RTO 通常過長。"},
{d:2,q:"兩個微服務間透過訊息溝通，要求：訊息不可遺失、消費者故障時訊息需保留、每則訊息只能被處理一次且需按順序。應使用？",o:["SNS","SQS Standard Queue","SQS FIFO Queue","EventBridge"],a:[2],e:"FIFO Queue 保證順序與 exactly-once 處理。Standard Queue 是 at-least-once 且盡力排序。SNS 是推播模式，訂閱者離線可能遺失訊息（除非搭配 SQS）。"},
{d:2,q:"靜態網站部署在 S3，要求全球使用者低延遲存取且具備高可用性。應加上？",o:["在每個區域建立 S3 儲存貯體","CloudFront 發佈 S3 內容","Global Accelerator","ElastiCache"],a:[1],e:"CloudFront 透過全球邊緣節點快取靜態內容，降低延遲並提高可用性，是 S3 靜態網站的標準搭配。Global Accelerator 適用於非 HTTP/需固定 IP 的場景。"},
{d:2,q:"應用程式使用 SQS 處理訂單，偶爾有無法處理的毒訊息 (poison message) 反覆重試導致阻塞。最佳解法是？",o:["加大 Visibility Timeout","設定 Dead-Letter Queue (DLQ) 與 maxReceiveCount","改用 SNS","增加消費者數量"],a:[1],e:"DLQ 會在訊息重試超過 maxReceiveCount 後將其移出主佇列，避免毒訊息阻塞處理，並可供後續分析。"},
{d:2,q:"某網站流量有明顯的每日高峰（上午 9 點暴增）。Auto Scaling 應如何設定以確保高峰前已備妥容量？",o:["Simple Scaling","Scheduled Scaling（排程擴展）","僅手動調整","降低健康檢查頻率"],a:[1],e:"流量模式可預測時，Scheduled Scaling 可在高峰前預先擴容，避免反應式擴展的延遲。也可搭配 Target Tracking 處理非預期流量。"},
{d:2,q:"公司需要將 on-premises 資料中心與 AWS VPC 建立專用、穩定頻寬、低延遲的私有連線，不經過網際網路。應使用？",o:["Site-to-Site VPN","AWS Direct Connect","VPC Peering","Transit Gateway 單獨使用"],a:[1],e:"Direct Connect 提供專線連接，頻寬穩定且不走網際網路。VPN 走網際網路（加密但頻寬/延遲不穩定）。VPC Peering 與 Transit Gateway 用於 VPC 之間。"},
{d:2,q:"應用程式需要共用檔案系統，讓多個 AZ 中的多台 Linux EC2 同時掛載讀寫。應使用？",o:["EBS Multi-Attach","Amazon EFS","S3","Instance Store"],a:[1],e:"EFS 是全受管 NFS，支援跨 AZ 多執行個體同時掛載。EBS Multi-Attach 限同一 AZ 且僅 io1/io2；S3 不是檔案系統（無法直接掛載為 POSIX）。"},
{d:2,q:"DynamoDB 資料表需要跨區域複寫，讓多個區域的使用者都能低延遲讀寫同一份資料。應使用？",o:["DynamoDB Streams + Lambda 自行複寫","DynamoDB Global Tables","定期匯出至 S3 再匯入","Read Replica"],a:[1],e:"Global Tables 提供全受管的多區域多主動 (multi-active) 複寫，各區域皆可讀寫。自行複寫維運成本高；DynamoDB 沒有 Read Replica 概念。"},
{d:2,q:"Route 53 需設定：主站故障時自動將流量導向備援站點。應使用哪種路由政策？",o:["Weighted","Latency-based","Failover 搭配 Health Check","Geolocation"],a:[2],e:"Failover 路由搭配健康檢查：主要記錄不健康時自動切換至次要記錄，是 DNS 層級的主備容錯移轉。"},
// ---------- Domain 3: 設計高效能架構 ----------
{d:3,q:"資料庫讀取壓力大，大量重複查詢相同資料，需將讀取延遲降至次毫秒 (sub-millisecond)。應加入？",o:["Read Replica","ElastiCache (Redis/Memcached) 快取層","更大的 RDS 執行個體","S3"],a:[1],e:"ElastiCache 記憶體快取可提供次毫秒延遲並大幅減輕資料庫負載。Read Replica 仍是磁碟型讀取，延遲為毫秒級。"},
{d:3,q:"每天需將 500 GB 影片檔從 on-premises 上傳至 S3，上傳常因網路距離而緩慢。最能加速上傳的功能是？",o:["S3 Multipart Upload 單獨使用","S3 Transfer Acceleration（搭配 Multipart Upload）","AWS Snowball 每天寄送","降低檔案解析度"],a:[1],e:"Transfer Acceleration 利用 CloudFront 邊緣節點加速遠距離上傳，搭配 Multipart Upload 平行傳輸效果最佳。Snowball 適合一次性大量遷移，不適合每日傳輸。"},
{d:3,q:"Lambda 函數需要處理 S3 上傳的圖片並產生縮圖，偶爾冷啟動延遲影響體驗，且尖峰時併發量大。下列何者能改善冷啟動？",o:["增加函數逾時時間","設定 Provisioned Concurrency","改用更大的記憶體就能完全消除冷啟動","改用 EC2"],a:[1],e:"Provisioned Concurrency 預先初始化執行環境，消除冷啟動延遲。增加記憶體可加速初始化但無法消除冷啟動。"},
{d:3,q:"需要對 S3 中的大量 CSV/Parquet 資料執行 ad-hoc SQL 查詢，不想建置任何伺服器或 ETL。應使用？",o:["RDS","Amazon Athena","EMR 叢集","Redshift 佈建叢集"],a:[1],e:"Athena 是無伺服器查詢服務，直接以 SQL 查詢 S3 資料，按掃描量計費，最符合 ad-hoc、免維運需求。"},
{d:3,q:"高效能運算 (HPC) 應用需要節點間極低延遲、高吞吐的網路。EC2 應如何配置？",o:["Spread Placement Group","Cluster Placement Group + Enhanced Networking","跨多 AZ 部署","使用 T 系列執行個體"],a:[1],e:"Cluster Placement Group 將執行個體放在同一機架區域內，提供最低延遲與最高網路吞吐，是 HPC 標準配置。Spread 是為了降低相關故障、反而分散。"},
{d:3,q:"某資料庫工作負載需要 EBS 提供穩定 64,000 IOPS。應選擇哪種磁碟區？",o:["gp2","gp3","io2 Block Express / io2","st1"],a:[2],e:"io2 支援最高 64,000 IOPS（Block Express 可達 256,000），適合關鍵資料庫。gp3 上限 16,000 IOPS；st1 是吞吐型 HDD。"},
{d:3,q:"全球使用者存取的 TCP 遊戲伺服器（非 HTTP），需要固定的 Anycast IP 與最低網路延遲。應使用？",o:["CloudFront","AWS Global Accelerator","Route 53 Latency Routing","ALB"],a:[1],e:"Global Accelerator 提供 2 個固定 Anycast IP，流量從最近邊緣節點進入 AWS 骨幹網路，適合 TCP/UDP 非 HTTP 工作負載。CloudFront 是 HTTP 快取。"},
{d:3,q:"Kinesis Data Streams 的消費者處理速度落後，發現分片 (shard) 吞吐量已達上限。最直接的解法是？",o:["改用 SQS","增加分片數量 (reshard)","減少生產者","加大訊息大小"],a:[1],e:"Kinesis 吞吐量以分片為單位（每分片寫入 1MB/s、讀取 2MB/s），增加分片即水平擴展吞吐量。"},
{d:3,q:"公司的 API 流量爆增時 RDS 連線數耗盡，大量 Lambda 併發連線導致資料庫崩潰。最佳解法是？",o:["加大 RDS 執行個體","使用 RDS Proxy 管理連線池","增加 Lambda 記憶體","改用 EBS"],a:[1],e:"RDS Proxy 建立共用連線池，複用資料庫連線，專門解決 Lambda 等高併發、短生命週期連線壓垮資料庫的問題。"},
{d:3,q:"需要一個全受管的資料倉儲對 PB 級結構化資料執行複雜分析查詢 (OLAP)。應使用？",o:["RDS MySQL","DynamoDB","Amazon Redshift","ElastiCache"],a:[2],e:"Redshift 是 PB 級 MPP 資料倉儲，專為 OLAP 分析設計。RDS 適合 OLTP；DynamoDB 是 NoSQL 鍵值存取。"},
// ---------- Domain 4: 設計成本優化架構 ----------
{d:4,q:"批次影像處理工作可隨時中斷並重新執行，需要大量運算且希望成本最低。應使用哪種 EC2 購買選項？",o:["On-Demand","Reserved Instances","Spot Instances","Dedicated Hosts"],a:[2],e:"Spot 執行個體最高可省 90%，適合可容錯、可中斷的批次工作。RI 適合穩定長期負載；Dedicated Hosts 最貴，用於授權/合規需求。"},
{d:4,q:"S3 中的日誌檔前 30 天常被存取，之後很少存取但需保留 1 年供稽核，最後刪除。最省成本的設計是？",o:["全部存 S3 Standard","Lifecycle Policy：30 天後轉 S3 Standard-IA / Glacier，1 年後過期刪除","全部存 Glacier Deep Archive","手動搬移"],a:[1],e:"Lifecycle Policy 自動化分層：熱資料 Standard → 冷資料 IA/Glacier → 到期刪除，兼顧存取需求與成本。全部放 Deep Archive 會讓前 30 天存取變慢且取回費高。"},
{d:4,q:"存取模式無法預測的 S3 資料（有些物件常存取、有些幾乎不碰），希望自動優化儲存成本且不影響效能。應使用？",o:["S3 Standard-IA","S3 Intelligent-Tiering","Glacier Instant Retrieval","One Zone-IA"],a:[1],e:"Intelligent-Tiering 依存取模式自動在存取層間搬移物件，無取回費，最適合存取模式未知的資料。Standard-IA 若頻繁存取反而更貴（有取回費）。"},
{d:4,q:"公司的基準工作負載穩定運行 EC2 與 Fargate，希望以承諾使用量換取最大折扣且保有跨執行個體家族與區域的彈性。應購買？",o:["Standard Reserved Instances","Compute Savings Plans","Spot Instances","On-Demand Capacity Reservation"],a:[1],e:"Compute Savings Plans 承諾每小時花費，折扣適用於任何區域、家族的 EC2、Fargate 與 Lambda，彈性最高。Standard RI 綁定家族與區域。"},
{d:4,q:"需要監控 AWS 帳單，當預測費用將超過每月 $10,000 時收到警告。應使用？",o:["Cost Explorer 手動檢查","AWS Budgets 設定預算警示","CloudWatch CPU 警報","Trusted Advisor"],a:[1],e:"AWS Budgets 可設定實際或「預測」費用門檻並透過 SNS/Email 發出警示。Cost Explorer 用於分析歷史費用，不會主動警告。"},
{d:4,q:"NAT Gateway 的資料處理費用過高，分析後發現大部分流量是私有子網路 EC2 存取 S3。最有效的降費方式是？",o:["改用更多 NAT Gateway","建立 S3 Gateway VPC Endpoint 讓流量繞過 NAT","壓縮資料","改用公有子網路"],a:[1],e:"Gateway Endpoint 免費且讓 S3 流量不經 NAT Gateway，直接消除該部分資料處理費，是常見的成本優化考點。"},
{d:4,q:"開發/測試環境的 EC2 只在上班時間（週一至五 9:00-18:00）使用，如何最有效降低成本？",o:["購買 3 年期 RI","以排程（如 Instance Scheduler / Lambda + EventBridge）於下班時間自動停止執行個體","改用 Spot","加大執行個體"],a:[1],e:"停止的執行個體不收運算費。自動排程開關機可省約 70% 運算成本。RI 適合 24/7 負載，對僅上班時間使用反而不划算。"},
{d:4,q:"公司多個帳號透過 AWS Organizations 管理，希望彙整帳單以獲得量級折扣並集中付款。應使用？",o:["每個帳號分開付款","Consolidated Billing（合併帳單）","各帳號購買各自 RI","Cost Categories"],a:[1],e:"Organizations 的 Consolidated Billing 集中付款、合併用量以達到量級折扣門檻，且 RI/Savings Plans 折扣可在帳號間共享。"},
// ===== 追加題庫：Domain 1 安全架構 =====
{d:1,q:"Cognito User Pool 和 Identity Pool 最主要的功能差異是？",o:["User Pool 管理 AWS 資源存取；Identity Pool 管理使用者帳號","User Pool 提供使用者目錄（登入/註冊/MFA）；Identity Pool 發放臨時 AWS 憑證給已驗證使用者","兩者功能完全相同，只是容量不同","Identity Pool 只能搭配 Facebook 登入"],a:[1],e:"User Pool = 使用者帳號管理（類似 ActiveDirectory）：登入、MFA、密碼政策。Identity Pool = AWS 資源授權：把 User Pool 或社交 IdP 的 Token 換成臨時 AWS 憑證（AssumeRoleWithWebIdentity）。兩者常搭配使用：先 User Pool 驗身，再 Identity Pool 換憑證。"},
{d:1,q:"ECS 上的容器需要存取 S3，最安全的做法是？",o:["把 AWS Access Key 存入 Docker Image","在 EC2 Instance Profile 附加 IAM Role","為 ECS Task 建立 Task IAM Role 並附加所需最小權限","使用環境變數傳入憑證"],a:[2],e:"ECS Task IAM Role 讓每個 Task 有獨立的最小權限 IAM Role（透過 ECS Agent 提供臨時憑證），是容器安全的最佳實踐。Instance Profile 會讓同一 EC2 上所有容器共用同一組憑證，違反最小權限。"},
{d:1,q:"API Gateway 支援哪三種授權方式？",o:["IAM、Cognito Authorizer、Lambda Authorizer（自訂）","只有 API Key","只有 OAuth 2.0","IP 白名單、API Key、密碼"],a:[0],e:"API Gateway 三種授權：(1) IAM Auth：呼叫者用 AWS SigV4 簽署請求，適合 AWS 服務間呼叫；(2) Cognito User Pool Authorizer：驗證 JWT Token；(3) Lambda Authorizer（Custom Authorizer）：自訂邏輯（如驗證 OAuth Token），返回 IAM Policy。"},
{d:1,q:"AWS Organizations 的 SCP（Service Control Policy）套用到 Management Account（根帳號）的效果是？",o:["完全限制根帳號的所有操作","SCP 不影響 Management Account，Management Account 始終不受 SCP 限制","SCP 會讓根帳號無法登入","SCP 只影響 IAM User，不影響 root user"],a:[1],e:"這是 Organizations 最重要的陷阱：SCP 對 Management Account 無效，Management Account 的 IAM User 和 root 不受 SCP 約束。這也是為什麼 Management Account 應該盡量不部署工作負載，只用於帳號管理。"},
{d:1,q:"KMS 和 CloudHSM 最主要的使用情境差異是？",o:["KMS 用於加密資料；CloudHSM 用於網路流量加密","KMS 是全受管共用 HSM（AWS 管理金鑰元件）；CloudHSM 是你專屬的硬體安全模組，符合 FIPS 140-2 Level 3","兩者功能完全相同","CloudHSM 比 KMS 便宜"],a:[1],e:"KMS 適合大多數加密需求（簡單受管、按呼叫計費）。CloudHSM 適合：需要 FIPS 140-2 Level 3 合規（KMS 只有 Level 2）、需要完全控制 HSM 硬體、特定金融/政府法規要求。CloudHSM 費用高且需自管。"},
{d:1,q:"公司需要稽核所有 AWS 帳號的合規狀態（如「所有 S3 Bucket 是否啟用加密」），並能自動修復不合規資源。應使用？",o:["CloudTrail + CloudWatch 自訂規則","AWS Config Rules + Auto Remediation","GuardDuty","AWS Trusted Advisor"],a:[1],e:"AWS Config Rules 持續評估資源設定是否符合規則（如 s3-bucket-server-side-encryption-enabled），不合規時可觸發 Auto Remediation（透過 Systems Manager Automation 文件自動修復）。CloudTrail 記錄操作歷史、GuardDuty 偵測威脅，兩者不做合規評估。"},
{d:1,q:"S3 Pre-signed URL 的主要用途是？",o:["讓沒有 AWS 帳號的外部用戶暫時存取特定 S3 物件（有效期限內）","讓 S3 物件永久公開","加速 S3 物件的下載速度","加密 S3 物件"],a:[0],e:"Pre-signed URL 由有權限的 IAM 身分簽署，包含有效期（最長 7 天）。持有 URL 的任何人（不需 AWS 帳號）都能在到期前 GET/PUT。常見用途：前端直接上傳到 S3（避免經過後端）、提供私有物件的臨時下載連結。"},
{d:1,q:"Amazon Macie 的主要功能是？",o:["偵測 EC2 上的惡意程式","掃描 S3 中的敏感資料（如個人識別資訊 PII、信用卡號），並評估 S3 的資安風險","管理 AWS 的網路安全群組","稽核 IAM 權限設定"],a:[1],e:"Macie 使用機器學習掃描 S3 物件，自動識別個資（PII）、醫療資料、財務資訊等敏感內容，並回報 S3 Bucket 的存取設定風險。GDPR/HIPAA 合規常用工具。GuardDuty 偵測網路威脅、Inspector 掃描 EC2/容器漏洞。"},
{d:1,q:"IAM Permission Boundary 的作用是？",o:["替代 SCP，跨帳號設定限制","設定 IAM Entity 能獲得的最大權限上限，即使其 Policy 授予更多權限也無法超越","讓 IAM Role 無法被刪除","跨 Region 同步 IAM 設定"],a:[1],e:"Permission Boundary 是 IAM Entity（User/Role）可獲得的最大有效權限「天花板」——即使 SCP 允許、Identity Policy 允許，但 Boundary 不允許就無法執行。常用於允許開發者自建 IAM Role 但防止提權（Developer 能建 Role 但 Role 的權限不能超過 Boundary）。"},
{d:1,q:"公司的 Web 應用需要支援使用 Google 帳號登入，並讓使用者能上傳個人照片到自己的 S3 prefix（不同使用者不能互相存取）。最適合的架構是？",o:["為每個使用者建立 IAM User","Cognito User Pool（Google federated）+ Identity Pool，IAM Role Policy 使用 ${cognito-identity.amazonaws.com:sub} 變數限制 S3 prefix","API Key 管理","Lambda 代理所有 S3 操作"],a:[1],e:"Cognito Identity Pool 發放的臨時憑證，其 IAM Role Session Policy 可用 ${cognito-identity.amazonaws.com:sub}（使用者唯一 ID）變數來限制每個使用者只能存取自己的 S3 prefix（如 my-bucket/user/${sub}/）。這是 AWS 推薦的 user-isolated S3 存取模式。"},
{d:1,q:"以下關於 AWS IAM 的說明，何者正確？",o:["IAM 是 Region 服務，每個 Region 有獨立的 IAM","IAM 是全域服務，Users、Groups、Roles、Policies 在所有 Region 共用","每個 AWS 帳號最多只能有 100 個 IAM User","IAM Group 可以成為另一個 IAM Group 的成員"],a:[1],e:"IAM 是全域（Global）服務：建立的 User/Role/Policy 在所有 Region 都可用。IAM 不像 EC2/S3 有 Region 限制。常見考試陷阱：IAM Group 不能巢狀（Group 不能成為另一個 Group 的成員）；一個 User 可以是多個 Group 的成員。"},
{d:1,q:"跨帳號存取：帳號 A 的應用需要存取帳號 B 的 S3 Bucket。最安全的做法是？",o:["把帳號 B 的 Access Key 提供給帳號 A","在帳號 A 建立 IAM Role，在帳號 B 的 S3 Bucket Policy 允許帳號 A 的 Role 存取，帳號 A 的應用 AssumeRole 後存取","在兩個帳號建立同名 IAM User","使用 VPC Peering"],a:[1],e:"跨帳號存取標準模式：帳號 B 資源（S3 Bucket Policy）允許帳號 A 的特定 ARN；帳號 A 的應用 AssumeRole 取得臨時憑證後存取。全程使用臨時憑證，不需傳遞長期 Access Key。"},
// ===== 追加題庫：Domain 2 彈性架構 =====
{d:2,q:"ECS 的 Fargate 啟動類型與 EC2 啟動類型最主要的差異是？",o:["Fargate 不支援 Docker","Fargate 是無伺服器容器（不需管理底層 EC2），按 vCPU/Memory 秒計費；EC2 啟動類型需自管 EC2 Node","Fargate 只支援 Windows 容器","EC2 啟動類型不支援 ALB 整合"],a:[1],e:"Fargate：AWS 管理底層基礎設施，按實際 Task 資源計費，適合不想管 EC2 的團隊。EC2：自己管 EC2 Node，可使用 Spot Instance 降費、可使用 GPU、可控制網路，適合需要深層控制或成本極度優化的場景。"},
{d:2,q:"Step Functions 的 Standard Workflow 和 Express Workflow 最主要的差異是？",o:["Standard 比 Express 快","Standard 每次執行最長 1 年，支援 exactly-once；Express 最長 5 分鐘，at-least-once，吞吐量高","Express 比 Standard 更便宜但功能相同","Standard 只用於 Lambda 整合"],a:[1],e:"Standard：長時間流程（最長 1 年）、exactly-once 語意、可視化除錯、按狀態轉換計費。Express：高頻短暫流程（最長 5 分鐘）、at-least-once、適合 IoT/串流等高吞吐場景、按執行時間計費。選擇依流程時長和精確性需求。"},
{d:2,q:"SQS FIFO 佇列的 MessageGroupId 屬性的用途是？",o:["決定訊息的儲存位置","在同一 Group ID 內確保訊息的嚴格順序，不同 Group ID 的訊息可平行處理","設定訊息的優先順序","決定訊息的保留時間"],a:[1],e:"FIFO 佇列中，相同 MessageGroupId 的訊息嚴格按照 FIFO 順序處理（同一時間只有一個消費者處理同一 Group 的訊息）。不同 MessageGroupId 的訊息可平行處理，這樣能在保持特定群組順序的同時提升整體吞吐量。"},
{d:2,q:"SNS + SQS Fan-out 架構相較於 SNS 直接觸發多個 Lambda 的優點是？",o:["SNS + SQS 費用更低","SQS 提供訊息持久化、retry 機制和解耦；Lambda 直接訂閱 SNS 若 Lambda 失敗，訊息可能永久遺失","SNS + SQS 延遲更低","Lambda 不能直接訂閱 SNS"],a:[1],e:"SNS 直接觸發 Lambda（Push）：Lambda 失敗後重試次數有限（2次），訊息可能遺失。SNS→SQS→Lambda：SQS 保留訊息（最長 14 天），可設定 VisibilityTimeout 和 DLQ，解耦後 Lambda 掛掉不影響訊息持久性。高可靠度場景應使用 SNS→SQS→Lambda。"},
{d:2,q:"Amazon Aurora Global Database 的主要用途是？",o:["在同一 Region 內提供高可用性","跨 Region 低延遲讀取，且在主 Region 故障時可在約 1 分鐘內將次要 Region 提升為主要（RTO ~1分鐘）","替代 Multi-AZ 降低成本","在多個 AZ 之間分散寫入流量"],a:[1],e:"Aurora Global Database：主 Region 寫入，複製到最多 5 個次要 Region（複製延遲通常 &lt;1 秒）。用途：(1) 全球低延遲讀取；(2) 區域性 DR（RTO ~1 分鐘，RPO ~1 秒）。與 Multi-AZ 不同，Global Database 跨 Region，不只跨 AZ。"},
{d:2,q:"AWS Lambda Destinations（目的地）的功能是？",o:["設定 Lambda 函數的觸發器","非同步 Lambda 執行成功或失敗後，將結果路由到 SQS、SNS、EventBridge 或另一個 Lambda","限制 Lambda 的最大並發數","設定 Lambda 的 VPC 連線"],a:[1],e:"Lambda Destinations 適用於非同步呼叫：onSuccess 路由成功結果，onFailure 路由失敗結果（更好的替代方案來取代 DLQ）。可路由到 SQS/SNS/EventBridge/Lambda，讓你在不修改函數程式碼的情況下處理執行結果。"},
{d:2,q:"Amazon EventBridge 相較於 SNS/SQS 最獨特的功能是？",o:["EventBridge 延遲比 SNS 低","Event Bus 可接收第三方 SaaS（如 Zendesk、Datadog）的事件，並根據事件內容進行精細路由","EventBridge 比 SQS 更便宜","EventBridge 支援 FIFO 順序"],a:[1],e:"EventBridge 最大差異點：(1) Schema Registry（事件格式管理）；(2) Partner Event Bus（直接接收 50+ 個 SaaS 服務的事件，如 GitHub、Shopify、Zendesk）；(3) Content-based filtering（依事件內容的任意欄位路由）。SNS/SQS 不支援 SaaS 整合。"},
{d:2,q:"RDS Multi-AZ 的 Standby 執行個體可以提供哪些功能？（選兩項）",o:["分擔讀取流量","自動容錯移轉（主 DB 故障時自動切換）","備份操作在 Standby 上執行，降低對主要執行個體的效能影響","跨 Region 讀取"],a:[1,2],e:"Multi-AZ Standby：(1) 主要用途是自動容錯移轉（Primary 失敗 → 自動升級 Standby，約 60-120 秒）；(2) 備份（Snapshot、Automated Backup）在 Standby 執行，避免 I/O 凍結影響主要效能。Standby 不開放讀取（這是 Read Replica 的用途）。"},
{d:2,q:"Application Load Balancer 可根據哪些條件路由請求到不同的目標群組？（選兩項）",o:["來源 IP 地址","HTTP 標頭（Host header, Path, HTTP method）","TCP 連線埠","封包大小"],a:[0,1],e:"ALB 支援 L7 內容路由：(1) Host header（如 api.example.com vs www.example.com）；(2) Path（/api/* vs /static/*）；(3) HTTP Headers、HTTP Method、Query String。來源 IP 也可以（IP 型條件）。NLB 只做 L4 路由，不理解 HTTP 內容。"},
{d:2,q:"AWS Site-to-Site VPN 加上 AWS Direct Connect 一起使用的主要原因是？",o:["同時使用可降低延遲","以 VPN 作為 Direct Connect 故障時的備援，確保混合雲連線高可用性","兩者互補可以倍增頻寬","VPN 提供加密，Direct Connect 本身沒有加密"],a:[1],e:"Direct Connect 提供穩定、低延遲專線，但單條 DX 沒有 SLA 保證。用 VPN 作備援（Direct Connect 主、VPN 備）是企業混合雲高可用的標準設計。注意：Direct Connect 本身不加密（走私有 MPLS 線路），若需加密可在 DX 上建立 VPN 隧道。"},
{d:2,q:"Amazon FSx for Windows File Server 和 Amazon EFS 最主要的使用情境差異是？",o:["FSx Windows 只支援 Windows；EFS 只支援 Linux","FSx Windows 提供 SMB 協議（Windows 原生）、Active Directory 整合；EFS 提供 NFS 協議，適合 Linux 工作負載","兩者功能相同，只是名稱不同","EFS 比 FSx 效能更高"],a:[1],e:"EFS：NFS 協議，跨 AZ，Linux 工作負載。FSx for Windows：SMB 協議，整合 AD，支援 Windows ACL/DFS，適合 Windows 伺服器、SQL Server、SharePoint。FSx for Lustre：高效能運算（HPC）。根據協議和 OS 選擇。"},
{d:2,q:"Lambda 的保留並發（Reserved Concurrency）和佈建並發（Provisioned Concurrency）的差異是？",o:["兩者都是加速 Lambda 的方式","Reserved 是並發上限（防止 Lambda 佔用帳號並發額度）；Provisioned 是預先暖機的執行環境（消除冷啟動）","Reserved 比 Provisioned 便宜","Provisioned 只適用於 VPC 內的 Lambda"],a:[1],e:"Reserved Concurrency：設定此函數的最大並發數，超過時請求節流（保護下游資源），不額外收費。Provisioned Concurrency：預先初始化 N 個執行環境，消除冷啟動，按小時收費。保護下游用 Reserved；消除冷啟動用 Provisioned。"},
// ===== 追加題庫：Domain 3 高效能架構 =====
{d:3,q:"ElastiCache Redis 和 Memcached 最主要的功能差異是？（選兩項）",o:["Redis 支援複雜資料結構（List、Set、SortedSet）和持久化；Memcached 只支援簡單鍵值，無持久化","Redis 支援 Cluster 模式和 Multi-AZ 複寫；Memcached 只支援水平分片（無複寫）","Redis 比 Memcached 便宜","Memcached 比 Redis 支援更多語言"],a:[0,1],e:"Redis 功能更豐富：複雜資料結構（SortedSet 適合排行榜）、持久化（RDB/AOF）、Multi-AZ 複寫、Cluster、Pub/Sub。Memcached：純快取（不持久化）、無複寫（節點掛掉資料消失）、多執行緒（高 CPU 下可能更快）。需要持久化/複寫 → Redis；純快取且多執行緒 → Memcached。"},
{d:3,q:"DynamoDB Accelerator（DAX）的主要用途是？",o:["DynamoDB 的備份解決方案","在 DynamoDB 前加上記憶體快取，讓讀取延遲從毫秒降至微秒（不需修改應用程式 SDK）","DynamoDB 的全球複寫","讓 DynamoDB 支援 SQL 查詢"],a:[1],e:"DAX 是 DynamoDB 專用的 Write-Through 記憶體快取，API 與 DynamoDB 相容（替換 endpoint 即可），對「讀取密集」且「讀取延遲要求極低（微秒）」的場景效果最好。注意：DAX 不適合強一致性讀取或寫入密集場景。"},
{d:3,q:"API Gateway 的回應快取（Response Caching）有什麼限制或注意事項？",o:["快取只在 Production stage 有效","快取按每個 Method/Stage 設定；對有參數（Query String、Headers）的 API，快取鍵需正確設定，否則不同請求可能回傳相同快取結果","API Gateway 快取不支援 POST 請求","快取只能用於 Lambda 整合"],a:[1],e:"API Gateway Cache Key 預設只包含路徑，若 API 依賴 Query String 或 Headers 決定回應，必須在快取設定中加入這些參數作為 Cache Key，否則不同使用者的請求可能拿到錯誤的快取結果。快取費用按小時計（依 Cache 大小），適合回應穩定的 GET 請求。"},
{d:3,q:"CloudFront Lambda@Edge 和 CloudFront Functions 的選擇依據是？",o:["Lambda@Edge 比 CloudFront Functions 便宜","Lambda@Edge：支援 Node.js/Python、執行時間最長 30 秒、可存取網路和資源；CloudFront Functions：毫秒級輕量 JS、只做 Viewer 請求/回應操作、費用更低","CloudFront Functions 支援更多程式語言","Lambda@Edge 只在 us-east-1 部署"],a:[1],e:"CloudFront Functions：URL 重寫、HTTP Header 操作、簡單身分驗證，成本是 Lambda@Edge 的 1/6，延遲更低。Lambda@Edge：需要存取外部資源（API、資料庫）、複雜邏輯、較長執行時間（最長 30 秒在 origin request）。優先考慮 CloudFront Functions，需要複雜邏輯才用 Lambda@Edge。"},
{d:3,q:"Amazon Kinesis Data Streams 和 Amazon SQS 在使用情境上最主要的差異是？",o:["Kinesis 比 SQS 便宜","Kinesis 適合需要順序保證、多個消費者各自讀取同一份資料（Fan-out）的串流場景；SQS 訊息被消費後即刪除","SQS 比 Kinesis 吞吐量更高","兩者功能完全相同"],a:[1],e:"Kinesis：訊息保留最長 7 天，多個 Consumer（應用程式）可各自獨立讀取同一條 Stream（不互相消耗），適合事件溯源、多消費者場景。SQS：訊息被一個消費者取走後刪除（at-least-once），適合工作佇列解耦。需要訊息被多個服務各自處理 → Kinesis；一個任務只需一個 Worker 處理 → SQS。"},
{d:3,q:"Amazon Athena 按什麼計費，如何最有效降低查詢費用？",o:["按查詢次數計費，減少查詢次數","按掃描的資料量（TB）計費；使用 Parquet/ORC 欄位格式和分區裁剪（Partition Pruning）可降低 85-99% 費用","按資料儲存量計費","按查詢回傳的結果量計費"],a:[1],e:"Athena 按掃描量（每 TB $5）計費。降費三招：(1) 欄位式格式（Parquet/ORC）：只掃描查詢涉及的欄位，節省 85%；(2) Partition Pruning：分區表讓 WHERE 條件只掃描相關分區；(3) 壓縮（GZIP/SNAPPY）：減少資料量。Parquet + 分區是最有效的組合。"},
{d:3,q:"Amazon Redshift 的 Spectrum 功能有什麼用途？",o:["讓 Redshift 支援 Multi-AZ","直接在 S3 的資料上執行 Redshift SQL 查詢，無需把資料載入 Redshift Cluster","讓 Redshift 自動擴縮節點","Redshift 的備份功能"],a:[1],e:"Redshift Spectrum 讓你用 Redshift SQL 查詢 S3 的原始資料（Parquet/CSV/JSON 等），費用按掃描量計算。適合：Hot 資料在 Redshift、Cold 資料在 S3 的架構（資料湖 + 倉儲混合）。不需要複製資料進 Redshift。"},
{d:3,q:"AWS Lambda 的 SnapStart 功能針對哪個執行環境，解決什麼問題？",o:["Node.js 的執行速度問題","Java 11/21 的冷啟動問題（Java 初始化時間長），透過快照（Snapshot）恢復已初始化的環境","Python 的記憶體限制問題","所有執行環境的網路延遲問題"],a:[1],e:"SnapStart 針對 Java（Lambda 最慢的執行環境之一）：首次部署時建立執行環境快照，後續冷啟動從快照恢復（不需重新初始化 JVM），可將冷啟動時間從數秒降至毫秒。目前支援 Java 11/21 + Corretto。"},
{d:3,q:"EFS 的效能模式（Performance Mode）中，Max I/O 相較於 General Purpose 的代價是？",o:["Max I/O 費用更高","Max I/O 吞吐量更高但延遲更高；General Purpose 延遲低但吞吐有上限，適合延遲敏感的工作負載","Max I/O 不支援 NFS v4","Max I/O 只能掛載到一個 EC2"],a:[1],e:"General Purpose（預設）：每次操作延遲低（毫秒），適合 Web 伺服器、CMS、容器儲存。Max I/O：每秒操作數（IOPS）可更高，但每次操作延遲也更高，適合大型平行工作負載（Hadoop、HPC）。2023 年後建議統一用 Elastic Throughput 自動擴縮，效能模式限制已減少。"},
{d:3,q:"Amazon DocumentDB 相較於 MongoDB 自建的主要優勢是？",o:["DocumentDB 比自建 MongoDB 便宜","DocumentDB 是全受管服務，自動處理備份、修補、擴縮；且與 Aurora 共用儲存架構（6 份複本跨 3 AZ）","DocumentDB 支援更多 MongoDB 功能","DocumentDB 的查詢速度比自建 MongoDB 快 10 倍"],a:[1],e:"DocumentDB 相容 MongoDB API（可用 MongoDB 驅動程式）但底層是 AWS 自研引擎，共用 Aurora 的分散式儲存（6 份複本）。優點是全受管免維運、自動備份、HA。限制：不是 100% MongoDB 相容，部分新功能可能不支援。"},
{d:3,q:"Lambda 的並發模型中，當帳號層級的並發額度（1000 個）被一個函數耗盡時，其他函數會發生什麼？",o:["其他函數自動等待直到有可用並發","其他函數的請求被節流（Throttle），回傳 429 錯誤","Lambda 自動申請更多並發","其他函數改用 EC2 執行"],a:[1],e:"Lambda 帳號層級預設並發 1000（可申請提高）。若一個函數消耗了全部額度，其他函數被節流（Throttle）。解法：為關鍵函數設定 Reserved Concurrency（確保其有配額）；其他函數設定 Reserved Concurrency 上限（防止其佔用太多）。"},

{d:4,q:"AWS Trusted Advisor 免費層（Basic/Developer/Business Support 之前）提供哪幾類檢查？",o:["所有類別的完整檢查","只有安全類（Security）的核心檢查（如 S3 公開存取、MFA 未啟用）","只有成本優化檢查","沒有免費檢查"],a:[1],e:"免費的 Trusted Advisor（Basic/Developer Support）只提供安全類的 7 項核心檢查（如 S3 Bucket 公開存取、IAM Use、Root MFA、安全群組寬鬆設定）。Business/Enterprise Support 才能存取所有 200+ 項檢查（成本、效能、容錯、服務限制）。"},
{d:4,q:"AWS Compute Optimizer 和 Trusted Advisor 在成本優化上的主要差異是？",o:["兩者功能完全相同","Compute Optimizer 使用 ML 分析歷史使用指標，給出精確的 EC2/Lambda/EBS 規格調整建議（含具體型號）；Trusted Advisor 給出高層的成本檢查（如低使用率 EC2）","Trusted Advisor 比 Compute Optimizer 更準確","Compute Optimizer 要另外付費"],a:[1],e:"Compute Optimizer 免費，分析 14 天使用指標（CPU、記憶體、EBS I/O），給出精確的縮小/調整建議（如「建議從 m5.2xlarge 改為 m5.large，預計省 $X/月」）。Trusted Advisor 給的是「EC2 使用率 &lt;10%」這類通知，不給具體型號建議。"},
{d:4,q:"S3 的資料傳輸（Data Transfer）成本，哪些情況不收費？",o:["從 Internet 上傳到 S3；同 Region 內 S3 到 EC2","從 Internet 上傳到 S3（Inbound 免費）；S3 到 CloudFront（免費）；同 Region 內 S3 到 EC2（免費）","所有 S3 傳輸都免費","只有 US-East-1 的傳輸免費"],a:[1],e:"S3 Data Transfer：免費：(1) Internet → S3（上傳 Inbound）；(2) S3 → CloudFront；(3) 同 Region 的 S3 ↔ EC2；(4) 同 AWS 服務間傳輸（同 Region）。收費：S3 → Internet（每 GB $0.09）；跨 Region 傳輸。CloudFront 當作 CDN 可省去 S3→Internet 的傳輸費。"},
{d:4,q:"EC2 的 Savings Plans 有哪兩種類型？主要差異是？",o:["Compute Savings Plans 和 EC2 Instance Savings Plans","Standard Savings Plans 和 Flexible Savings Plans","Reserved Savings Plans 和 On-Demand Savings Plans","Only one type exists"],a:[0],e:"Compute Savings Plans：最靈活，適用 EC2（任何系列/大小/Region）、Fargate 和 Lambda，折扣最高 66%。EC2 Instance Savings Plans：綁定特定 Instance Family 和 Region，折扣最高 72%（比 Compute SP 多）但彈性較低。Compute SP 是大多數情況的首選（可隨時換執行個體家族）。"},
{d:4,q:"自動擴縮群組（ASG）使用混合購買選項（Mixed Instances Policy）時，建議的 On-Demand 和 Spot 比例是？",o:["100% Spot 效果最好","依應用容錯能力設計：通常 20-30% On-Demand（基準容量）+ 70-80% Spot（彈性容量）","50/50 是唯一支援的比例","只能是 On-Demand 或 Spot，不能混合"],a:[1],e:"Mixed Instances Policy 最佳實踐：On-Demand 提供穩定基準容量（不被中斷），Spot 提供彈性擴容（最省錢）。建議 20-30% On-Demand 確保最低服務能力，Spot 部分設定多個執行個體類型和多個 AZ，降低同時被回收的機率（使用 capacity-optimized 分配策略）。"},
{d:4,q:"EC2 的停止（Stop）和休眠（Hibernate）在計費和狀態上的差異是？",o:["兩者完全相同","停止：不收 EC2 計算費（EBS 仍收費），RAM 資料消失，下次啟動執行 OS 開機流程；休眠：RAM 內容存入 EBS，下次恢復更快，EBS 需有足夠空間存 RAM","休眠比停止費用更高","休眠會清空 RAM"],a:[1],e:"Hibernate：把 RAM 內容存到 EBS root volume，停止收 EC2 計算費（EBS 仍收費）。恢復時跳過 OS/應用啟動，直接從休眠點繼續。適用於啟動時間長的應用（如需數分鐘初始化的 Java 應用）。限制：執行個體 RAM 最大 150 GB，不支援所有執行個體類型，EBS 需加密。"},
{d:4,q:"Amazon S3 Storage Lens 的主要功能是？",o:["讓 S3 物件永久保留的工具","提供跨帳號/跨 Region 的 S3 使用分析儀表板，包含儲存量趨勢、請求模式、成本優化建議（如發現未使用的舊版本、未配置生命週期的儲存貯體）","S3 的安全掃描工具","替代 S3 Lifecycle 的自動化工具"],a:[1],e:"S3 Storage Lens 是 S3 的集中式可觀測性工具：跨組織所有帳號和 Region 的 S3 使用統計（儲存量、請求數、資料存取模式），並提供可行的成本優化建議（如「有 1.2 TB 舊版本物件可設定 NoncurrentVersion 生命週期規則」）。免費基本功能，進階功能額外收費。"},
{d:4,q:"AWS Lambda 的計費模式中，以下何種情況最能降低成本？",o:["使用最少記憶體（128 MB）永遠最省","為每個函數找到「甜蜜點」記憶體配置——更多記憶體帶來更多 CPU，執行時間縮短，總成本（記憶體×時間）可能更低","使用 arm64/Graviton 架構","Lambda 計費按請求次數，與記憶體無關"],a:[1],e:"Lambda 費用 = 記憶體 × 執行時間 × 請求數。更多記憶體 = 更多 CPU（線性關係），函數執行更快。若從 512 MB 升到 1024 MB 讓執行時間減半，總費用不變（記憶體翻倍，時間減半）；若執行時間減少超過一半，費用反而更低。用 Lambda Power Tuning 工具找最佳點。"},
{d:4,q:"在多帳號架構中，Reserved Instances 可以在 Organizations 的哪些帳號之間共享？",o:["只有購買 RI 的帳號可以使用","Organizations 內所有帳號共享，除非帳號關閉了 RI 共享功能","只有同一 OU 內的帳號可共享","RI 不能跨帳號共享"],a:[1],e:"Consolidated Billing 下，RI 和 Savings Plans 的折扣預設自動共享給 Organizations 內所有帳號（當任何帳號有符合的工作負載時）。個別帳號可以選擇退出（Turn off RI Sharing）。這是 Consolidated Billing 的重要節費優勢之一。"}

// ===== 應用程式 =====
const DOMAINS = {1:"領域 1：設計安全架構 (30%)",2:"領域 2：設計彈性架構 (26%)",3:"領域 3：設計高效能架構 (24%)",4:"領域 4：設計成本優化架構 (20%)"};
let quiz = [], idx = 0, answers = [], selected = new Set(), submitted = false, mode = "all";
const app = document.getElementById("app");

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderSetup(){
  const wrong = JSON.parse(localStorage.getItem("saa_wrong")||"[]");
  app.innerHTML = `
  <div class="card">
    <h2 style="margin-bottom:8px;">選擇測驗模式</h2>
    <p class="stat" style="margin-bottom:12px;">題庫共 ${QUESTIONS.length} 題 · 依 SAA-C03 四大領域比重出題 · 及格線 72%</p>
    <div class="setup-opt" onclick="startQuiz('all')"><h3>📝 完整模擬考（${QUESTIONS.length} 題）</h3><p>全領域隨機出題，模擬正式考試</p></div>
    <div class="setup-opt" onclick="startQuiz('quick')"><h3>⚡ 快速練習（15 題）</h3><p>隨機抽 15 題快速測驗</p></div>
    ${[1,2,3,4].map(d=>`<div class="setup-opt" onclick="startQuiz(${d})"><h3>🎯 ${DOMAINS[d]}</h3><p>只練習此領域（${QUESTIONS.filter(q=>q.d===d).length} 題）</p></div>`).join("")}
    ${wrong.length?`<div class="setup-opt" onclick="startQuiz('wrong')"><h3>🔁 錯題複習（${wrong.length} 題）</h3><p>只重做上次答錯的題目</p></div>`:""}
  </div>`;
}

window.startQuiz = function(m){
  mode = m;
  if(m==="all") quiz = shuffle(QUESTIONS);
  else if(m==="quick") quiz = shuffle(QUESTIONS).slice(0,15);
  else if(m==="wrong"){const w=JSON.parse(localStorage.getItem("saa_wrong")||"[]");quiz=shuffle(QUESTIONS.filter((q,i)=>w.includes(i)));}
  else quiz = shuffle(QUESTIONS.filter(q=>q.d===m));
  idx=0; answers=[]; renderQuestion();
};

function renderQuestion(){
  const q = quiz[idx]; selected = new Set(); submitted = false;
  const multi = q.a.length>1;
  app.innerHTML = `
  <div class="progress-wrap"><div class="progress-bar" style="width:${idx/quiz.length*100}%"></div></div>
  <div class="stat" style="margin-bottom:8px;">第 ${idx+1} / ${quiz.length} 題</div>
  <div class="card">
    <span class="domain-tag">${DOMAINS[q.d]}</span>
    <div class="q-text">${q.q}</div>
    ${multi?'<div class="multi-hint">⚠️ 多選題：請選擇 '+q.a.length+' 個答案</div>':""}
    ${q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
    <div class="explain" id="explain"></div>
    <div class="toolbar">
      <button class="btn btn-outline" onclick="renderSetup2()">結束測驗</button>
      <button class="btn btn-primary" id="mainBtn" onclick="submitAnswer()">送出答案</button>
    </div>
  </div>`;
}
window.renderSetup2 = renderSetup;

window.pick = function(i){
  if(submitted) return;
  const q = quiz[idx], multi = q.a.length>1;
  if(!multi){selected.clear();document.querySelectorAll(".opt").forEach(b=>b.classList.remove("selected"));}
  if(selected.has(i)){selected.delete(i);document.getElementById("opt"+i).classList.remove("selected");}
  else{selected.add(i);document.getElementById("opt"+i).classList.add("selected");}
};

window.submitAnswer = function(){
  const q = quiz[idx];
  if(!submitted){
    if(selected.size===0){alert("請先選擇答案");return;}
    submitted = true;
    const correct = q.a.length===selected.size && q.a.every(a=>selected.has(a));
    answers.push({d:q.d, correct, qi:QUESTIONS.indexOf(q)});
    q.a.forEach(a=>document.getElementById("opt"+a).classList.add("correct"));
    selected.forEach(s=>{if(!q.a.includes(s))document.getElementById("opt"+s).classList.add("wrong");});
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    const ex = document.getElementById("explain");
    ex.innerHTML = `<div class="verdict" style="color:${correct?'var(--good)':'var(--bad)'}">${correct?"✅ 答對了！":"❌ 答錯了。正確答案："+q.a.map(a=>String.fromCharCode(65+a)).join(", ")}</div>${q.e}`;
    ex.classList.add("show");
    document.getElementById("mainBtn").textContent = idx===quiz.length-1?"查看成績":"下一題";
  } else {
    idx++;
    if(idx<quiz.length) renderQuestion(); else renderResult();
  }
};

function renderResult(){
  const total = answers.length, right = answers.filter(a=>a.correct).length;
  const pct = Math.round(right/total*100), pass = pct>=72;
  const wrongIdx = answers.filter(a=>!a.correct).map(a=>a.qi);
  localStorage.setItem("saa_wrong", JSON.stringify(wrongIdx));
  const hist = JSON.parse(localStorage.getItem("saa_history")||"[]");
  hist.push({date:new Date().toLocaleDateString("zh-TW"), pct, total});
  localStorage.setItem("saa_history", JSON.stringify(hist.slice(-20)));
  let domainRows = "";
  for(const d of [1,2,3,4]){
    const da = answers.filter(a=>a.d===d);
    if(!da.length) continue;
    const dr = da.filter(a=>a.correct).length;
    domainRows += `<div class="domain-row"><span>${DOMAINS[d]}</span><strong style="color:${dr/da.length>=0.72?'var(--good)':'var(--bad)'}">${dr}/${da.length} (${Math.round(dr/da.length*100)}%)</strong></div>`;
  }
  app.innerHTML = `
  <div class="card" style="text-align:center;">
    <h2>測驗結果</h2>
    <div class="result-big ${pass?'pass':'fail'}">${pct}%</div>
    <p style="font-size:1.1rem;margin-bottom:8px;">${right} / ${total} 題正確 · ${pass?"🎉 達到及格線（72%）！":"未達及格線（72%），加油！"}</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px;">各領域表現</h3>
    ${domainRows}
    <p class="stat" style="margin-top:12px;">💡 建議優先複習正確率低於 72% 的領域。</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px;">歷史成績</h3>
    ${hist.slice(-5).reverse().map(h=>`<div class="domain-row"><span>${h.date}（${h.total} 題）</span><strong>${h.pct}%</strong></div>`).join("")}
  </div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    ${wrongIdx.length?`<button class="btn btn-primary" onclick="startQuiz('wrong')">🔁 複習 ${wrongIdx.length} 題錯題</button>`:""}
    <button class="btn btn-outline" onclick="renderSetup2()">回到模式選擇</button>
  </div>`;
}

renderSetup();
</script>

<script data-project="aws">
/* ═══════════════════════════════════════════════════════════
   作品集瀏覽計數器 — 前端追蹤 + 顯示
   ───────────────────────────────────────────────────────────
   使用方式（在頁面底部加兩行）：

     <script>window.ANALYTICS_CONFIG={url:'https://xxx.supabase.co',key:'eyJ...'}<\/script>
     <script src="路徑/analytics.js" data-project="ccna-ccnp"><\/script>

   data-project 對應 projects.json 的 id，首頁請填 hub。
   沒設定 url / key 時會自動退回本機 localStorage 計數，不會報錯。

   顯示計數：在頁面放一個 <span id="view-counter"></span> 即可。
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var CFG = window.ANALYTICS_CONFIG || {};
  var script = document.currentScript;
  var PROJECT = (script && script.getAttribute('data-project')) || 'unknown';
  var PAGE = (function () {
    var f = location.pathname.split('/').pop();
    return f && f !== '' ? f : 'index.html';
  })();
  var LIVE = !!(CFG.url && CFG.key);
  var DEDUPE_MINUTES = 30;

  /* ── 匿名訪客 ID：隨機字串，不含任何個人資訊 ── */
  function visitorId() {
    var k = 'pf:vid', v;
    try {
      v = localStorage.getItem(k);
      if (!v) {
        v = 'v' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(k, v);
      }
    } catch (e) {
      v = 'anon';
    }
    return v;
  }

  /* ── 短時間內重複整理不重複計數 ── */
  function shouldCount() {
    var k = 'pf:seen:' + PROJECT + ':' + PAGE;
    try {
      var last = +(sessionStorage.getItem(k) || 0);
      if (Date.now() - last < DEDUPE_MINUTES * 60000) return false;
      sessionStorage.setItem(k, Date.now());
    } catch (e) { /* 隱私模式下就照常計數 */ }
    return true;
  }

  /* ── 本機備援計數（未設定 Supabase 時使用）── */
  function localBump() {
    var k = 'pf:count:' + PROJECT;
    try {
      var d = JSON.parse(localStorage.getItem(k) || '{"total":0,"days":{}}');
      var today = new Date().toISOString().slice(0, 10);
      d.total++;
      d.days[today] = (d.days[today] || 0) + 1;
      localStorage.setItem(k, JSON.stringify(d));
      return d;
    } catch (e) { return { total: 0, days: {} }; }
  }

  function localRead() {
    try {
      return JSON.parse(localStorage.getItem('pf:count:' + PROJECT) || '{"total":0,"days":{}}');
    } catch (e) { return { total: 0, days: {} }; }
  }

  /* ── 送出一筆瀏覽紀錄 ── */
  function track() {
    if (!shouldCount()) return Promise.resolve();
    if (!LIVE) { localBump(); return Promise.resolve(); }

    return fetch(CFG.url + '/rest/v1/page_views', {
      method: 'POST',
      headers: {
        'apikey': CFG.key,
        'Authorization': 'Bearer ' + CFG.key,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        project_id: PROJECT,
        page_path: PAGE,
        visitor_id: visitorId(),
        referrer: document.referrer ? document.referrer.slice(0, 300) : null
      })
    }).catch(function () { localBump(); });
  }

  /* ── 讀取某專案的統計摘要 ── */
  function summary(projectId) {
    projectId = projectId || PROJECT;
    if (!LIVE) {
      var d = localRead();
      var today = new Date().toISOString().slice(0, 10);
      var ym = today.slice(0, 7);
      var month = Object.keys(d.days).reduce(function (s, k) {
        return k.indexOf(ym) === 0 ? s + d.days[k] : s;
      }, 0);
      return Promise.resolve({
        project_id: projectId, total_views: d.total,
        today_views: d.days[today] || 0, month_views: month, local: true
      });
    }
    return fetch(CFG.url + '/rest/v1/v_views_summary?project_id=eq.' + encodeURIComponent(projectId),
      { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        return rows[0] || { project_id: projectId, total_views: 0, today_views: 0, month_views: 0 };
      })
      .catch(function () { return { project_id: projectId, total_views: 0, today_views: 0, month_views: 0, error: true }; });
  }

  /* ── 讀取全部專案的統計 ── */
  function allSummary() {
    if (!LIVE) return Promise.resolve([]);
    return fetch(CFG.url + '/rest/v1/v_views_summary?order=total_views.desc',
      { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 讀取每日趨勢（近 N 天）── */
  function daily(projectId, days) {
    if (!LIVE) return Promise.resolve([]);
    var since = new Date(Date.now() - (days || 30) * 86400000).toISOString().slice(0, 10);
    var q = '/rest/v1/v_views_daily?day=gte.' + since + '&order=day.asc';
    if (projectId) q += '&project_id=eq.' + encodeURIComponent(projectId);
    return fetch(CFG.url + q, { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 讀取每月統計 ── */
  function monthly(projectId) {
    if (!LIVE) return Promise.resolve([]);
    var q = '/rest/v1/v_views_monthly?order=month.asc';
    if (projectId) q += '&project_id=eq.' + encodeURIComponent(projectId);
    return fetch(CFG.url + q, { headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key } })
      .then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  /* ── 把數字填進 #view-counter ── */
  function paint() {
    var box = document.getElementById('view-counter');
    if (!box) return;
    summary().then(function (s) {
      box.innerHTML =
        '<span class="vc-item"><b>' + (s.today_views || 0) + '</b> 今日</span>' +
        '<span class="vc-item"><b>' + (s.month_views || 0) + '</b> 本月</span>' +
        '<span class="vc-item"><b>' + (s.total_views || 0) + '</b> 總計</span>' +
        (s.local ? '<span class="vc-note">本機計數</span>' : '');
      box.classList.add('vc-ready');
    });
  }

  window.PortfolioAnalytics = {
    project: PROJECT, live: LIVE,
    track: track, summary: summary, allSummary: allSummary,
    daily: daily, monthly: monthly, paint: paint
  };

  function boot() { track().then(paint); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<!-- portfolio-analytics:end -->
