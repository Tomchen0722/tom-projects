<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCP ACE 模擬試題</title>
<style>
  :root{--blue:#4285f4;--dark:#1a1a2e;--bg:#f0f4f8;--card:#fff;--good:#1e8e3e;--bad:#d93025;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
  body{background:var(--bg);color:#222;min-height:100vh;}
  header{background:var(--dark);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{font-size:1.2rem;}
  header h1 span{color:var(--blue);}
  .container{max-width:860px;margin:0 auto;padding:24px 16px;}
  .card{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;}
  .domain-tag{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:20px;background:#e8f0fe;color:#1a56db;margin-bottom:12px;}
  .q-text{font-size:1.05rem;line-height:1.7;margin-bottom:16px;font-weight:600;}
  .multi-hint{color:#b45309;font-size:.85rem;margin-bottom:10px;}
  .opt{display:block;width:100%;text-align:left;padding:12px 16px;margin:8px 0;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:.95rem;line-height:1.6;transition:.15s;}
  .opt:hover{border-color:var(--blue);background:#e8f0fe;}
  .opt.selected{border-color:#1a56db;background:#e8f0fe;}
  .opt.correct{border-color:var(--good);background:#e6f4ea;}
  .opt.wrong{border-color:var(--bad);background:#fce8e6;}
  .opt:disabled{cursor:default;}
  .explain{margin-top:16px;padding:16px;border-radius:8px;background:#fffbe6;border-left:4px solid var(--blue);line-height:1.7;font-size:.92rem;display:none;}
  .explain.show{display:block;}
  .explain .verdict{font-weight:700;margin-bottom:6px;}
  .btn{padding:10px 24px;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#2b6cb0;}
  .btn-outline{background:#fff;border:2px solid var(--dark);color:var(--dark);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;flex-wrap:wrap;}
  .progress-wrap{background:#ddd;border-radius:10px;height:10px;margin-bottom:20px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--blue);width:0;transition:.3s;}
  .stat{font-size:.9rem;color:#555;}
  .result-big{font-size:3rem;font-weight:800;text-align:center;margin:12px 0;}
  .pass{color:var(--good);} .fail{color:var(--bad);}
  .domain-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:.95rem;}
  .setup-opt{padding:16px;border:2px solid #ddd;border-radius:10px;margin:10px 0;cursor:pointer;transition:.15s;}
  .setup-opt:hover{border-color:var(--blue);}
  .setup-opt h3{font-size:1rem;margin-bottom:4px;}
  .setup-opt p{font-size:.85rem;color:#666;}
  a.back{color:#fff;text-decoration:none;font-size:.9rem;opacity:.85;}
  a.back:hover{opacity:1;}
  @media(max-width:600px){.container{padding:16px 10px;}.card{padding:16px;}}
</style>
</head>
<body>
<header>
  <h1>GCP <span>ACE</span> 模擬試題</h1>
  <a class="back" href="index.html">← 回學習中心</a>
</header>
<div class="container" id="app"></div>

<script>
// domain: 1=計算與容器(25%) 2=儲存與資料庫(20%) 3=網路與安全(25%) 4=維運與成本(30%)
const QUESTIONS = [
// ---------- Domain 1: 計算與容器 ----------
{d:1,q:"你需要在 GCP 上部署一個無狀態的 HTTP API，要求自動擴縮、不需要管理伺服器，且能在流量為 0 時縮減到 0 個執行個體以節省成本。最佳選擇是？",o:["Compute Engine 搭配 Managed Instance Group","Cloud Run","Google Kubernetes Engine (GKE)","App Engine 標準環境（Standard）"],a:[1,3],e:"Cloud Run 和 App Engine Standard 都支援 Scale-to-Zero（無流量時不計費）且全受管不需管伺服器。Cloud Run 更靈活（任何容器）；App Engine Standard 支援特定語言執行環境。GKE 需要管理節點；MIG 最低保持 1 個執行個體。"},
{d:1,q:"Cloud Run 和 Cloud Functions 最主要的差異是？",o:["Cloud Run 只支援 HTTP，Cloud Functions 支援多種觸發器","Cloud Run 以容器為單位部署，Cloud Functions 以函數為單位部署","Cloud Run 收費比 Cloud Functions 貴","Cloud Run 不支援自動擴縮"],a:[1],e:"Cloud Run 部署的是 Docker 容器（任何語言、任何依賴），Cloud Functions 部署的是單一函數（支援特定語言）。Cloud Functions 更適合事件驅動的單一任務；Cloud Run 更適合完整的 API 服務或需要複雜依賴的應用。"},
{d:1,q:"公司需要在 GCP 上運行一個需要特定 GPU 的深度學習訓練任務，每次訓練約 6 小時且不定期執行。最划算的 Compute Engine 購買選項是？",o:["On-Demand VM（按需）","Spot VM（搶佔式虛擬機）","1 年期 Committed Use Discount","Custom Machine Type"],a:[1],e:"Spot VM 最多可省 80% 費用，最適合可容忍中斷、有檢查點儲存的批次訓練任務。6 小時訓練若被中斷可從檢查點恢復。Committed Use 適合 24/7 穩定負載。Custom Machine Type 只是調整規格，不影響計費模式。"},
{d:1,q:"GKE Autopilot 和 GKE Standard 最主要的差異是？",o:["Autopilot 不支援 GPU","Autopilot 由 Google 管理節點（不需設定 Node Pool），按 Pod 資源計費；Standard 需要管理節點","Autopilot 不支援自動擴縮","Standard 比 Autopilot 貴"],a:[1],e:"GKE Autopilot 是全受管 Kubernetes：節點由 Google 自動佈建和管理，按實際 Pod 資源計費，無需管理 Node Pool。GKE Standard 提供完整控制（可調 Node、自訂節點映像等）但需要管理節點。"},
{d:1,q:"在 Compute Engine 上，你需要在 VM 啟動時自動安裝套件並啟動服務。最合適的機制是？",o:["SSH 登入後手動安裝","使用 VM 的 Startup Script（啟動腳本）","建立自訂映像（Custom Image）","使用 Cloud Build"],a:[1],e:"Startup Script 在每次 VM 啟動時自動執行，適合動態設定（如從 Secret Manager 拉取設定）。Custom Image 適合固定、不常變動的軟體環境（把安裝結果烘焙進映像）。兩者可搭配使用。"},
{d:1,q:"App Engine 的 Traffic Splitting 功能主要用途是？",o:["在不同 AZ 之間分配流量","將流量分配到不同版本（如新版 10%、舊版 90%），用於漸進式發布","限制特定 IP 的存取","提升 App Engine 的吞吐量"],a:[1],e:"Traffic Splitting 允許把流量按比例分配到不同版本（Versions），是 App Engine 原生的 Canary Release / Blue-Green 部署機制，無需額外設定負載平衡器。"},
// ---------- Domain 2: 儲存與資料庫 ----------
{d:2,q:"Cloud Storage 的哪個儲存類別最適合幾乎不存取但需長期保留、且有最低 365 天儲存期的資料（如法規遵循的封存資料）？",o:["Standard","Nearline","Coldline","Archive"],a:[3],e:"Archive 儲存類別費用最低（約 Standard 的 1/10），最低儲存期 365 天，適合合規封存、長期備份等幾乎不取用的資料。Coldline 最低 90 天；Nearline 最低 30 天。取用時有額外費用，選錯儲存類別會反而更貴。"},
{d:2,q:"Cloud SQL 的 High Availability（高可用）設定如何運作？",o:["建立 Read Replica 並手動切換","在相同地區不同 AZ 建立 Standby 執行個體，主執行個體故障時自動容錯移轉（約 60 秒）","跨兩個 Region 建立主備架構","使用 Cloud Load Balancing 分配查詢流量"],a:[1],e:"Cloud SQL HA 在同一 Region 的不同 Zone 各有一個執行個體（Primary + Standby），資料同步複寫，Primary 故障時自動容錯移轉，應用只需重連，通常約 60 秒完成。Standby 不開放讀取，只用於容錯。"},
{d:2,q:"你的應用需要支援每秒數百萬次的鍵值查詢，需求是極低延遲（個位數毫秒）和無限擴展。最適合的 GCP 服務是？",o:["Cloud SQL（PostgreSQL）","Cloud Spanner","Firestore","Bigtable"],a:[3],e:"Bigtable 是 HBase 相容的 NoSQL 寬列資料庫，專為大規模（PB 級）、低延遲、高吞吐的時序/鍵值工作負載設計。常見用途：IoT 資料、時序資料、廣告技術。Spanner 適合需要全球分散和 ACID 的關聯式資料；Firestore 適合文件模型的應用。"},
{d:2,q:"BigQuery 的 Partitioned Table（分區表）主要優點是？",o:["提升資料寫入速度","查詢時自動過濾不相關的分區，減少掃描量降低費用","允許跨 Region 查詢","提升 JOIN 操作效能"],a:[1],e:"BigQuery 按掃描量計費。Partitioned Table（通常按日期/時間分區）讓查詢的 WHERE 條件可以 Partition Pruning（只掃描相關分區），直接減少費用。例如查詢「今天的資料」只掃描 1/365 的資料。"},
{d:2,q:"Firestore 和 Bigtable 最主要的使用場景差異是？",o:["Firestore 只支援行動應用；Bigtable 只支援 Web 應用","Firestore 適合文件模型的應用（如用戶資料、設定）；Bigtable 適合時序、分析型大量讀寫（如 IoT、廣告）","兩者沒有差異，只是命名不同","Firestore 支援 SQL；Bigtable 不支援"],a:[1],e:"Firestore 是文件型 NoSQL（類似 MongoDB），有離線同步和即時更新功能，適合行動/Web 應用的結構化文件（查詢靈活但規模有限）。Bigtable 是寬列 NoSQL，優化為極高吞吐的時序鍵值存取，無複雜查詢能力但可達 PB 級。"},
// ---------- Domain 3: 網路與安全 ----------
{d:3,q:"在 GCP VPC 中，防火牆規則的評估順序是？",o:["只評估最後一條匹配的規則","依 Priority 數字由小到大評估，數字越小優先級越高，找到第一條匹配即停止","Ingress 規則優先於 Egress 規則","Deny 規則永遠優先於 Allow 規則"],a:[1],e:"GCP 防火牆規則有 Priority（0-65534），數字越小優先級越高，找到第一條匹配的規則即停止。若無匹配規則，預設行為：Ingress 拒絕（Implied Deny All Ingress），Egress 允許。"},
{d:3,q:"Cloud IAM 中，Service Account 最主要的用途是？",o:["讓人類用戶以較低權限存取資源","代表應用程式或虛擬機器等非人類實體，以最小權限原則存取 GCP 資源","管理多個 GCP 專案的計費","替代 VPN 連線"],a:[1],e:"Service Account 是機器身分（Machine Identity），讓 Compute Engine、Cloud Run、Cloud Functions 等工作負載以特定身分和最小權限呼叫 GCP API，而不需要在程式碼中儲存金鑰。這是 GCP 安全的核心機制。"},
{d:3,q:"Cloud Armor 的主要功能是？",o:["加速靜態資源的全球分發","提供 L7 Web 應用防火牆（WAF）和 DDoS 防護，保護後方的負載平衡器","在 VPC 之間建立加密連線","管理 SSL/TLS 憑證"],a:[1],e:"Cloud Armor 是 GCP 的 Web Application Firewall，掛在 Cloud Load Balancing 前，可阻擋 OWASP Top 10 攻擊（SQL Injection、XSS 等）、IP 封鎖、地理位置限制、DDoS 緩解。不能保護非 HTTP 服務。"},
{d:3,q:"Private Google Access 在 GCP 中的作用是？",o:["讓 VPC 內的 VM 可以存取網際網路","讓沒有外部 IP 的 VM 可以存取 Google API 和服務（如 Storage、BigQuery）而不需要 NAT","加密 VPC 內部的所有流量","讓外部使用者存取 VPC 內的服務"],a:[1],e:"Private Google Access 讓僅有內部 IP（無外部 IP）的 VM 可以存取 googleapis.com 端點（BigQuery、Storage、Pub/Sub 等），流量不出 GCP 網路。若不開啟，這些 VM 需要 Cloud NAT 才能存取 Google API。"},
{d:3,q:"Shared VPC 的主要使用情境是？",o:["在單一專案內隔離不同環境（dev/prod）","讓多個服務專案共用同一個 Host 專案的 VPC 網路資源，實現集中式網路管理","備份 VPC 設定到另一個 Region","提升 VPC 的頻寬上限"],a:[1],e:"Shared VPC 允許企業在 Host 專案中集中管理網路（防火牆、子網路、路由），而各業務單位的服務專案可以使用該共享網路部署資源。適合大型企業的多專案、多團隊治理架構。"},
{d:3,q:"使用 Cloud VPN 連接 on-premises 到 GCP VPC 時，HA VPN 相較於 Classic VPN 的主要優點是？",o:["HA VPN 的費用更低","HA VPN 使用兩個外部 IP 和兩個隧道，SLA 達 99.99%；Classic VPN 只有一個外部 IP，SLA 99.9%","HA VPN 支援更多加密演算法","HA VPN 不需要 Cloud Router"],a:[1],e:"HA VPN 透過兩個 VPN 閘道、兩個 Cloud Router 和多條隧道提供高可用性（99.99% SLA），適合生產環境關鍵連線。Classic VPN 為單一閘道，99.9% SLA，適合非關鍵或測試連線。"},
// ---------- Domain 4: 維運與成本 ----------
{d:4,q:"你需要集中監控多個 GCP 專案中所有 Cloud Run 服務的請求延遲，並在 p99 延遲超過 2 秒時收到通知。應使用哪個工具？",o:["Cloud Audit Logs","Cloud Monitoring（配置 Alerting Policy）","Cloud Trace","Error Reporting"],a:[1],e:"Cloud Monitoring 收集所有 GCP 服務的 Metrics（包括 Cloud Run 的 request_latencies），可建立 Alerting Policy 設定 p99 延遲閾值，並透過 Email/PagerDuty/Slack 等通知。Cloud Trace 追蹤請求鏈路；Audit Logs 記錄 API 操作。"},
{d:4,q:"Cloud Audit Logs 中，哪種日誌記錄「誰在何時透過 gcloud 或 Console 建立/刪除了 VM」這類管理操作？",o:["Data Access Audit Logs","Admin Activity Audit Logs","System Event Audit Logs","VPC Flow Logs"],a:[1],e:"Admin Activity Audit Logs 記錄所有寫入型管理操作（建立、刪除、修改設定等），永遠啟用且免費。Data Access 記錄讀取型 API 呼叫（需手動啟用，可能產生大量日誌費用）。System Event 記錄 GCP 內部系統動作。"},
{d:4,q:"你發現 GCP 帳單比預期高很多，最快速找到費用分佈的工具是？",o:["直接查看 VM 的 CPU 使用率","Cloud Billing Reports + Cost Breakdown（依服務/專案/標籤分組）","Cloud Monitoring 的自訂儀表板","查看 Cloud Audit Logs"],a:[1],e:"Cloud Billing Reports 提供多維度的費用分析（按服務、地區、專案、標籤），可以快速識別費用異常的來源。搭配 Budget Alerts 可以預先設定超支警告。Cost Breakdown 可細看到 SKU 層級。"},
{d:4,q:"Cloud Logging 中，如何確保日誌不會永久儲存而產生不必要費用？",o:["設定防火牆規則阻擋日誌流量","在 Log Bucket 設定 Retention Policy（保留期限）","使用 Exclusion Filter 排除不需要的日誌","只啟用 VPC Flow Logs"],a:[0,1,2],e:"三種方法都有效：(1) Retention Policy 設定日誌自動過期刪除（預設 30 天）；(2) Exclusion Filter 排除不重要的日誌（如 DEBUG 等級）不寫入，直接降低成本；(3) 兩者搭配使用效果最好。防火牆無法控制日誌記錄。"},
{d:4,q:"Committed Use Discounts（CUD）最適合什麼使用情境？",o:["不定期的批次處理任務","24/7 穩定運行的工作負載（如資料庫、Web 伺服器），承諾 1 或 3 年使用量","只在上班時間使用的開發環境","Spot 可容忍中斷的工作負載"],a:[1],e:"CUD 透過承諾 1 年或 3 年的使用量換取折扣（最多 57% off）。適合預測性強、持續運行的工作負載。對於不定期任務用 Spot VM；對於上下班開關的環境用排程啟停更省錢。"},
{d:4,q:"在 GKE 中，你發現某些 Node 的 CPU 使用率長期很低（20%以下），如何以最小維運工作量自動優化成本？",o:["手動縮小 Node 的機器類型","啟用 GKE Cluster Autoscaler，設定最小節點數","使用 Vertical Pod Autoscaler（VPA）自動調整 Pod 的資源請求","啟用 GKE Autopilot 按 Pod 實際使用付費"],a:[2,3],e:"VPA 自動調整 Pod 的 CPU/Memory Request 到實際使用量，避免過度配置；Cluster Autoscaler 根據實際需求增減節點數。兩者搭配可達到最佳利用率。GKE Autopilot 按 Pod 資源計費，利用率低時自動省錢。"},
{d:4,q:"Cloud Run 服務的費用計算基礎是？",o:["按部署的 Container 數量每月固定收費","按 CPU 時間、記憶體時間和請求數計費，無請求時（Scale to Zero）不收費","按租用的 CPU 核心數每小時計費","按網路頻寬計費"],a:[1],e:"Cloud Run 費用 = CPU 使用時間 + 記憶體使用時間 + 請求數。Scale to Zero 時（無請求）不計費，這是它在低流量場景比 GKE 便宜的原因。同一 Region 的服務互相呼叫不收 Egress 費。"},
{d:4,q:"你需要在多個 GCP 專案中執行 Terraform 來管理基礎設施，需要 Terraform 的 Service Account 在多個專案都有適當權限。最安全的做法是？",o:["為 Terraform 建立一個 GCP 帳號並使用其 API Key","為 Terraform 建立 Service Account，授予最小必要角色，使用 Workload Identity Federation 讓 CI/CD 無需管理金鑰","把 Service Account 金鑰存入 GitHub Secrets","使用 Project Owner 角色省去逐一設定的麻煩"],a:[1],e:"Workload Identity Federation 讓 GitHub Actions / GitLab CI 等 CI/CD 系統透過 OIDC 直接取得暫時性 GCP 憑證，無需儲存長期 Service Account 金鑰。最小必要角色（Least Privilege）確保就算憑證洩漏，爆炸半徑有限。Project Owner 權限過大，違反最小權限原則。"},
{d:4,q:"在 GCP 上，組織層級的政策（Organization Policy）和 IAM 最主要的差異是？",o:["Organization Policy 管理「誰能做什麼」，IAM 限制「什麼能被做」","Organization Policy 限制「什麼能被做」（如禁止建立外部 IP），IAM 管理「誰能做什麼」","兩者功能完全相同，只是作用的層級不同","Organization Policy 只適用於 Compute Engine"],a:[1],e:"Organization Policy Service 設定資源守護欄（Guardrail），例如：禁止建立外部 IP、強制要求特定 Region、禁止 Cloud Function 接受未認證呼叫。這些限制對所有人（包括 Owner）都有效。IAM 控制身分的權限。兩者互補。"},
// ===== 追加題庫：計算與容器 =====
{d:1,q:"Cloud Run 服務在流量極低時出現明顯冷啟動延遲，如何解決？",o:["改用 Cloud Functions","設定 min-instances 保持至少 1 個暖機執行個體","增加 Cloud Run 的 CPU 配置","使用更大的 Container Image"],a:[1],e:"min-instances 讓 Cloud Run 永遠維持指定數量的暖機執行個體（即使無流量），消除冷啟動，但這些執行個體在無請求時按較低費率（idle CPU fee）計費。生產環境 SLA 嚴格的 API 通常設 min-instances=1。"},
{d:1,q:"GKE 的 Workload Identity 主要解決什麼問題？",o:["讓 Pod 可以存取外部網路","讓 Kubernetes Service Account 對應到 Google Service Account，避免在 Pod 中存放 Service Account 金鑰","讓 GKE 節點自動更新","加速 Pod 啟動時間"],a:[1],e:"傳統作法把 Service Account JSON Key 掛入 Pod（密鑰洩漏風險高）。Workload Identity 讓 Kubernetes SA 綁定 Google SA，Pod 無需任何金鑰即可呼叫 GCP API。是 GKE 存取 GCP 資源的最佳實踐，也是 ACE 考試高頻考點。"},
{d:1,q:"GCE Preemptible VM 和 Spot VM 的主要差異是？",o:["Preemptible 可以運行超過 24 小時；Spot 不能","Preemptible 最長 24 小時且在固定時間回收；Spot 沒有最大運行時間限制，回收較不可預測但通常折扣更高","兩者完全相同，只是新舊命名","Spot 不支援 GPU"],a:[1],e:"Preemptible（舊版）：最長 24 小時，每天 23:00-01:00 GCP 可強制回收。Spot（新版）：無最大時間限制，但 GCP 仍可隨時回收（通常折扣 60-91%）。兩者都適合可容忍中斷的批次工作，Spot 是現在的推薦選項。"},
{d:1,q:"Artifact Registry 相較於 Container Registry（舊版 gcr.io）的優勢是？（選兩項）",o:["支援 Docker、Maven、npm、PyPI 等多種格式","可以設定 Regional 位置讓 Pull 更快且降低 Egress 費","Artifact Registry 比 Container Registry 便宜","Container Registry 不支援 Docker"],a:[0,1],e:"Artifact Registry 是 Container Registry 的繼任者：(1) 支援多種套件格式（Docker、Maven、npm、Python wheels、APT/YUM）；(2) 可指定 Region（如 asia-east1），讓亞洲的 GKE 拉映像更快且省流量費；(3) 精細的 IAM 控制（Repository 層級）。GCP 已宣布未來廢棄 Container Registry。"},
{d:1,q:"GKE 的 Horizontal Pod Autoscaler（HPA）和 Cluster Autoscaler（CA）分別解決什麼問題？",o:["HPA 擴充 Node 數量；CA 擴充 Pod 數量","HPA 根據指標（CPU/記憶體/自訂指標）自動調整 Pod 數量；CA 根據 Pod 的排程需求自動增減 Node 數量","兩者功能相同，只是對象不同","CA 只能縮小，不能擴大"],a:[1],e:"HPA（Pod 水平擴縮）：感測 CPU/Memory 使用率，增減 Pod 副本數。CA（Node 擴縮）：若 Pod 因資源不足無法排程，CA 自動新增 Node；Node 持續低使用率時縮減 Node。兩者協同：流量增加 → HPA 增 Pod → 資源不足 → CA 增 Node。"},
{d:1,q:"App Engine 的 dispatch.yaml 檔案用途是？",o:["設定 App Engine 的 SSL 憑證","覆蓋預設的路由規則，把特定 URL 路徑路由到特定的 App Engine 服務（多服務架構）","設定 App Engine 的資料庫連線","管理 App Engine 的版本部署"],a:[1],e:"dispatch.yaml 讓你定義 URL 路由規則，例如：/api/* 路由到 api service、/mobile/* 路由到 mobile service。在 App Engine 多服務（Multi-Service）架構中，預設所有請求到 default service，用 dispatch.yaml 分流到各服務。"},
{d:1,q:"Cloud Build 的 substitution variables 最主要的用途是？",o:["替代 Cloud Build 中的 Docker 指令","讓 CI/CD Pipeline 在不同環境（dev/staging/prod）使用不同的值（如映像標籤、Region），不需修改 cloudbuild.yaml","管理 Cloud Build 的費用","設定 Cloud Build 的 timeout"],a:[1],e:"Cloud Build substitution 讓你在不同觸發器或手動觸發時傳入不同變數（如 $_DEPLOY_ENV=prod）。cloudbuild.yaml 引用 ${_DEPLOY_ENV} 實現同一個設定檔在多環境重用。內建變數如 $COMMIT_SHA 自動帶入 Git commit hash，常用於映像標籤。"},
{d:1,q:"Cloud Functions 的 2nd Generation 相較於 1st Generation 的主要改進是？（選兩項）",o:["2nd Gen 基於 Cloud Run，支援更長的超時（最長 60 分鐘）和更大的記憶體","2nd Gen 支援並發（Concurrency）—一個執行個體可同時處理多個請求","2nd Gen 比 1st Gen 便宜 50%","2nd Gen 支援更多觸發器類型"],a:[0,1],e:"Cloud Functions 2nd Gen 基於 Cloud Run：(1) 最長超時 60 分鐘（1st Gen 最長 9 分鐘）；(2) 並發（最多 1000）讓一個執行個體處理多請求，減少冷啟動；(3) 最大記憶體 32 GB（1st Gen 8 GB）；(4) 支援 Eventarc 觸發器（更多事件來源）。"},
// ===== 追加題庫：儲存與資料庫 =====
{d:2,q:"Cloud SQL 的 Cloud SQL Auth Proxy 的主要用途是？",o:["備份 Cloud SQL 資料","提供安全的 Cloud SQL 連線（IAM 驗證取代密碼、自動 TLS），適合本地端開發或 GKE 中使用","加速 Cloud SQL 查詢","讓 Cloud SQL 支援 NoSQL 查詢"],a:[1],e:"Cloud SQL Auth Proxy 是輕量代理程式：(1) 使用 IAM 驗證（不需管理 SSL 憑證）；(2) 自動加密連線；(3) 無需 Cloud SQL 有公開 IP（透過 IAM 安全連線私有 IP）。GKE 中通常作為 Sidecar Container 部署，避免應用直接管理資料庫憑證。"},
{d:2,q:"Cloud Spanner 相較於 Cloud SQL 最適合的使用情境是？",o:["Cloud Spanner 比 Cloud SQL 便宜","Cloud Spanner 提供全球分散、水平擴縮的關聯式資料庫（含外部一致性 ACID），適合需要全球多地寫入的關鍵業務系統","Cloud SQL 只支援 MySQL；Cloud Spanner 支援所有 RDBMS","Cloud Spanner 不支援 SQL"],a:[1],e:"Cloud Spanner = 全球分散式 + 完整 ACID + 水平無限擴縮。適合：全球 24/7 業務（金融交易、遊戲玩家資料）、需要強一致性且規模超過單一 Cloud SQL 上限時。代價：比 Cloud SQL 貴 10-100 倍，非正確使用情境下浪費資源。"},
{d:2,q:"Memorystore for Redis 的 Standard Tier 和 Basic Tier 最主要的差異是？",o:["Standard 比 Basic 貴但完全相同","Standard 提供 High Availability（自動複寫到備份節點，故障自動切換）；Basic 為單節點，適合快取（資料遺失可接受）","Basic 支援 Redis Cluster；Standard 不支援","Standard 最多 16 GB；Basic 無上限"],a:[1],e:"Basic Tier：單節點，無 HA，資料僅存在記憶體（節點掛掉資料消失），適合純快取場景。Standard Tier：自動複寫到備份節點（同 Region 不同 Zone），主節點故障時自動容錯移轉（約 10-30 秒），適合 Session Store、排行榜等資料不能遺失的場景。"},
{d:2,q:"Cloud Storage 的物件版本控制（Object Versioning）啟用後，刪除一個物件會發生什麼？",o:["物件立即永久刪除","建立一個「Non-current」版本（舊版本），主要版本消失；可以透過指定 generation 恢復","物件移到 Archive 儲存類別","刪除操作被拒絕，需先停用版本控制"],a:[1],e:"版本控制啟用後：DELETE 不會真正刪除，而是建立 Delete Marker（舊版變 Non-current）。可用 gsutil cp gs://bucket/obj#GENERATION . 恢復特定版本。注意：所有非當前版本仍會計費儲存費，建議搭配 Lifecycle Rule 設定 Non-current 版本過期天數避免費用失控。"},
{d:2,q:"BigQuery 的 Partitioned Table 除了按日期分區，還支援哪種分區方式？",o:["只支援日期/時間分區","日期/時間（最常見）和整數範圍（Integer Range Partitioning）兩種，另外 Ingestion-time Partitioning 自動按資料寫入時間分區","只支援字串欄位分區","只能按主鍵分區"],a:[1],e:"BigQuery 三種分區：(1) Time-unit column partitioning（DATE/TIMESTAMP/DATETIME 欄位）；(2) Ingestion-time partitioning（按資料寫入 BQ 的時間，無需欄位）；(3) Integer range partitioning（整數欄位，如 user_id 0-999999 分成 N 區）。分區後再加 Clustering（叢集）可進一步減少掃描量。"},
{d:2,q:"AlloyDB for PostgreSQL 相較於 Cloud SQL for PostgreSQL 的主要優勢是？",o:["AlloyDB 比 Cloud SQL 更便宜","AlloyDB 使用 Google 自研架構（分離運算與儲存），OLTP 速度最高 4x，分析查詢最高 100x；並內建 Columnar Engine 加速混合 OLTP+OLAP","AlloyDB 只支援 PostgreSQL 12+","Cloud SQL 不支援 HA"],a:[1],e:"AlloyDB 是 GCP 自研的 PostgreSQL 相容資料庫：分離運算儲存架構、智慧快取、Columnar Engine（OLAP 加速），適合高效能 PostgreSQL 工作負載。比 Cloud SQL for PostgreSQL 貴但效能好很多；比 Cloud Spanner 便宜但只在單 Region。高效能 PostgreSQL 首選。"},
{d:2,q:"Database Migration Service（DMS）在 GCP 遷移中的主要用途是？",o:["把 BigQuery 資料遷移到 Bigtable","把 on-premises 的 MySQL/PostgreSQL/SQL Server/Oracle 資料庫遷移到 Cloud SQL 或 AlloyDB，支援最小停機時間（CDC 持續複寫）","備份 Cloud SQL 到 GCS","在不同 GCP Region 間複製資料庫"],a:[1],e:"DMS 提供受管的資料庫遷移：全量遷移（Initial Load）+ 持續變更資料捕獲（CDC），讓來源資料庫在遷移期間繼續服務，最後 Cutover 時只需停服幾分鐘。支援異構遷移（Oracle → PostgreSQL）和同構遷移（MySQL → Cloud SQL for MySQL）。"},
// ===== 追加題庫：網路與安全 =====
{d:3,q:"VPC Service Controls 的主要用途是？",o:["替代 VPC 防火牆規則","在 GCP API 和服務周圍建立安全邊界（Service Perimeter），防止資料從受保護的專案外洩（如防止 gsutil cp 把資料複製到未授權的 GCS bucket）","加速 VPC 內的網路流量","管理 VPC Peering 連線"],a:[1],e:"VPC Service Controls 建立「虛擬邊界」：邊界內的 GCP 資源（GCS、BigQuery 等）只能被邊界內的主體存取，即使有 IAM 權限的外部使用者也無法存取（防止內部人員把資料複製到個人 GCS）。適合高敏感資料的 DLP 場景（金融、醫療）。"},
{d:3,q:"Identity-Aware Proxy（IAP）的主要功能是？",o:["替代 Cloud Armor 的 DDoS 防護","提供應用程式層（Layer 7）的存取控制，讓員工無需 VPN 就能安全存取內部 Web 應用（驗證 Google 身分 + IAM 授權）","加密 VPC 內的所有流量","管理 Service Account 的權限"],a:[1],e:"IAP 在應用程式前加上身分驗證和授權層：(1) 驗證使用者的 Google/Workspace 身分；(2) 檢查 IAM 政策（iap.httpsResourceAccessor 角色）；(3) 通過才能存取後端。員工遠端辦公不需要 VPN 就能安全存取內部工具（如 Jenkins、Grafana），是 Zero Trust 模型的實現。"},
{d:3,q:"Cloud NAT 的主要功能是？",o:["讓外部使用者存取私有 VM","讓沒有外部 IP 的 VM 可以主動發起對網際網路的連線（如下載更新、呼叫外部 API），同時外部無法主動連入","替代 VPC 防火牆","加密對外的網路流量"],a:[1],e:"Cloud NAT（Network Address Translation）：讓私有子網路（無外部 IP）的 VM 對外連網，同時保持外部無法主動連入（比 NAT Gateway 更安全）。完全受管，無需維護 NAT VM，自動擴縮。適合所有生產 VM 都不需要外部 IP 的架構（安全標準做法）。"},
{d:3,q:"Binary Authorization 在 GKE 中的用途是？",o:["驗證 GKE 節點的硬體配置","確保部署到 GKE 的容器映像必須有特定的認證簽章（如通過 CI/CD 安全掃描），防止未授權映像部署","加密 GKE 節點間的通訊","管理 GKE 的 RBAC 規則"],a:[1],e:"Binary Authorization 實作「供應鏈安全」：只有通過特定簽章方（Attestor）認證的映像才能部署。典型流程：CI/CD 掃描漏洞 → 通過後簽章 → GKE 只允許有簽章的映像。防止開發者繞過安全掃描直接部署未審核的映像。"},
{d:3,q:"GCP 的 Cloud KMS（Key Management Service）支援哪種金鑰輪換策略？",o:["金鑰不能輪換，需要建立新的 Key Ring","設定自動輪換週期（如每 90 天），輪換後新資料用新版本加密，舊資料仍可用舊版本解密（版本共存）","每次輪換後所有舊資料必須重新加密","只有 Customer-Managed Keys 支援輪換"],a:[1],e:"Cloud KMS 金鑰輪換：設定 Rotation Period（如 90 天），到期後自動建立新版本（Primary Version）用於加密新資料；舊版本保留用於解密舊資料（直到所有舊資料重新加密完畢才能廢棄）。CMEK（Customer-Managed Encryption Keys）和 CSEK 都支援輪換。"},
{d:3,q:"GCP IAM 中，Primitive Roles（Owner/Editor/Viewer）和 Predefined Roles 的最主要差異是？",o:["Primitive Roles 只適用於特定服務","Primitive Roles 授予極廣泛的權限（跨所有服務），違反最小權限原則；Predefined Roles 針對特定服務的特定操作，粒度更細","Predefined Roles 比 Primitive Roles 貴","只有 Primitive Roles 可以在專案層級使用"],a:[1],e:"Primitive Roles（基本角色）是 GCP 早期遺留設計：Owner = 全部權限、Editor = 讀寫、Viewer = 只讀，授予的是整個 GCP Project 的廣泛存取。最佳實踐：生產環境永遠使用 Predefined Roles（如 roles/storage.objectViewer），不使用 Primitive Roles（尤其是 Editor 和 Owner）。"},
{d:3,q:"VPC Peering 和 Cloud Router（BGP）的主要差異是？",o:["VPC Peering 用於跨 Region；Cloud Router 只在同 Region","VPC Peering 連接兩個 VPC（對等互連，路由不傳遞）；Cloud Router 讓 VPN/Interconnect 透過 BGP 自動交換路由（動態路由）","兩者都用於 on-premises 到 GCP 的連線","Cloud Router 比 VPC Peering 便宜"],a:[1],e:"VPC Peering：連接兩個 GCP VPC，路由非傳遞性（A-B Peering + B-C Peering，A 無法直接存取 C）。Cloud Router：配合 Cloud VPN 或 Interconnect，啟用 BGP 動態路由（on-premises ↔ GCP，路由自動交換），適合複雜的混合雲路由。"},
// ===== 追加題庫：維運與成本 =====
{d:4,q:"Cloud Monitoring 的 Uptime Check 和 Alerting Policy 如何搭配？",o:["兩者互相獨立，不能整合","Uptime Check 定期探測端點的可用性；Alerting Policy 可以基於 Uptime Check 失敗（或任何指標）觸發通知（Email/PagerDuty/Slack）","Alerting Policy 可以自動修復問題","Uptime Check 只能監控 HTTP 服務"],a:[1],e:"Uptime Checks 從全球多個位置探測你的 HTTP/TCP 端點，當兩個以上位置探測失敗時記錄為「失敗」。搭配 Alerting Policy 設定失敗閾值（如失敗持續 1 分鐘則告警），通知到 Email、Slack、PagerDuty。不需要在 VM 內安裝任何 Agent。"},
{d:4,q:"Cloud Logging 的 Log-based Metrics 主要用途是？",o:["把日誌備份到 Cloud Storage","把日誌中的特定模式（如 'ERROR' 次數、HTTP 500 回應數）轉換為 Cloud Monitoring 指標，用於建立 Dashboard 和 Alert","讓日誌可以用 SQL 查詢","減少日誌儲存費用"],a:[1],e:"Log-based Metrics 讓你從非結構化日誌中提取有意義的數字（計數器/分佈）轉成指標，再用 Monitoring 建立 Alert。例如：監控應用日誌中 'CRITICAL' 級別的出現次數，超過閾值時警告。不需要改應用程式程式碼，只需在 Logging 設定過濾器。"},
{d:4,q:"使用 gcloud CLI 時，如何切換當前操作的 GCP 專案？",o:["重新登入 gcloud","gcloud config set project PROJECT_ID","gcloud projects switch PROJECT_ID","修改 ~/.gcloud/config 檔案"],a:[1],e:"gcloud config set project PROJECT_ID 設定預設專案。也可以用 gcloud config configurations 管理多組設定（如不同帳號/專案）。單次命令可用 --project 旗標覆蓋（如 gcloud compute instances list --project=my-project）。考試常考 gcloud 基本指令語法。"},
{d:4,q:"Cloud Billing 的 Budget Alert 觸發後會自動做什麼？",o:["自動停止所有 GCP 資源","只發送通知（Email 或 Pub/Sub）；預算超過不會自動停止服務，需要自行寫程式回應 Pub/Sub 訊息來控制資源","自動降級所有 VM 到最小規格","自動刪除非必要資源"],a:[1],e:"重要考點：GCP Budget Alert 本身只是通知機制，不自動停止資源。若要實現自動控制（如停止 VM），需要：Budget Alert → Pub/Sub → Cloud Functions（呼叫 API 停止資源）。這個設計避免意外停止生產環境。只想測試的人常用手動方式或 Organization Policy 限制來控制支出。"},
{d:4,q:"Cloud Asset Inventory 的主要用途是？",o:["管理 GCP 資產（VM、磁碟）的採購流程","提供跨專案/組織的 GCP 資源盤點（搜尋、匯出所有資源及其 IAM 政策），支援歷史快照（最多 5 週）","替代 Cloud Monitoring 的指標收集","自動優化 GCP 資源配置"],a:[1],e:"Cloud Asset Inventory 讓你查詢「我整個組織裡有哪些 GCS Bucket？它們的 IAM 設定是什麼？」這類跨專案問題。支援 gcloud asset search-all-resources 和 export 到 BigQuery 進行大規模分析。安全稽核和合規常用工具。"},
{d:4,q:"SRE（Site Reliability Engineering）實踐中，SLO（Service Level Objective）和 Error Budget 的關係是？",o:["Error Budget 和 SLO 無關","Error Budget = 1 - SLO。例如 SLO=99.9%，Error Budget 為 0.1%（約每月 43 分鐘）。Error Budget 耗盡時，開發應停止新功能發布，專注可靠性","Error Budget 是費用預算的一部分","SLO 超過 SLA 就會自動賠償"],a:[1],e:"Error Budget 是 SRE 核心概念：SLO 99.9% 代表每月允許 0.1%（約 43 分鐘）不可用。Error Budget 讓開發和 SRE 有共同語言：Budget 充足 → 可以快速發版；Budget 耗盡 → 凍結發版、全力搞穩定性。把「可靠性投入」量化為業務資源。"},
{d:4,q:"以下哪個 gcloud 指令可以列出某個專案的所有 Compute Engine 執行個體？",o:["gcloud compute list","gcloud compute instances list --project=PROJECT_ID","gcloud instances list","gcloud vm list --project=PROJECT_ID"],a:[1],e:"gcloud compute instances list 是列出 VM 執行個體的正確指令。常用旗標：--project（指定專案）、--filter（如 --filter=zone:us-central1-a）、--format（如 --format=json）。ACE 考試會考 gcloud 指令的資源類型（compute instances vs compute disks vs compute images 等）。"}

const app = document.getElementById("app");

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderSetup(){
  const wrong = JSON.parse(localStorage.getItem("gcp_wrong")||"[]");
  app.innerHTML = `
  <div class="card">
    <h2 style="margin-bottom:8px;">選擇測驗模式</h2>
    <p class="stat" style="margin-bottom:12px;">題庫共 ${QUESTIONS.length} 題 · 依 GCP ACE 四大領域比重出題 · 及格線 70%</p>
    <div class="setup-opt" onclick="startQuiz('all')"><h3>📝 完整模擬考（${QUESTIONS.length} 題）</h3><p>全領域隨機出題，模擬正式考試</p></div>
    <div class="setup-opt" onclick="startQuiz('d1')"><h3>🖥️ 領域 1：計算與容器（${QUESTIONS.filter(q=>q.d===1).length} 題）</h3><p>Compute Engine、GKE、Cloud Run、App Engine</p></div>
    <div class="setup-opt" onclick="startQuiz('d2')"><h3>🗄️ 領域 2：儲存與資料庫（${QUESTIONS.filter(q=>q.d===2).length} 題）</h3><p>Cloud Storage、Cloud SQL、Bigtable、BigQuery</p></div>
    <div class="setup-opt" onclick="startQuiz('d3')"><h3>🔒 領域 3：網路與安全（${QUESTIONS.filter(q=>q.d===3).length} 題）</h3><p>VPC、防火牆、IAM、Cloud Armor、VPN</p></div>
    <div class="setup-opt" onclick="startQuiz('d4')"><h3>📊 領域 4：維運與成本（${QUESTIONS.filter(q=>q.d===4).length} 題）</h3><p>Monitoring、Logging、Billing、Cost Optimization</p></div>
    ${wrong.length>0?`<div class="setup-opt" onclick="startQuiz('wrong')"><h3>❌ 複習錯題（${wrong.length} 題）</h3><p>上次答錯的題目重新練習</p></div>`:''}
  </div>`;
}

function startQuiz(m){
  mode=m;
  if(m==='all') quiz=shuffle(QUESTIONS);
  else if(m.startsWith('d')) quiz=shuffle(QUESTIONS.filter(q=>q.d===+m[1]));
  else if(m==='wrong'){const w=JSON.parse(localStorage.getItem("gcp_wrong")||"[]");quiz=shuffle(QUESTIONS.filter((q,i)=>w.includes(i)));}
  idx=0; answers=[];
  renderQ();
}

function renderQ(){
  if(idx>=quiz.length){renderResult();return;}
  const q=quiz[idx]; submitted=false; selected=new Set();
  const isMulti=q.a.length>1;
  app.innerHTML=`
  <div class="progress-wrap"><div class="progress-bar" style="width:${idx/quiz.length*100}%"></div></div>
  <div class="card">
    <div class="domain-tag">${DOMAINS[q.d]}</div>
    <div class="q-text">${idx+1}. ${q.q}</div>
    ${isMulti?`<div class="multi-hint">⚠️ 多選題，請選出所有正確答案（共 ${q.a.length} 項）</div>`:''}
    ${q.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    <div class="explain" id="exp"></div>
    <div class="toolbar">
      <span class="stat">第 ${idx+1} / ${quiz.length} 題</span>
      <button class="btn btn-primary" id="submitBtn" onclick="submitAns()" disabled>確認答案</button>
    </div>
  </div>`;
}

function pick(i){
  if(submitted) return;
  const q=quiz[idx];
  if(q.a.length===1){selected.clear();selected.add(i);}
  else{if(selected.has(i))selected.delete(i);else selected.add(i);}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.classList.toggle('selected',selected.has(j));});
  document.getElementById('submitBtn').disabled=selected.size===0;
}

function submitAns(){
  if(submitted||selected.size===0) return;
  submitted=true;
  const q=quiz[idx];
  const correct=q.a.slice().sort().join(',');
  const userAns=[...selected].sort().join(',');
  const ok=correct===userAns;
  answers.push({q:QUESTIONS.indexOf(q),ok});
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(q.a.includes(j))b.classList.add('correct');
    else if(selected.has(j))b.classList.add('wrong');
  });
  const exp=document.getElementById('exp');
  exp.classList.add('show');
  exp.innerHTML=`<div class="verdict">${ok?'✅ 正確！':'❌ 答錯了'}</div>${q.e}`;
  document.getElementById('submitBtn').textContent='下一題 →';
  document.getElementById('submitBtn').onclick=()=>{idx++;renderQ();};
  document.getElementById('submitBtn').disabled=false;
}

function renderResult(){
  const total=answers.length;
  const correct=answers.filter(a=>a.ok).length;
  const pct=Math.round(correct/total*100);
  const pass=pct>=70;
  const wrongIds=answers.filter(a=>!a.ok).map(a=>a.q);
  localStorage.setItem("gcp_wrong",JSON.stringify(wrongIds));
  const byDomain={};
  answers.forEach(a=>{
    const dq=QUESTIONS[a.q];
    if(!byDomain[dq.d])byDomain[dq.d]={ok:0,total:0};
    byDomain[dq.d].total++;
    if(a.ok)byDomain[dq.d].ok++;
  });
  app.innerHTML=`
  <div class="card">
    <h2 style="text-align:center">測驗結果</h2>
    <div class="result-big ${pass?'pass':'fail'}">${pct}%</div>
    <p style="text-align:center;margin-bottom:20px;">${correct} / ${total} 題正確 · ${pass?'🎉 通過！':'💪 繼續加油，再試一次！'}</p>
    <h3 style="margin-bottom:12px;">各領域表現</h3>
    ${Object.entries(byDomain).map(([d,s])=>`
      <div class="domain-row"><span>${DOMAINS[d]}</span><span>${s.ok}/${s.total} (${Math.round(s.ok/s.total*100)}%)</span></div>
    `).join('')}
    <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="renderSetup()">重新測驗</button>
      ${wrongIds.length>0?`<button class="btn btn-outline" onclick="startQuiz('wrong')">複習錯題 (${wrongIds.length}題)</button>`:''}
    </div>
  </div>`;
}

renderSetup();
</script>
