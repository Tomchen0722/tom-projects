<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO 27001 互動模擬試題</title>
<style>
  :root{--blue:#1e40af;--sky:#0ea5e9;--dark:#0f172a;--bg:#f0f4ff;--good:#16a34a;--bad:#dc2626;--muted:#64748b;--border:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
  body{background:var(--bg);min-height:100vh;}
  .topbar{background:var(--blue);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.85rem;}
  .topbar .sep{opacity:.4;}
  .hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:40px 24px 32px;text-align:center;}
  .hero h1{font-size:1.8rem;margin-bottom:8px;}
  .hero h1 span{color:#60a5fa;}
  .hero p{opacity:.85;max-width:560px;margin:0 auto;line-height:1.8;font-size:.92rem;}
  .wrap{max-width:800px;margin:0 auto;padding:28px 16px 60px;}
  .card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 3px 14px rgba(0,0,0,.08);margin-bottom:16px;}
  .card h2{font-size:1.15rem;color:var(--blue);}
  .card h3{font-size:.98rem;color:#1e293b;}
  .stat{font-size:.85rem;color:var(--muted);line-height:1.7;}
  .setup-opt{border:2px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .setup-opt:hover{border-color:var(--sky);background:#f0f9ff;transform:translateX(3px);}
  .setup-opt h3{font-size:.98rem;color:#1e293b;margin-bottom:4px;}
  .setup-opt p{font-size:.82rem;color:var(--muted);line-height:1.6;}
  .progress-wrap{background:#dbeafe;border-radius:8px;height:8px;overflow:hidden;margin-bottom:10px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .3s;}
  .domain-tag{display:inline-block;background:#dbeafe;color:var(--blue);padding:4px 12px;border-radius:12px;font-size:.75rem;font-weight:700;margin-bottom:12px;}
  .q-text{font-size:1rem;color:#1e293b;line-height:1.85;margin-bottom:16px;font-weight:600;}
  .multi-hint{background:#fff7ed;color:#c2410c;border-radius:8px;padding:8px 14px;font-size:.82rem;margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:9px;font-size:.92rem;color:#334155;cursor:pointer;transition:.15s;line-height:1.7;}
  .opt:hover:not(:disabled){border-color:var(--sky);background:#f0f9ff;}
  .opt.selected{border-color:var(--blue);background:#dbeafe;}
  .opt.correct{border-color:var(--good);background:#f0fdf4;color:#15803d;font-weight:600;}
  .opt.wrong{border-color:var(--bad);background:#fef2f2;color:#b91c1c;}
  .opt:disabled{cursor:default;}
  .explain{display:none;background:#eff6ff;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:14px 18px;margin-top:12px;font-size:.9rem;color:#1e3a8a;line-height:1.9;}
  .explain.show{display:block;}
  .verdict{font-weight:700;margin-bottom:6px;font-size:.95rem;}
  .toolbar{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn{padding:11px 24px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#1d4ed8;}
  .btn-outline{background:#f1f5f9;color:#475569;}
  .btn-outline:hover{background:#e2e8f0;}
  .result-big{font-size:3.4rem;font-weight:700;margin:12px 0;}
  .result-big.pass{color:var(--good);}
  .result-big.fail{color:var(--bad);}
  .domain-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:.88rem;color:#334155;gap:12px;}
  .domain-row:last-child{border-bottom:none;}
  footer{text-align:center;padding:18px;color:#94a3b8;font-size:.8rem;}
</style>
</head>
<body>
<div class="topbar">

<div class="hero">
  <h1>📝 <span>ISO 27001</span> 互動模擬試題</h1>
  <p>依 ISO/IEC 27001:2022（含 Amendment 1:2024）出題，四大主題涵蓋條款、控制項、風險與稽核實務。每題都有完整解析，答錯的會自動進入複習清單。</p>
</div>

<div class="wrap"><div id="app"></div></div>
<footer>ISO 27001 學習指南 · 成績與錯題儲存於瀏覽器本機</footer>

<script>
const QUESTIONS = [
// ---------- 主題 1：標準架構與條款 ----------
{d:1,q:"ISO/IEC 27001:2022 的條款 4「組織及其全景之理解」中，2024 年的修訂新增了什麼要求？",o:["組織應執行溫室氣體盤查並取得查證","組織應判定氣候變遷是否為相關議題","組織應設置永續發展委員會","組織應揭露供應鏈的碳排放量"],a:[1],e:"Amendment 1:2024 在 4.1 加入「組織應判定氣候變遷是否為相關議題」，並在 4.2 加入註記說明利害相關者可能有氣候變遷相關要求。這是資訊安全角度的判定（極端氣候是否衝擊可用性、供應鏈、人員到班），<b>不是要求做碳盤查</b>——碳盤查屬於 ISO 14064／14001 的範疇。判定為「不相關」也可以，但必須說得出理由。"},
{d:1,q:"ISMS 的核心運作模式 PDCA 中，「內部稽核與管理審查」屬於哪一個階段？",o:["Plan（規劃）","Do（執行）","Check（查核）","Act（行動）"],a:[2],e:"Check 階段對應條款 9「績效評估」，包含 9.1 監視、量測、分析與評估，9.2 內部稽核，9.3 管理審查。Plan 對應條款 4–6（全景、領導、規劃），Do 對應條款 7–8（支援、運作），Act 對應條款 10（改善）。"},
{d:1,q:"關於 ISO 27001 的條款結構，下列敘述何者正確？",o:["條款 1–3 與條款 4–10 都是可稽核的要求","條款 4–10 是強制要求，條款 1–3 為範圍、引用標準與名詞定義","只有 Annex A 是強制要求，條款都是建議","條款 4–10 可依組織規模選擇性採用"],a:[1],e:"條款 1（適用範圍）、2（引用標準）、3（名詞與定義）是說明性內容，不含可稽核的要求。<b>條款 4 到 10 才是強制要求，全部都要做到，不能因為公司小就跳過。</b>Annex A 則是控制項的參考清單，可依風險評估結果決定適用與否（但排除要有理由）。"},
{d:1,q:"條款 5「領導」要求最高管理階層必須親自負責的事項，不包括下列何者？",o:["建立資訊安全政策","確保 ISMS 所需資源到位","親自執行每一次的風險評估作業","確保 ISMS 達成其預期結果"],a:[2],e:"條款 5.1 要求最高管理階層展現領導與承諾：建立政策、確保資源、整合到業務流程、確保達成預期結果、支持相關人員。<b>但實際執行風險評估是可以指派的</b>——管理階層負責的是確保它有被執行、結果有被審查與核准，不是自己動手做。考題常用「親自執行」當誘答。"},
{d:1,q:"ISO 27001:2022 相較於 2013 版，在條款 10「改善」上做了什麼調整？",o:["刪除了矯正措施的要求","將「持續改善」移到 10.1，「不符合與矯正措施」移到 10.2","新增了預防措施條款","把改善併入條款 9"],a:[1],e:"2013 版是 10.1 不符合事項與矯正措施、10.2 持續改善；<b>2022 版把順序對調</b>，10.1 成為持續改善、10.2 為不符合事項及矯正措施。這個順序調整強調持續改善的主導地位。內容要求本身沒有實質改變。"},
{d:1,q:"組織聲稱「本公司規模小，沒有專職資安人員，因此不制定資訊安全目標」。這個做法違反了哪一條？",o:["條款 6.2 資訊安全目標及達成規劃","條款 7.2 能力","條款 8.1 運作之規劃及管制","條款 9.1 監視、量測、分析及評估"],a:[0],e:"條款 6.2 明確要求組織必須在相關職能與層級建立<b>可量測的</b>資訊安全目標，並規劃如何達成（做什麼、需要什麼資源、誰負責、何時完成、如何評估結果）。這是強制要求，與公司規模無關。人力不足可以讓目標訂得務實一點，但不能不訂。"},
{d:1,q:"條款 7.5「文件化資訊」對文件管制的要求，下列何者<b>不是</b>必要項目？",o:["適當的識別與敘述（標題、日期、作者、參考編號）","適當的格式與媒體","發布前的審查與核准","所有文件都必須以紙本形式保存並用印"],a:[3],e:"條款 7.5.2 要求識別與敘述、格式與媒體、發布前的審查與核准；7.5.3 要求管制文件的可取得性、保護、散布、存取、擷取、使用、版本管制、保存與汰除。<b>沒有任何條文要求必須是紙本或用印</b>——電子文件系統完全可以，而且更容易做到版本管制。"},
{d:1,q:"ISO 管理系統標準採用「高階結構（HLS）」帶來的最大好處是？",o:["所有標準的控制項完全相同","條款 4–10 的架構一致，多標準整合導入時可共用文件與流程","可以省略風險評估","認證費用會自動打折"],a:[1],e:"HLS 讓 ISO 27001、9001、14001、22301、27701 等標準的條款 4–10 架構完全一致（全景、領導、規劃、支援、運作、績效評估、改善）。<b>整合導入時，管理審查、內部稽核、文件管制、不符合處理等流程可以共用一套</b>，只是各自補上專業要求。這是多標準企業省力的關鍵。"},
{d:1,q:"條款 8.1 要求組織必須「保存文件化資訊，以在必要程度上確信過程已依規劃執行」。這句話的實務意義是？",o:["所有作業都要錄影存證","要有證據證明程序不只寫在紙上，而是真的被執行","只要有程序書就足夠","文件要每月更新一次"],a:[1],e:"這是稽核時最常被引用的條文之一。<b>「有程序書」證明的是規劃，「有執行紀錄」才證明運作。</b>例如有權限複核程序但拿不出任何一次複核紀錄，就違反 8.1。實務上證據可以是系統日誌、工單、簽核紀錄，不必額外造表單。"},
{d:1,q:"條款 9.1 要求「監視、量測、分析及評估」。組織必須決定的事項不包括？",o:["需要監視及量測什麼","何時執行監視及量測、由誰執行","監視及量測結果何時分析評估、由誰分析","監視工具必須採購自國際知名廠商"],a:[3],e:"條款 9.1 要求決定：監視量測的對象、方法（須能產生可比較與可重現的結果）、執行的時機與人員、分析評估的時機與人員。<b>標準完全不指定工具與廠商</b>——用 Excel 手工統計也符合要求，只要方法一致、結果可重現。"},
{d:1,q:"某公司的資訊安全政策由資訊部經理簽署發布。稽核員認為不妥。理由是？",o:["政策必須由外部顧問簽署","條款 5.2 要求資訊安全政策由最高管理階層建立","政策必須經全體員工投票通過","政策必須由法務部門簽署"],a:[1],e:"條款 5.2 明訂資訊安全政策應由<b>最高管理階層</b>建立。這不只是形式——政策代表組織層級的承諾與資源投入，由部門主管簽署會讓政策的權威僅限於該部門。實務上應由總經理、執行長或董事會層級簽署。"},
{d:1,q:"條款 6.3「變更之規劃」是 ISO 27001:2022 相對於舊版強化的部分。它要求什麼？",o:["所有 IT 變更都必須經 CAB 委員會核准","當組織決定需要變更 ISMS 時，變更應以有計畫的方式執行","禁止在營業時間進行任何系統變更","變更必須由外部稽核員核准"],a:[1],e:"條款 6.3 要求對 ISMS 本身的變更（範圍調整、組織改組、新增業務線、導入新技術）要有計畫地進行，而不是臨時改了就算。<b>注意它管的是 ISMS 層級的變更</b>，個別系統的技術變更管理是 Annex A 的 A.8.32（變更管理）。這兩層常被混淆。"},
{d:1,q:"下列何者<b>不是</b>條款 7.4「溝通」要求組織決定的事項？",o:["溝通什麼內容","何時溝通、與誰溝通","如何溝通","溝通使用的語言必須是英文"],a:[3],e:"條款 7.4 要求決定與 ISMS 相關的內部與外部溝通需求：溝通內容、時機、對象、方式。<b>沒有語言限制。</b>實務上這條涵蓋的包括：資安政策怎麼讓員工知道、資安事件怎麼通報主管機關與客戶、稽核結果怎麼回報管理層。"},
{d:1,q:"組織在條款 4.3 界定 ISMS 範圍時，必須考慮的因素<b>不包括</b>？",o:["內外部議題（4.1）","利害相關者的要求（4.2）","組織與其他組織間的介面與相依性","競爭對手的認證範圍"],a:[3],e:"條款 4.3 要求界定範圍時考慮 4.1 的內外部議題、4.2 的利害相關者要求，以及組織活動與其他組織活動之間的介面與相依性（例如委外的部分怎麼處理）。<b>競爭對手做什麼與你的範圍界定無關</b>——範圍應該由自己的風險與利害相關者需求決定。"},
{d:1,q:"關於「ISMS 範圍」的敘述，下列何者正確？",o:["範圍一旦確定就不能變更","範圍必須涵蓋組織的全部部門與場所","範圍可以是組織的一部分，但必須文件化且不能誤導外界","範圍由驗證機構決定"],a:[2],e:"範圍可以只涵蓋部分業務、部門或場所（例如只認證某條產品線或某個資料中心），這是完全合法的，也是資源有限時的常見策略。<b>但兩個前提：① 必須文件化；② 切法不能讓客戶誤以為涵蓋範圍更大。</b>範圍也可以事後擴充，走變更程序並由驗證機構確認即可。"},
{d:1,q:"條款 7.3「認知」與條款 7.2「能力」的差別是？",o:["兩者完全相同，只是用詞不同","7.2 是確保人員具備必要的技能與資格；7.3 是確保人員知道政策、自己的貢獻與不遵循的後果","7.2 針對主管，7.3 針對基層","7.2 是內部訓練，7.3 是外部訓練"],a:[1],e:"<b>7.2 能力</b>＝這個人有沒有本事做這件事（教育、訓練、經驗，並保存證據）。<b>7.3 認知</b>＝所有在組織控制下工作的人（含承攬商）是否知道資安政策、自己對 ISMS 有效性的貢獻、以及不符合規定的後果。認知的對象範圍比能力更廣，要求層次較淺但涵蓋所有人。"},
{d:1,q:"某公司主張：「我們已通過 ISO 9001，管理審查一年開一次品質會議即可涵蓋 ISO 27001。」這個做法可行嗎？",o:["完全不可行，兩套系統必須完全分開","可行，但管理審查的議程必須涵蓋條款 9.3 要求的所有資安輸入項目","可行，不需要任何額外調整","只有大型企業才能整合"],a:[1],e:"整合式管理審查是被鼓勵的（HLS 的設計目的之一）。<b>但條款 9.3 列出的輸入項目必須全部涵蓋</b>：前次審查的後續行動、內外部議題變更、利害相關者回饋、資安績效（不符合、監視量測結果、稽核結果、目標達成度）、風險評鑑與處理計畫狀態、持續改善機會。議程沒涵蓋就是不符合，開一場或兩場會不是重點。"},
{d:1,q:"ISO 27001 中「文件化資訊（documented information）」這個用詞取代了舊版的哪兩個詞？",o:["政策與程序","文件（documents）與紀錄（records）","證據與稽核軌跡","範圍與界限"],a:[1],e:"2013 版起 ISO 統一改用「文件化資訊」，同時涵蓋舊版的「文件」（規範未來要怎麼做，如政策、程序書）與「紀錄」（證明過去做了什麼，如稽核報告、訓練簽到表）。實務上兩者的管制重點不同：<b>文件重版本管制，紀錄重完整性與保存期限</b>，但標準用同一個詞涵蓋。"},
// ---------- 主題 2：Annex A 控制項 ----------
{d:2,q:"ISO 27001:2022 的 Annex A 共有幾個控制項，分成幾大類？",o:["114 個，14 大類","93 個，4 大類","93 個，14 大類","133 個，4 大類"],a:[1],e:"2022 版重組為 <b>93 個控制項、4 大類</b>：A.5 組織控制（37 項）、A.6 人員控制（8 項）、A.7 實體控制（14 項）、A.8 技術控制（34 項）。2013 版是 114 個控制項、14 個領域。控制項減少是因為合併，不是刪減要求，同時新增了 11 個全新控制項。"},
{d:2,q:"下列哪一個<b>不是</b> ISO 27001:2022 新增的 11 個控制項之一？",o:["A.5.7 威脅情資","A.5.23 雲端服務使用之資訊安全","A.8.11 資料遮罩","A.8.13 資訊備份"],a:[3],e:"A.8.13 資訊備份在 2013 版就存在（舊編號 A.12.3.1）。11 個新控制項是：A.5.7 威脅情資、A.5.23 雲端服務使用、A.5.30 ICT 營運持續整備、A.7.4 實體安全監控、A.8.9 組態管理、A.8.10 資訊刪除、A.8.11 資料遮罩、A.8.12 資料外洩防護、A.8.16 監視活動、A.8.23 網頁過濾、A.8.28 安全編碼。"},
{d:2,q:"公司採購了 SIEM 系統並提供合約與畫面截圖，作為 A.8.16（監視活動）的證據，仍被開出不符合。最可能的理由是？",o:["SIEM 廠商不在核准清單內","有工具不等於有活動：缺少告警的處理紀錄與判定基準","截圖沒有加浮水印","SIEM 必須部署在地端"],a:[1],e:"A.8.16 要求的是「監視」這個<b>活動</b>，完整的證據鏈是：監視範圍與資料來源 → 異常判定基準（基準線／規則）→ 告警產生 → <b>誰在何時做了什麼處理</b> → 結案紀錄。採購合約只證明買了系統。稽核員典型的追問是：「請給我看上個月的告警清單，挑三筆說明處理過程。」"},
{d:2,q:"A.5.3「職責分離」在小型組織（例如只有 2 名 IT 人員）無法完全落實時，正確的處理方式是？",o:["直接在 SOA 標記為不適用","仍標記為適用，但說明因規模限制無法完全分離，並實施補償性控制（如事後覆核、日誌監控）","隱瞞這個事實","強制增聘人員"],a:[1],e:"職責分離是為了降低單人舞弊或誤操作的風險，這個風險在小公司同樣存在，<b>因此不能標為不適用</b>。正確做法是承認限制並補上補償控制：特權操作的事後覆核（由主管或另一部門）、關鍵操作雙人確認、日誌獨立保存讓執行者無法竄改。稽核員接受這種務實做法，只要決策有紀錄。"},
{d:2,q:"某 SaaS 公司完全使用 AWS，沒有自有機房。它在 SOA 中把部分 A.7（實體控制）標記為不適用。這個做法：",o:["絕對不行，所有控制項都必須適用","可行，但理由必須寫出責任移轉的證據（如已取得雲端商的認證報告並定期審查）","可行，只要寫「使用雲端」四個字即可","只有辦公室也在雲端時才可行"],a:[1],e:"資料中心層級的實體控制確實由雲端服務商負責，標記不適用是合理的。<b>但理由的寫法決定成敗</b>：不能只寫「我們用 AWS」，要寫明取得了對方的 ISO 27001／SOC 2 報告、報告涵蓋哪些控制項、什麼時候複查一次。同時要注意辦公室相關的實體控制（門禁、清桌、設備安全）仍然適用。"},
{d:2,q:"A.8.10（資訊刪除）這個新控制項要求的核心是？",o:["所有資料都必須在一年內刪除","建立保存期限政策，且到期的資料要真的被刪除，並依媒體選擇適當的刪除方式","禁止刪除任何資料以保留稽核軌跡","只需要刪除紙本文件"],a:[1],e:"A.8.10 對應個資法規的刪除要求與「過度保存」的風險。完整做法：① 依法規與業務需求訂定各類資料的保存期限；② 建立到期刪除機制（最好自動化）；③ 依媒體選擇刪除方式——磁碟覆寫或加密抹除、SSD 用安全抹除、<b>報廢硬碟實體銷毀並保留銷毀證明</b>；④ 雲端要確認供應商的刪除承諾。常見缺失是「先留著以防萬一」留了五年。"},
{d:2,q:"開發團隊把正式環境的資料庫直接複製到測試環境供開發使用，其中含有真實客戶個資。這違反哪個控制項？",o:["A.8.11 資料遮罩","A.8.13 資訊備份","A.5.14 資訊傳送","A.7.10 儲存媒體"],a:[0],e:"A.8.11 明確要求依組織的存取控制政策與業務需求，對資料進行遮罩、假名化或匿名化。測試環境的存取控制通常比正式環境寬鬆（開發、測試、外包廠商都有帳號），監控與日誌也較弱，直接使用真實個資會讓暴露面大幅擴張。<b>若涉及特種個資（如病歷），通常直接判 Major NC。</b>「有防火牆擋著」只回應外部威脅，回應不了內部過度暴露。"},
{d:2,q:"A.5.7（威脅情資）要做到什麼程度才算真的落實？",o:["訂閱資安電子報即可","有情資來源、有人定期檢視，且檢視結果連接到弱點修補或風險評估流程","購買商業威脅情資平台","指派一名專職威脅情資分析師"],a:[1],e:"控制項不看你花了多少錢，看的是<b>閉環</b>：情資來源（TWCERT、CISA、CVE 公告、供應商安全通告）→ 有指定人員定期檢視 → 相關的情資能觸發行動（評估自身是否受影響、排入修補、必要時更新風險評估）。只訂閱不看，或看了不做事，都無法通過抽查。稽核提問通常是：「上個月有哪則情資跟你們有關？後續怎麼處理？」"},
{d:2,q:"A.8.9（組態管理）的稽核提問最可能是下列哪一個？",o:["請給我看伺服器的安全基準文件，然後隨機挑一台驗證是否符合","請給我看伺服器的採購發票","請說明機房的溫濕度控制","請提供防毒軟體的授權數量"],a:[0],e:"A.8.9 的關鍵字是<b>「安全基準組態」</b>：為每類系統定義基準（可直接採用 CIS Benchmark）、定期偵測偏差、偏差要修正或走例外申請。稽核方式就是拿基準文件比對實機。常見缺失是「我們有標準安裝流程」但拿不出基準文件，也沒有人檢查現行機器是否偏離。"},
{d:2,q:"關於 A.8.28（安全編碼），下列哪一項<b>不是</b>合適的稽核證據？",o:["GitHub Pull Request 的程式碼審查紀錄","SAST 與 SCA 的掃描報告","開發人員的安全編碼訓練紀錄","程式語言的官方文件"],a:[3],e:"A.8.28 要求安全編碼規範、程式碼審查、自動化檢測（SAST 掃自寫程式、SCA 掃第三方套件漏洞、Secret Scanning 擋金鑰外洩）、開發人員訓練，以及外包開發的合約要求。<b>程式語言的官方文件不是組織的控制證據</b>。稽核員典型做法是隨機開一個上個月的 PR，看是誰審的、審了什麼。"},
{d:2,q:"ISO 27002:2022 為每個控制項標註了五組「屬性」。其中「網路安全概念」屬性的五個值直接對應哪個框架？",o:["ISO 22301 的營運持續","NIST Cybersecurity Framework 的識別、保護、偵測、回應、復原","PCI DSS 的十二項要求","COBIT 的治理目標"],a:[1],e:"「網路安全概念（Cybersecurity concepts）」屬性的值是識別（Identify）、保護（Protect）、偵測（Detect）、回應（Respond）、復原（Recover），與 <b>NIST CSF</b> 的五大功能一致，是跨框架對應的橋樑。另外四組屬性是：控制類型（預防／偵測／矯正）、資訊安全性質（CIA）、營運能力、安全領域。注意屬性是 ISO 27002 的內容，<b>不是 ISO 27001 的強制要求</b>。"},
{d:2,q:"某公司統計 SOA 中適用的控制項，依控制類型分佈為：預防性 68 項、偵測性 9 項、矯正性 4 項。這代表什麼？",o:["防護非常完整，值得表揚","擋得住已知攻擊，但被突破時不會知道，也沒有復原能力","偵測性控制本來就應該最少","統計方式有誤"],a:[1],e:"這是典型的「防護偏食」——預算容易花在看得見的「擋」（防火牆、防毒、權限、加密），而「偵測」（日誌監控、異常告警）與「矯正」（事故回應、備份還原、災難復原）需要持續投入人力而常被略過。後果是攻擊者一旦突破邊界即可長期潛伏。改善方向：A.8.15 記錄、A.8.16 監視活動、A.5.24–5.28 事故管理、A.5.30 ICT 營運持續。"},
{d:2,q:"「資安事件（event）」與「資安事故（incident）」的差別是？",o:["兩者是同義詞","事件是任何被觀察到的狀態變化；事故是已經或可能危害資訊安全的一個或多個事件","事件比事故嚴重","事故只發生在正式環境"],a:[1],e:"<b>事件</b>＝任何可觀察到的狀態變化，例如「某帳號密碼輸錯五次」，多數是雜訊。<b>事故</b>＝已經或可能危害資訊安全的事件，例如「境外 IP 連續嘗試登入並成功一次」。A.5.25 要求的正是「<b>評估資安事件並決定是否分類為資安事故</b>」——也就是你必須有一套升級準則。"},
{d:2,q:"稽核員問「請給我看過去一年的資安事故紀錄」，公司回答「我們一年來完全沒有任何資安事故」。稽核員的合理反應是？",o:["恭喜並記錄為良好實務","追問偵測能力與紀錄機制，因為零事故通常代表看不到或沒記錄","立即開出 Major NC","結束此項稽核"],a:[1],e:"零事故不是好消息。它通常代表兩件事之一：① <b>沒有偵測能力</b>，所以看不到；② 有事但<b>沒有依流程記錄</b>。成熟組織應該有一疊低等級事故紀錄（釣魚郵件通報、誤發郵件、帳號異常登入），這才證明流程是活的。稽核員會據此追查 A.8.16 監視活動與 A.5.24–5.26 的實際運作。"},
{d:2,q:"A.5.29（中斷期間的資訊安全）與 A.5.30（ICT 營運持續整備）的差別是？",o:["兩者相同，只是編號不同","A.5.29 問災難時安全水準會不會下降；A.5.30 問 IT 服務能不能在承諾時間內恢復","A.5.29 針對天災，A.5.30 針對人為攻擊","A.5.30 只適用於雲端環境"],a:[1],e:"<b>A.5.29</b> 的典型缺失是：為了趕快復原，備援環境沒設權限、沒開日誌、用共用帳號——安全水準在災難時掉下來。<b>A.5.30</b>（新控制項）的典型缺失是：有備份但從沒測試還原、RTO 是拍腦袋訂的。兩者證據不同：前者看備援環境的組態與權限，後者看 BIA、RTO／RPO 與<b>復原演練紀錄</b>。"},
{d:2,q:"關於供應商管理控制項（A.5.19–A.5.23），下列敘述何者<b>錯誤</b>？",o:["A.5.20 要求資安要求應寫入與供應商的合約","A.5.21 要求管理 ICT 供應鏈（包含供應商的分包商）","A.5.22 要求持續監視與審查供應商服務","所有供應商都必須採用完全相同的管理強度"],a:[3],e:"供應商<b>分級管理</b>是被接受且被鼓勵的——清潔公司與核心系統廠商不該用同一套程序。實務上分三級：高（接觸機密資料或關鍵系統）需簽資安條款＋年度評鑑＋索取第三方報告；中（可進辦公室）簽保密協議＋定期問卷；低（不接觸資訊資產）僅列冊。稽核員接受分級，但會查<b>分級準則有沒有寫下來、有沒有照著做</b>。"},
{d:2,q:"公司與外包客服商的合約載明「本公司得對供應商執行資安稽核」，但簽約三年來從未執行。這最可能被判定為？",o:["符合要求，因為合約已載明","不符合 A.5.22，且因涉及大量個資與控制項完全未執行，可能判 Major","僅需口頭提醒","屬於供應商的責任，與本公司無關"],a:[1],e:"<b>合約寫了但沒執行，等於沒有這個控制。</b>A.5.22 要求「定期監視、審查與稽核供應商服務交付」。判 Major 的三個理由：涉及最高風險資產（大量會員個資）、控制項<b>完全未執行</b>（不是個案疏漏）、影響範圍是全體會員。這是委外密集產業（電商、電信、保險）最常見的重大缺失。"},
{d:2,q:"A.6.3（資訊安全認知、教育及訓練）的稽核重點是？",o:["訓練教材的頁數","完訓率的客觀證據，且範圍必須涵蓋所有在組織控制下工作的人","講師的證照等級","訓練場地的設備"],a:[1],e:"稽核員看的是<b>完訓證據與涵蓋率</b>。常見缺失是「行政人員完訓率 100%，但醫師／工程師／高階主管只有三成」——高階專業人員不配合是醫療、法律、學術機構的共同難題。解法不是強迫，而是降低參與成本（線上、可分段、短單元）並找內部意見領袖帶頭。「他們很忙」不是稽核員會接受的理由。另外<b>承攬商與外包人員也在範圍內</b>。"},
{d:2,q:"公司發出公告「禁止使用 LINE 傳送客戶資料」，但半年後稽核發現多數員工仍在使用。最根本的問題是？",o:["公告字體太小","只有禁止而沒有提供合規的替代工具，政策淪為紙上控制","員工素質不佳","應該直接開除違規者"],a:[1],e:"只有禁止沒有替代的政策，最後都會變成大家一起違規、主管假裝沒看到——這種「紙上控制」在稽核抽問時很容易露餡，而且會讓整套 ISMS 的可信度受質疑。<b>正確做法是先提供替代方案再禁止</b>：導入可傳影像、有存取紀錄、離職即停用的內部通訊工具，同時搭配訓練與定期查核。"},
{d:2,q:"A.8.2（特權存取權）在金融、醫療等高監理產業的典型落實方式<b>不包括</b>？",o:["使用 PAM 系統與密碼保管庫","特權帳號使用需申請且自動過期","特權操作全程錄影","把特權帳號密碼寫在共用的 Excel 供團隊查閱"],a:[3],e:"共用 Excel 存放特權密碼同時違反 A.8.2（特權存取權）、A.5.17（鑑別資訊）與 A.5.16（身分管理，因為無法識別是誰使用）。正確做法是 PAM／密碼保管庫、申請制與自動過期、操作錄影與日誌獨立保存、定期複核特權清單。這在受監理產業幾乎是必查項目。"},
{d:2,q:"某電商發現有人透過正常的 API 介面大量抓取會員資料，傳統防火牆與弱點掃描完全沒有告警。最相關的控制項組合是？",o:["A.7.1 實體安全周界 + A.7.2 實體進入","A.8.16 監視活動 + A.8.20 網路安全 + A.8.6 容量管理","A.6.1 篩選 + A.6.2 僱用條款","A.5.9 資產清冊 + A.5.10 可接受使用"],a:[1],e:"這是電商特有且最常被忽略的風險——攻擊者沒有「入侵」，只是用合法介面慢慢抓，傳統的邊界防護完全看不到。對策是對每個帳號、每個 IP 建立<b>查詢速率基準線</b>，超出即告警或限流（A.8.16 監視活動、A.8.20 網路安全管制、A.8.6 容量與資源監控），並搭配 WAF 的速率限制規則。"},
// ---------- 主題 3：風險評估、SOA 與文件 ----------
{d:3,q:"ISO 27001 的四種風險處理方式不包括下列何者？",o:["修改／降低（modify）","保留／承擔（retain）","避免（avoid）","忽略（ignore）"],a:[3],e:"四種方式是：<b>修改／降低</b>（實施控制降低風險）、<b>保留／承擔</b>（經評估後接受）、<b>避免</b>（不做這件事、停止該活動）、<b>分擔／移轉</b>（保險、委外，但責任無法完全移轉）。<b>「忽略」不是選項</b>——承擔與忽略的差別在於：承擔要經過評估、有人簽核、有殘餘風險說明、定期重新檢視；忽略是什麼都沒有。"},
{d:3,q:"SOA（適用性聲明書）必須包含的四個欄位是？",o:["控制項、成本、負責人、完成日期","控制項、適用與否、選用或排除的理由、實作狀態","控制項、風險等級、稽核結果、改善建議","控制項、法規來源、供應商、預算"],a:[1],e:"依條款 6.1.3 d)，SOA 必須包含：① 所有必要的控制項（含 Annex A 與自訂控制項）；② 是否適用；③ <b>選用的理由與排除的理由</b>（兩者都要寫）；④ 目前的實作狀態。SOA 是唯一一份稽核員一定會逐項對照的文件，也是外部客戶最常索取的文件。"},
{d:3,q:"關於風險評估，下列敘述何者正確？",o:["ISO 27001 規定必須採用資產基礎（asset-based）的方法","ISO 27001 未規定特定方法，但要求方法一致且結果可重現","必須採用定量方法計算金額損失","必須聘請外部顧問執行"],a:[1],e:"條款 6.1.2 只要求風險評鑑過程能產生<b>一致、有效且可比較的結果</b>，並要求鑑別風險、分析（後果與可能性）、評價（與準則比較並排序）。方法可以是資產基礎、情境基礎、流程基礎，可以是定性或定量。<b>重點是準則要先訂好、方法要一致</b>，換一個人做要得到相近的結果。ISO 27005 提供方法論指引但非強制。"},
{d:3,q:"某公司評估「跨區域備援成本過高」後決定承擔單一區域故障的風險。要讓稽核員接受，最關鍵的是？",o:["把風險從登記表中刪除","有評估紀錄、有適當層級簽核、有補償措施與殘餘風險說明，並定期重新檢視","請顧問背書","降低該風險的評分"],a:[1],e:"風險承擔是完全合法的處理方式，<b>但決策過程必須完整</b>：評估紀錄（為什麼成本不合理）、由具備權限的層級簽核（高風險通常需要高階主管）、補償措施（例如把 RTO 誠實寫進客戶 SLA）、明確的殘餘風險說明、定期重新評估（環境改變時決策可能不再成立）。刪掉風險或竄改評分反而是嚴重問題。"},
{d:3,q:"下列何者<b>不是</b> ISO 27001 要求的強制文件化資訊？",o:["ISMS 範圍","適用性聲明書（SOA）","風險評鑑與風險處理的過程與結果","每台電腦的採購發票"],a:[3],e:"強制文件化資訊包括：ISMS 範圍（4.3）、資訊安全政策（5.2）、風險評鑑過程與結果（6.1.2、8.2）、風險處理過程與結果（6.1.3、8.3）、SOA（6.1.3d）、資訊安全目標（6.2）、能力證據（7.2）、監視量測結果（9.1）、內部稽核方案與結果（9.2）、管理審查結果（9.3）、不符合與矯正措施（10.2）。採購發票屬於財務紀錄，不是 ISMS 強制文件（但資產清冊 A.5.9 是控制項要求）。"},
{d:3,q:"BIA（業務衝擊分析）在營運持續規劃中的作用是？",o:["計算資安投資的報酬率","找出哪些業務流程最不能中斷及中斷後的損失，據以推導 RTO 與 RPO","評估員工績效","決定保險費率"],a:[1],e:"BIA 的產出是 RTO 與 RPO 的依據——<b>它們是分析出來的，不是拍腦袋訂的</b>。BIA 要問：這個流程停多久開始造成損失？損失是多少（營收、罰款、商譽）？有沒有法規規定的恢復時限？依賴哪些系統與人員？稽核員看到 RTO 寫「4 小時」時，會追問「這個數字怎麼來的」。"},
{d:3,q:"某公司的 RPO 設定為 4 小時。這代表什麼？",o:["系統必須在 4 小時內恢復服務","可接受遺失最多 4 小時的資料，因此備份頻率至少要 4 小時一次","備份保留 4 小時後刪除","稽核每 4 小時執行一次"],a:[1],e:"<b>RPO（復原點目標）</b>＝可接受遺失多少資料，以時間衡量。RPO 4 小時代表備份或複寫頻率至少要 4 小時一次。<b>RTO（復原時間目標）</b>才是「多久要恢復服務」。兩者常被混淆：RPO 決定備份策略與成本，RTO 決定備援架構與成本，兩個都是越小越貴，要跟業務談出可接受值。"},
{d:3,q:"稽核員問「上一次備份還原測試是什麼時候」，IT 主管回答「我們每天備份都成功，監控畫面全綠」。這個回答的問題是？",o:["回答完全正確","備份成功只證明資料寫出去，證明不了讀得回來與能在 RTO 內恢復","應該改為每週備份","監控畫面需要列印存檔"],a:[1],e:"<b>沒測過的備份等於沒有備份。</b>A.5.30 要求的核心是驗證復原能力，而不是備份工作有沒有跑完。從未執行過還原測試通常判 <b>Major NC</b>——因為這是控制項的完全缺失，而且一旦真的發生災難，整個營運持續能力等於零。若有做過但只做一次或紀錄不完整，才落在 Minor。"},
{d:3,q:"風險登記表中「殘餘風險（residual risk）」的意思是？",o:["還沒被發現的風險","實施控制措施之後仍然存在的風險","已經發生過的風險","供應商造成的風險"],a:[1],e:"殘餘風險＝原始風險 −（控制措施降低的部分）。任何控制都不可能把風險降到零，所以殘餘風險一定存在。條款 6.1.3 f) 要求<b>取得風險擁有者對風險處理計畫的核准，以及對殘餘風險的接受</b>。稽核員會查：殘餘風險有沒有寫出來？有沒有人簽名接受？超過風險準則的有沒有進一步處理？"},
{d:3,q:"組織在 SOA 中將某個 Annex A 控制項標記為「不適用」。稽核員判斷這個排除是否合理的主要依據是？",o:["排除的控制項數量不能超過 10 個","排除理由是否與風險評估結果及組織實際情況一致","是否經過驗證機構事先核准","是否為新增的控制項"],a:[1],e:"標準沒有規定排除數量上限。稽核員的判斷邏輯是：<b>這個排除理由跟你的風險評估結果、業務性質、範圍界定對不對得上？</b>例如「沒有自行開發軟體，故 A.8.28 安全編碼不適用」在純採購型企業成立，但如果稽核時發現公司有五人的開發團隊，這個排除就是嚴重問題（且可能涉及誠信）。"},
{d:3,q:"風險評估應該多久執行一次？",o:["每五年一次即可","依組織訂定的頻率定期執行，且在發生重大變更時應重新評估","每月一次","只在首次認證時執行一次"],a:[1],e:"條款 8.2 要求依規劃的期間執行風險評鑑，<b>或在發生重大變更時執行</b>。實務上多數組織訂為年度一次，但下列情況應觸發重新評估：新增業務線或系統、組織改組、重大資安事故、法規變更、導入新技術（如引入 AI 工具）、範圍變更。只在認證前做一次然後三年不動，是很常見的不符合。"},
{d:3,q:"「定性風險評估」與「定量風險評估」的主要差別是？",o:["定性較準確，定量較粗略","定性用等級描述（高／中／低），定量用金額或機率數字計算","定性只能用於小公司","定量是 ISO 27001 的強制要求"],a:[1],e:"<b>定性</b>用等級矩陣（可能性 × 衝擊 = 風險等級），優點是快、容易溝通、不需要歷史數據，缺點是主觀。<b>定量</b>用金額（如年度預期損失 ALE = 單次損失 × 年發生次數），優點是可直接跟投資成本比較，缺點是需要可靠數據，多數組織拿不到。<b>ISO 27001 兩者都接受</b>，實務上多數採定性，關鍵資產才補做定量。"},
{d:3,q:"文件的「四層架構」中，第一層通常是什麼？",o:["表單與紀錄","作業指導書","資訊安全政策（最高階的方針文件）","程序書"],a:[2],e:"典型的四層架構：<b>第一層政策</b>（最高管理階層的方針與承諾）→ <b>第二層程序書</b>（跨部門的流程，誰在什麼時候做什麼）→ <b>第三層作業指導書</b>（單一崗位的具體操作步驟）→ <b>第四層表單與紀錄</b>（執行的證據）。層級越高越穩定、變更頻率越低；越低層越具體、變更越頻繁。這個架構讓文件變更的影響範圍可控。"},
{d:3,q:"下列哪一項是「風險擁有者（risk owner）」的正確定義？",o:["發現該風險的人","對該風險負有管理責任與權限的人","資安部門主管","外部稽核員"],a:[1],e:"風險擁有者是<b>有權責決定如何處理該風險的人</b>，通常是該業務或系統的負責主管，不是資安人員。這個設計很重要：資安部門負責識別與建議，但<b>決定要投入多少資源、是否接受殘餘風險的是業務擁有者</b>。條款 6.1.3 f) 要求取得風險擁有者的核准。全部風險都掛在資安主管名下，是常見的不符合。"},
{d:3,q:"某公司的議題分析表（條款 4.1）完全沒有提及氣候變遷。在 2024 年之後的稽核中，這最可能被判定為？",o:["完全沒有問題","Minor NC，因為 Amendment 1:2024 要求組織必須判定氣候變遷是否為相關議題","Major NC 且必須立即停止營運","僅為觀察事項，不列入報告"],a:[1],e:"Amendment 1:2024 在 4.1 加入了明文要求：「組織應<b>判定</b>氣候變遷是否為相關議題。」「沒想過」等於「沒做到判定」，屬於條款要求的缺失，通常判 <b>Minor NC</b>。<b>判定為「不相關」是可以的</b>，只要說得出理由（例如純雲端服務、無自有機房、供應商已涵蓋此風險）。寫「否」不會被開不符合，寫不出理由才會。"},
// ---------- 主題 4：稽核、認證與企業實務 ----------
{d:4,q:"「第一方稽核」、「第二方稽核」、「第三方稽核」分別指什麼？",o:["初階、中階、高階稽核員執行的稽核","第一方＝內部稽核；第二方＝客戶稽核供應商；第三方＝獨立驗證機構的認證稽核","分別在第一、二、三年執行","依稽核天數區分"],a:[1],e:"<b>第一方</b>＝組織自己稽核自己（內部稽核，條款 9.2）。<b>第二方</b>＝有利害關係的一方去稽核對方（客戶查供應商，對應 A.5.22）。<b>第三方</b>＝與雙方都無利害關係的獨立驗證機構執行，這才能發證書。三者的獨立性要求依序提高。"},
{d:4,q:"ISO 27001 的認證週期是？",o:["證書終身有效","證書效期 3 年，期間每年執行監督稽核，第 3 年執行重新認證稽核","證書效期 1 年，每年重新認證","證書效期 5 年，中間不需稽核"],a:[1],e:"完整週期：Stage 1（文件審查與準備度評估）→ Stage 2（實地驗證）→ 發證，<b>效期 3 年</b> → 第 1 年與第 2 年各執行一次<b>監督稽核</b>（範圍較小，抽查重點項目）→ 第 3 年執行<b>重新認證稽核</b>（範圍較完整）。監督稽核未通過或未執行，證書會被暫停甚至撤銷。"},
{d:4,q:"Stage 1 稽核的主要目的是？",o:["直接決定是否發給證書","審查文件、評估組織的準備度、確認範圍與場所、規劃 Stage 2","檢查財務報表","訓練組織的內部稽核員"],a:[1],e:"Stage 1 又稱文件審查或準備度評估，重點是：ISMS 文件是否齊備（政策、範圍、SOA、風險評估與處理、內稽與管理審查紀錄）、組織是否理解標準、範圍與場所是否明確、<b>並據以規劃 Stage 2 的重點與人天</b>。Stage 1 發現的落差通常以「觀察」形式提出，讓組織有時間改善。"},
{d:4,q:"「矯正（correction）」與「矯正措施（corrective action）」的差別是？",o:["兩者相同","矯正是消除已發現的不符合本身；矯正措施是消除根本原因以防止再發生","矯正由稽核員執行，矯正措施由受稽單位執行","矯正針對 Major，矯正措施針對 Minor"],a:[1],e:"這是稽核最愛考的一組。例：發現離職員工帳號未停用 → <b>矯正</b>＝把那個帳號停用（處理眼前這件事）；<b>矯正措施</b>＝分析根因（離職通知只送 IT，其他系統的帳號負責人沒收到）→ 修訂離職檢核表要求逐系統簽名 → 驗證有效性。<b>只做矯正沒做矯正措施，複稽時通常不會被接受</b>，因為問題會再發生。"},
{d:4,q:"下列情況最可能被判定為 Major NC（主要不符合）的是？",o:["風險登記表中有一筆的日期欄位填錯","抽查 20 份訓練紀錄，其中 1 份缺少簽名","從未執行過任何內部稽核","資產清冊中有 2 項資產的擁有者欄位空白"],a:[2],e:"Major NC 的典型判準：<b>整個控制項或條款要求完全缺失</b>、<b>系統性失效</b>（不是個案）、或<b>對 ISMS 達成預期結果造成重大風險</b>。從未執行內部稽核違反條款 9.2 的核心要求，屬於完全缺失。其他三項都是個案疏漏，屬於 Minor。Major NC 通常必須完成改善並經複稽確認後才能發證。"},
{d:4,q:"組織的內部稽核員稽核了自己所負責的部門。這違反了什麼原則？",o:["能力原則","客觀性與公正性（不得稽核自己的工作）","保密原則","證據導向原則"],a:[1],e:"條款 9.2 要求內部稽核的執行必須確保<b>過程的客觀性與公正性</b>，ISO 19011 也把「獨立性」列為稽核原則。稽核員不得稽核自己負責的工作或自己所屬的部門。小公司常見的解法：部門互稽（IT 稽核人資、人資稽核 IT）、或委由外部顧問執行內稽（這仍屬第一方稽核）。"},
{d:4,q:"ISO/IEC 17021-1 與 ISO 19011 的差別是？",o:["兩者相同","17021-1 規範「驗證機構」應具備的要求；19011 是「管理系統稽核」的指引","17021-1 針對資安，19011 針對品質","19011 是強制標準，17021-1 是建議"],a:[1],e:"<b>ISO/IEC 17021-1</b> 是<b>對驗證機構（CB）本身的要求</b>——公正性、能力、稽核人天、發證程序等，是認證機構（AB）評鑑 CB 的依據。<b>ISO 19011</b> 是<b>稽核的方法論指引</b>，適用於第一方與第二方稽核（內稽、供應商稽核），內容涵蓋稽核方案管理、稽核執行、稽核員能力。做內部稽核程序時參考的是 19011。"},
{d:4,q:"IAF 的 MLA（多邊承認協議）解決了什麼問題？",o:["降低認證費用","讓在某國取得的證書能被其他會員國承認，避免重複認證","統一各國的資安法規","提供資安保險"],a:[1],e:"IAF（國際認證論壇）的 MLA 讓各國認證機構（AB）互相承認彼此認可的驗證機構所發的證書。這就是為什麼台灣 TAF 認可的驗證機構所發的 ISO 27001 證書，國外客戶會承認。<b>實務意義：選驗證機構時要確認它是否受 IAF MLA 會員的認證機構認可</b>——否則證書可能在國外不被接受，白花錢。"},
{d:4,q:"稽核術語中，「稽核準則（audit criteria）」指的是？",o:["稽核員的資格條件","拿來比對的依據（標準條文、政策、程序、法規要求）","稽核發現的嚴重程度分級","稽核的時間安排"],a:[1],e:"用健康檢查對照最好懂：<b>稽核準則</b>＝標準值（血壓應低於 130）；<b>稽核證據</b>＝實際檢測數據；<b>稽核發現</b>＝證據與準則比對後的結果（血壓 150，高於標準）；<b>稽核結論</b>＝綜合所有發現的整體判斷。寫不符合報告時，必須同時指出準則、證據與兩者的落差——這是不符合描述的三要素。"},
{d:4,q:"公司在 Stage 2 被開出 1 項 Major NC。接下來會發生什麼？",o:["直接失去認證資格，兩年內不得再申請","須提出矯正措施計畫並完成改善，經驗證機構確認（通常需複稽）後才能發證","可以先發證，一年內改善即可","自動降級為 Minor"],a:[1],e:"Major NC 必須在驗證機構規定的期限內（通常 30–90 天）完成：提出根本原因分析、矯正與矯正措施計畫、實施並提供證據。<b>驗證機構通常會安排複稽（可能是現場或文件審查）確認有效性後才發證。</b>Minor NC 則多半可以先提交矯正措施計畫，於下次監督稽核時查證。"},
{d:4,q:"某製造業公司的產線設備跑 Windows XP，無法安裝防毒也無法修補。在 ISO 27001 導入時的正確處理方式是？",o:["在 SOA 中把所有相關技術控制標記為不適用","承認風險並實施補償性控制（網段隔離、單向管制、被動監控、設備列冊）","隱瞞這些設備的存在","立即停產更換所有設備"],a:[1],e:"ISO 27001 要的不是「所有系統都完美」，而是「<b>你知道風險在哪、做了合理的處理、殘餘風險有人負責</b>」。正確做法：把無法修補的事實寫進風險登記表、設備全部列冊並標示、用環境控制取代端點控制（OT 與 IT 網段實體分離、禁止連外、更新檔經掃毒站帶入、部署不干擾設備的被動式流量監控）。<b>誠實承認加補償控制，稽核員會接受；假裝有做被抽查到就是 Major。</b>"},
{d:4,q:"導入 ISO 27001 時，下列哪一個做法最容易導致失敗？",o:["先做資產盤點再做風險評估","直接照抄同業的 ISMS 文件","由高階主管擔任專案發起人","分階段擴充認證範圍"],a:[1],e:"照抄文件是導入失敗最常見的原因。問題不在抄本身，而在<b>抄來的文件描述的是別人的風險與流程</b>——稽核員只要問一句「這條為什麼這樣訂」「這個頻率的依據是什麼」就會露餡，而且員工也不會照著做（因為跟實際作業對不上）。參考範本沒問題，但必須依自己的風險評估結果調整。"},
{d:4,q:"某公司的緊急變更流程允許系統管理員單人執行所有步驟（正常需三人分離）。稽核員開出不符合的理由最可能是？",o:["不應該有緊急流程","例外機制缺少事後偵測與覆核的補償控制","緊急流程必須由 CEO 執行","緊急變更應一律禁止"],a:[1],e:"稽核員知道實務上一定需要緊急流程，<b>不會要求你取消它</b>。被開不符合的原因是「用了就用了，沒人知道、沒人覆核」。正確補強：使用時即時通知資安主管、24 小時內完成事後覆核並簽核、每季彙整報管理審查。<b>通則：任何「繞過控制」的例外機制，都必須配上「事後偵測與覆核」。</b>"},
{d:4,q:"關於認證範圍的分階段擴充，下列敘述何者正確？",o:["範圍一經認證即不可變更","可以先認證部分場域，之後走變更程序擴充，但證書上的範圍必須寫清楚","擴充範圍需重新從 Stage 1 開始","只有大型企業可以分階段"],a:[1],e:"分階段是資源有限時的正確策略：先用一個場域把制度跑順、文件磨好，第二年複製到其他場域時速度快很多，也避免第一次就多場域同時稽核導致品質失控。<b>兩個前提：① 擴充要走變更申請並由驗證機構確認（通常在監督稽核時併同進行）；② 證書上的範圍必須明確，不能讓客戶誤以為涵蓋全公司。</b>"},
{d:4,q:"導入時程的長短，主要取決於什麼？",o:["公司的員工人數","組織現有流程的成熟度（有多少事情本來就在做）","辦公室的坪數","購買的資安產品數量"],a:[1],e:"人數不是決定因素。一家 40 人的技術新創可能 7 個月完成（因為版控、程式碼審查、監控本來就在做，證據天生存在於 GitHub、Slack、雲端日誌中）；一家 300 人的製造業可能要 14 個月（因為 OT 網段要重新規劃、要跟產線協調停機）。<b>評估時程時先問「我們現在有多少事情本來就在做」，而不是先看人數。</b>"},
{d:4,q:"下列哪一項最能證明 ISMS 是「活的」而不是為了拿證書而做的？",o:["文件數量多達 200 份","有持續的低等級事故紀錄、有風險登記表的更新軌跡、有從演練中產生的改善事項","證書掛在大廳最顯眼處","聘請了知名顧問公司"],a:[1],e:"文件多不代表制度活著，反而可能是負擔。稽核員判斷 ISMS 是否運作的訊號是<b>「有沒有變動的痕跡」</b>：事故紀錄（哪怕都是低等級的釣魚通報）、風險登記表的版本演進與新增項目、演練後產生的改善事項並追蹤結案、管理審查決議的後續行動。<b>一份三年沒改過的風險登記表，比什麼都更能說明制度沒在動。</b>"},
{d:4,q:"取得 ISO 27001 認證後，對 B2B 企業最實際的日常效益之一是？",o:["可以不用再做資安工作","大幅減少回覆客戶資安問卷的工時，因為多數題目可直接指向 SOA 與既有文件","保證不會發生資安事件","可以要求客戶提高價格"],a:[1],e:"這是很多公司導入後才發現的意外收穫。B2B 客戶的資安問卷動輒 150 題，以前每來一份就要主管花兩天回答；有了 SOA 與完整文件後，多數題目可直接對應，半天就能交件。<b>認證不保證不會出事</b>——它證明的是你有系統性的管理機制與應變能力，而不是絕對安全。"},
{d:4,q:"某公司抽查 10 名離職員工，發現 2 人的 ERP 帳號仍為啟用狀態。人資有走離職流程，IT 也有收到通知。根本原因最可能是？",o:["人資故意隱瞞","離職流程只涵蓋部分系統，ERP 由財務部管理但未被納入通知對象","IT 人員能力不足","ERP 系統有技術缺陷"],a:[1],e:"離職帳號是所有產業的第一名不符合，而問題幾乎都不是「沒有流程」，而是<b>流程沒有涵蓋所有系統</b>——主要系統記得關，邊緣系統（考勤、VPN、外部 SaaS、共用信箱、由其他部門管理的系統）忘記。<b>對策：離職檢核表要用「系統清單」驅動並逐項簽名，不能靠人記憶。</b>同時定期做帳號複核當作偵測性控制。"},
{d:4,q:"稽核員抽樣時，通常會採用什麼策略？",o:["檢查 100% 的紀錄以確保完整","基於風險的抽樣：對高風險領域加大樣本，並沿「稽核軌跡」追查","隨機抽一筆即可","只看組織主動提供的樣本"],a:[1],e:"稽核在有限時間內無法全查，因此採<b>基於風險的抽樣</b>：高風險流程、上次有發現的項目、新導入的控制項會加大樣本。同時會運用<b>稽核軌跡</b>——從一筆異常往下追（例如發現一個帳號權限異常 → 追申請單 → 追核准人 → 追該部門的其他帳號）。「只看組織主動提供的樣本」會讓稽核失去效力，因此稽核員通常會自己指定抽樣對象。"},
{d:4,q:"公司同時要滿足 ISO 27001、ISO 27701 與 PCI DSS 的要求。最有效率的做法是？",o:["為每個標準各建立一套獨立的政策與程序","建立一套主控制清單，每個控制項標註它同時滿足哪些標準的哪一條","只做最嚴格的那一套，其他不管","依序逐年導入，不要重疊"],a:[1],e:"為每個標準各做一套文件，會變成三套政策互相矛盾，稽核時是災難，維護成本也是三倍。正確做法是<b>「一套控制、多份對應表」</b>：建立主控制清單，標註每個控制項對應到哪些標準的哪一條，稽核時提供對應表，一份證據回答多個問題。ISO 的高階結構（HLS）讓條款 4–10 可以完全共用，這正是它的設計目的。"}
];

// ===== 應用程式 =====
const DOMAINS = {
  1:"主題 1：標準架構與條款",
  2:"主題 2：Annex A 控制項",
  3:"主題 3：風險評估、SOA 與文件",
  4:"主題 4：稽核、認證與企業實務"
};
const PASS = 70;
let quiz = [], idx = 0, answers = [], selected = new Set(), submitted = false, mode = "all";
const app = document.getElementById("app");

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderSetup(){
  const wrong = JSON.parse(localStorage.getItem("iso_wrong")||"[]");
  app.innerHTML = `
  <div class="card">
    <h2 style="margin-bottom:8px;">選擇測驗模式</h2>
    <p class="stat" style="margin-bottom:14px;">題庫共 ${QUESTIONS.length} 題 · 依 ISO/IEC 27001:2022（含 Amendment 1:2024）出題 · 練習及格線 ${PASS}%</p>
    <div class="setup-opt" onclick="startQuiz('all')"><h3>📝 完整測驗（${QUESTIONS.length} 題）</h3><p>全主題隨機出題</p></div>
    <div class="setup-opt" onclick="startQuiz('quick')"><h3>⚡ 快速練習（15 題）</h3><p>隨機抽 15 題快速測驗</p></div>
    ${[1,2,3,4].map(d=>`<div class="setup-opt" onclick="startQuiz(${d})"><h3>🎯 ${DOMAINS[d]}</h3><p>只練習此主題（${QUESTIONS.filter(q=>q.d===d).length} 題）</p></div>`).join("")}
    ${wrong.length?`<div class="setup-opt" onclick="startQuiz('wrong')"><h3>🔁 錯題複習（${wrong.length} 題）</h3><p>只重做上次答錯的題目</p></div>`:""}
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px;">📌 說明</h3>
    <p class="stat">ISO 27001 本身沒有像 AWS 那樣的官方選擇題考試，這份題庫的用途是<b>驗收學習成果</b>與<b>模擬稽核提問</b>。題目取材自本指南各章，特別著重稽核員實際會問的問題與企業導入時真正踩過的坑。答錯的題目會自動存入錯題清單。</p>
  </div>`;
}

window.startQuiz = function(m){
  mode = m;
  if(m==="all") quiz = shuffle(QUESTIONS);
  else if(m==="quick") quiz = shuffle(QUESTIONS).slice(0,15);
  else if(m==="wrong"){const w=JSON.parse(localStorage.getItem("iso_wrong")||"[]");quiz=shuffle(QUESTIONS.filter((q,i)=>w.includes(i)));}
  else quiz = shuffle(QUESTIONS.filter(q=>q.d===m));
  idx=0; answers=[]; renderQuestion();
};

function renderQuestion(){
  const q = quiz[idx]; selected = new Set(); submitted = false;
  const multi = q.a.length>1;
  app.innerHTML = `
  <div class="progress-wrap"><div class="progress-bar" style="width:${idx/quiz.length*100}%"></div></div>
  <div class="stat" style="margin-bottom:8px;">第 ${idx+1} / ${quiz.length} 題</div>
  <div class="card">
    <span class="domain-tag">${DOMAINS[q.d]}</span>
    <div class="q-text">${q.q}</div>
    ${multi?'<div class="multi-hint">⚠️ 多選題：請選擇 '+q.a.length+' 個答案</div>':""}
    ${q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
    <div class="explain" id="explain"></div>
    <div class="toolbar">
      <button class="btn btn-outline" onclick="renderSetup2()">結束測驗</button>
      <button class="btn btn-primary" id="mainBtn" onclick="submitAnswer()">送出答案</button>
    </div>
  </div>`;
}
window.renderSetup2 = renderSetup;

window.pick = function(i){
  if(submitted) return;
  const q = quiz[idx], multi = q.a.length>1;
  if(!multi){selected.clear();document.querySelectorAll(".opt").forEach(b=>b.classList.remove("selected"));}
  if(selected.has(i)){selected.delete(i);document.getElementById("opt"+i).classList.remove("selected");}
  else{selected.add(i);document.getElementById("opt"+i).classList.add("selected");}
};

window.submitAnswer = function(){
  const q = quiz[idx];
  if(!submitted){
    if(selected.size===0){alert("請先選擇答案");return;}
    submitted = true;
    const correct = q.a.length===selected.size && q.a.every(a=>selected.has(a));
    answers.push({d:q.d, correct, qi:QUESTIONS.indexOf(q)});
    q.a.forEach(a=>document.getElementById("opt"+a).classList.add("correct"));
    selected.forEach(s=>{if(!q.a.includes(s))document.getElementById("opt"+s).classList.add("wrong");});
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    const ex = document.getElementById("explain");
    ex.innerHTML = `<div class="verdict" style="color:${correct?'var(--good)':'var(--bad)'}">${correct?"✅ 答對了！":"❌ 答錯了。正確答案："+q.a.map(a=>String.fromCharCode(65+a)).join(", ")}</div>${q.e}`;
    ex.classList.add("show");
    document.getElementById("mainBtn").textContent = idx===quiz.length-1?"查看成績":"下一題";
  } else {
    idx++;
    if(idx<quiz.length) renderQuestion(); else renderResult();
  }
};

function renderResult(){
  const total = answers.length, right = answers.filter(a=>a.correct).length;
  const pct = Math.round(right/total*100), pass = pct>=PASS;
  const wrongIdx = answers.filter(a=>!a.correct).map(a=>a.qi);
  localStorage.setItem("iso_wrong", JSON.stringify(wrongIdx));
  const hist = JSON.parse(localStorage.getItem("iso_history")||"[]");
  hist.push({date:new Date().toLocaleDateString("zh-TW"), pct, total});
  localStorage.setItem("iso_history", JSON.stringify(hist.slice(-20)));
  let domainRows = "";
  for(const d of [1,2,3,4]){
    const da = answers.filter(a=>a.d===d);
    if(!da.length) continue;
    const dr = da.filter(a=>a.correct).length;
    domainRows += `<div class="domain-row"><span>${DOMAINS[d]}</span><strong style="color:${dr/da.length>=PASS/100?'var(--good)':'var(--bad)'}">${dr}/${da.length}（${Math.round(dr/da.length*100)}%）</strong></div>`;
  }
  app.innerHTML = `
  <div class="card" style="text-align:center;">
    <h2>測驗結果</h2>
    <div class="result-big ${pass?'pass':'fail'}">${pct}%</div>
    <p style="font-size:1.05rem;margin-bottom:6px;color:#334155;">${right} / ${total} 題正確 · ${pass?"🎉 達到練習及格線（"+PASS+"%）！":"未達練習及格線（"+PASS+"%），再加油！"}</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px;">各主題表現</h3>
    ${domainRows}
    <p class="stat" style="margin-top:12px;">💡 建議優先複習正確率低於 ${PASS}% 的主題。</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px;">歷史成績</h3>
    ${hist.slice(-5).reverse().map(h=>`<div class="domain-row"><span>${h.date}（${h.total} 題）</span><strong>${h.pct}%</strong></div>`).join("")}
  </div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    ${wrongIdx.length?`<button class="btn btn-primary" onclick="startQuiz('wrong')">🔁 複習 ${wrongIdx.length} 題錯題</button>`:""}
    <button class="btn btn-outline" onclick="renderSetup2()">回到模式選擇</button>
  </div>`;
}

renderSetup();
</script>
</body>
</html>
