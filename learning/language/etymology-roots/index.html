<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字根字首魔法學院 EtymoRoots — 詞源構詞、KK/IPA音標、情境句型與文法深度解析</title>
  <meta name="description" content="專業英語字根、字首、字尾形態衍生單字學習系統：提供字源繁中原意、視覺化造字公式、KK/IPA雙音標、Web Speech真人語音發音與調速、情境例句與深度句型文法解析、主題篇章小短文沉浸式閱讀及互動拼字測驗。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
</head>
<body>

  <!-- 頂部現代導覽列 (App Header) -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-badge-icon">🏛️</div>
        <div class="brand-title-wrap">
          <h1>
            字根字首魔法學院
            <span class="brand-tag">EtymoRoots</span>
          </h1>
          <div class="brand-subtitle">English Morphology, Grammar &amp; Thematic Reading Master・<span style="color:var(--amber-primary); font-weight:600;">🔊 有英文處皆可發音</span></div>
        </div>
      </div>

      <div class="header-controls">
        <!-- 語音發音語速調整 -->
        <div class="tts-rate-control" title="調節真人發音語速">
          <label for="tts-rate-select">
            <span>🔊 語速:</span>
          </label>
          <select id="tts-rate-select" class="tts-rate-select" aria-label="語速調整">
            <option value="0.75">0.75x 慢速精聽</option>
            <option value="0.9" selected>0.9x 自然稍慢</option>
            <option value="1.0">1.0x 原速標準</option>
            <option value="1.2">1.2x 敏捷快聽</option>
          </select>
        </div>

        <!-- 收藏過濾切換 -->
        <button class="btn-fav-toggle" id="btn-fav-toggle" title="切換查看已收藏的單字">
          <span>★</span>
          <span>收藏單字</span>
          <span class="fav-badge" id="fav-count-badge">0</span>
        </button>

        <!-- 回作品集總控台按鈕 (Tom Chen Project Hub 統一慣例) -->
        <a href="../../../index.html" class="btn-return-hub" id="btn-return-hub" title="返回 Tom Chen 專案總控台">
          <span>🏠</span>
          <span>作品集首頁</span>
        </a>
      </div>
    </div>
  </header>

  <!-- 橫向字根字首分類與搜尋列 (Root / Prefix Selector & Search) -->
  <nav class="etymo-nav-bar" aria-label="字根字首分類選擇">
    <div class="nav-container">
      <!-- 字根字首膠囊列表 (由 app.js 動態渲染) -->
      <div class="root-chips-list" id="root-chips-list"></div>

      <!-- 即時關鍵字檢索框 -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="搜尋單字、音標、繁中或字根..." 
          aria-label="單字即時檢索"
        >
      </div>
    </div>
  </nav>

  <!-- 主內容視圖 (Main Wrapper) -->
  <main class="main-wrapper">

    <!-- 視圖功能標籤列 (View Tabs) -->
    <div class="view-tabs-bar" id="view-tabs-bar" role="tablist">
      <button class="tab-btn active" data-tab="words" role="tab">
        <span>📚</span>
        <span>核心單字庫 (Word Deck)</span>
      </button>
      <button class="tab-btn" data-tab="equations" role="tab">
        <span>🧩</span>
        <span>形態拆解公式 (Equations)</span>
      </button>
      <button class="tab-btn" data-tab="grammar" role="tab">
        <span>🔬</span>
        <span>句型文法顯微鏡 (Grammar)</span>
      </button>
      <button class="tab-btn" data-tab="article" role="tab">
        <span>📖</span>
        <span>主題篇章短文 (Story Reader)</span>
      </button>
      <button class="tab-btn" data-tab="quiz" role="tab">
        <span>🎯</span>
        <span>拼字挑戰測驗 (Quiz Arena)</span>
      </button>
      <button class="tab-btn" data-tab="flashcards" role="tab">
        <span>🗂️</span>
        <span>翻卡記憶模式 (Flashcards)</span>
      </button>
    </div>

    <!-- 字根字首介紹橫幅 (Hero Banner 由 app.js 動態渲染) -->
    <section id="etymo-banner-container" aria-label="字根起源說明"></section>

    <!-- 主功能頁籤內容切換區 (由 app.js 動態渲染) -->
    <section id="main-tab-content" aria-label="學習內容核心呈現"></section>

  </main>

  <!-- 頁尾 (Footer) -->
  <footer class="app-footer">
    <div class="footer-content">
      <div>
        <strong>字根字首魔法學院 EtymoRoots</strong> &copy; 2026 Tom Chen Language Learning Suite. All rights reserved.
      </div>
      <div>
        以語言學詞源構詞為核心・結合語音合成 (TTS) 與句型語法解析
      </div>
    </div>
  </footer>

  <!-- 腳本引入 -->
  <script src="js/data.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
