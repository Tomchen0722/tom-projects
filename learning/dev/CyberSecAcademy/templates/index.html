<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安自學院 · CyberSec Academy</title>
<meta name="description" content="從零基礎到企業應用的資安自學網站，涵蓋 Linux、Network+、Security+、CCNA、CND、CEH、CySA+">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body data-theme="dark">
<a class="skip-link" href="#main">跳到主要內容</a>

<!-- 側邊欄 -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="36" height="36"><path d="M20 3 L34 9 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V9 Z" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M14 20 l4 4 l8 -9" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="brand-text">
      <strong>資安自學院</strong>
      <span>CyberSec Academy</span>
    </div>
  </div>

  <div class="search-box">
    <input type="search" id="searchInput" placeholder="搜尋章節、關鍵字…" aria-label="搜尋">
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <nav class="track-nav" id="trackNav" aria-label="課程導覽">
    <div class="nav-loading">載入課程中…</div>
  </nav>

  <div class="sidebar-footer">
    <button class="ghost-btn" id="glossaryBtn">📖 術語小辭典</button>
    <button class="ghost-btn" id="terminalBtn">⌨ 模擬終端機</button>
    <button class="ghost-btn" id="resetBtn">↺ 重設學習進度</button>
  </div>
</aside>

<button class="menu-toggle" id="menuToggle" aria-label="開關選單">☰</button>

<!-- 主內容 -->
<main class="main" id="main">
  <!-- 首頁 -->
  <section class="home" id="homeView">
    <div class="hero">
      <div class="hero-badge">從零基礎 → 企業應用</div>
      <h1>用高中生也懂的方式<br>學會<span class="grad">資安</span></h1>
      <p class="hero-sub">八條學習路線、33 個章節、265 道模擬考題、182 條可互動的指令示範。<br>涵蓋 Linux、CompTIA Network+/Security+/Linux+/CySA+、Cisco CCNA、EC-Council CND 與 CEH。</p>
      <div class="hero-stats" id="heroStats"></div>
      <div class="hero-actions">
        <button class="primary-btn" id="startBtn">開始學習 →</button>
        <button class="secondary-btn" id="continueBtn" hidden>繼續上次進度 →</button>
      </div>
    </div>

    <div class="progress-panel" id="progressPanel"></div>

    <h2 class="section-title">學習路線圖</h2>
    <p class="section-desc">建議由上往下依序學習。前面的基礎是後面的加速器 — 跳級只會讓你事倍功半。</p>
    <div class="roadmap" id="roadmap"></div>
  </section>

  <!-- 章節閱讀 -->
  <article class="reader" id="readerView" hidden></article>
</main>

<!-- 模擬終端機 -->
<div class="modal" id="terminalModal" hidden>
  <div class="modal-card terminal-card">
    <div class="modal-head">
      <span class="term-dots"><i></i><i></i><i></i></span>
      <span class="term-title">模擬終端機（教學沙盒 · 不會動到你的電腦）</span>
      <button class="modal-close" data-close>✕</button>
    </div>
    <div class="term-body" id="termBody" tabindex="0"></div>
    <div class="term-input-line">
      <span class="term-prompt">student@academy:~$</span>
      <input type="text" id="termInput" autocomplete="off" spellcheck="false" aria-label="終端機輸入">
    </div>
  </div>
</div>

<!-- 術語辭典 -->
<div class="modal" id="glossaryModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span class="term-title">📖 資安術語小辭典</span>
      <button class="modal-close" data-close>✕</button>
    </div>
    <input type="search" id="glossarySearch" class="glossary-search" placeholder="搜尋術語…">
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/js/app.js"></script>




<!-- TOM_HUB_RETURN start : 由 Project Hub 注入，可用 hub/tools/inject_return.py 重新產生 -->
<script>
(function(){
  if (document.getElementById('tom-hub-return')) return;
  // 依所在環境決定回哪裡：
  //   本機          → 本機的 Project Hub
  //   作品集站台內  → 用相對路徑，換網域也不會壞
  //   其他網域      → 專案自己部署在 Render 等平台，相對路徑會超出根目錄，
  //                   只能用完整網址連回作品集
  var host = location.hostname;
  var local = ['127.0.0.1','localhost',''].indexOf(host) >= 0;
  var onSite = host === 'tomchen0722.github.io';
  var href = local ? 'http://127.0.0.1:7000'
           : (onSite ? '../../../../index.html' : 'https://tomchen0722.github.io/tom-projects/');
  var label = local ? '回 Hub' : '回作品集';
  function mount() {
    if (!document.body) return;
    var s = document.createElement('style');
    s.textContent = '#tom-hub-return{position:fixed;left:18px;bottom:18px;z-index:2147483000;'
      + 'display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:11px 18px;'
      + 'background:#1C1A18;color:#FEFEF9;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;'
      + 'font-size:13px;font-weight:500;letter-spacing:.03em;line-height:1;text-decoration:none;'
      + 'box-shadow:0 6px 24px rgba(28,26,24,.22);'
      + 'transition:background .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1);}'
      + '#tom-hub-return::after{content:"";position:absolute;bottom:-3px;right:-3px;width:100%;height:100%;'
      + 'border:1.5px solid #3A68AD;opacity:.45;pointer-events:none;transition:opacity .25s;}'
      + '#tom-hub-return:hover{background:#3A68AD;transform:translateY(-2px);}'
      + '#tom-hub-return:hover::after{opacity:0;}'
      + '#tom-hub-return:focus-visible{outline:2px solid #3A68AD;outline-offset:3px;}'
      // media query 的左大括號後面刻意留一個空格：這段也會被注入到 Jinja2 模板裡，
      // 左大括號緊接井號會被 Jinja2 當成註解開始，導致整頁解析失敗。
      + '@media(max-width:600px){ #tom-hub-return{left:12px;bottom:12px;padding:11px 15px;font-size:12px;}}'
      + '@media(prefers-reduced-motion:reduce){ #tom-hub-return{transition:none;}}'
      + '@media print{ #tom-hub-return{display:none;}}';
    document.head.appendChild(s);
    var a = document.createElement('a');
    a.id = 'tom-hub-return';
    a.href = href;
    a.title = label;
    a.setAttribute('aria-label', label);
    a.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<line x1="19" y1="12" x2="5" y2="12"></line>'
      + '<polyline points="12 19 5 12 12 5"></polyline></svg><span>' + label + '</span>';
    document.body.appendChild(a);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();
</script>
<!-- TOM_HUB_RETURN end -->
</body>
</html>
