<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安自學院 · CyberSec Academy</title>
<meta name="description" content="從零基礎到企業應用的資安自學網站，涵蓋 Linux、Network+、Security+、CCNA、CND、CEH、CySA+">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body data-theme="dark">
<a class="skip-link" href="#main">跳到主要內容</a>

<!-- 側邊欄 -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="36" height="36"><path d="M20 3 L34 9 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V9 Z" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M14 20 l4 4 l8 -9" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="brand-text">
      <strong>資安自學院</strong>
      <span>CyberSec Academy</span>
    </div>
  </div>

  <div class="search-box">
    <input type="search" id="searchInput" placeholder="搜尋章節、關鍵字…" aria-label="搜尋">
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <nav class="track-nav" id="trackNav" aria-label="課程導覽">
    <div class="nav-loading">載入課程中…</div>
  </nav>

  <div class="sidebar-footer">
    <button class="ghost-btn" id="glossaryBtn">📖 術語小辭典</button>
    <button class="ghost-btn" id="terminalBtn">⌨ 模擬終端機</button>
    <button class="ghost-btn" id="resetBtn">↺ 重設學習進度</button>
  </div>
</aside>

<button class="menu-toggle" id="menuToggle" aria-label="開關選單">☰</button>

<!-- 主內容 -->
<main class="main" id="main">
  <!-- 首頁 -->
  <section class="home" id="homeView">
    <div class="hero">
      <div class="hero-badge">從零基礎 → 企業應用</div>
      <h1>用高中生也懂的方式<br>學會<span class="grad">資安</span></h1>
      <p class="hero-sub">八條學習路線、33 個章節、265 道模擬考題、182 條可互動的指令示範。<br>涵蓋 Linux、CompTIA Network+/Security+/Linux+/CySA+、Cisco CCNA、EC-Council CND 與 CEH。</p>
      <div class="hero-stats" id="heroStats"></div>
      <div class="hero-actions">
        <button class="primary-btn" id="startBtn">開始學習 →</button>
        <button class="secondary-btn" id="continueBtn" hidden>繼續上次進度 →</button>
      </div>
    </div>

    <div class="progress-panel" id="progressPanel"></div>

    <h2 class="section-title">學習路線圖</h2>
    <p class="section-desc">建議由上往下依序學習。前面的基礎是後面的加速器 — 跳級只會讓你事倍功半。</p>
    <div class="roadmap" id="roadmap"></div>
  </section>

  <!-- 章節閱讀 -->
  <article class="reader" id="readerView" hidden></article>
</main>

<!-- 模擬終端機 -->
<div class="modal" id="terminalModal" hidden>
  <div class="modal-card terminal-card">
    <div class="modal-head">
      <span class="term-dots"><i></i><i></i><i></i></span>
      <span class="term-title">模擬終端機（教學沙盒 · 不會動到你的電腦）</span>
      <button class="modal-close" data-close>✕</button>
    </div>
    <div class="term-body" id="termBody" tabindex="0"></div>
    <div class="term-input-line">
      <span class="term-prompt">student@academy:~$</span>
      <input type="text" id="termInput" autocomplete="off" spellcheck="false" aria-label="終端機輸入">
    </div>
  </div>
</div>

<!-- 術語辭典 -->
<div class="modal" id="glossaryModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span class="term-title">📖 資安術語小辭典</span>
      <button class="modal-close" data-close>✕</button>
    </div>
    <input type="search" id="glossarySearch" class="glossary-search" placeholder="搜尋術語…">
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/js/app.js"></script>
</body>
</html>
