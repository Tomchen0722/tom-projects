# 什麼是 CAM (電腦輔助製造)？高中生也能秒懂的現代魔法！

> [!NOTE]
> 想像一下，你在玩《Minecraft》時建了一個超酷的城堡，如果你能按一個按鈕，就有一台機器自動在現實世界幫你把城堡蓋出來，是不是很神奇？這就是 **CAM** 正在做的事情！

## 1. 什麼是 CAM？

**CAM** 的全名是 **Computer-Aided Manufacturing（電腦輔助製造）**。

簡單來說，CAM 就是**「用電腦軟體來控制機器，讓機器自動幫我們把東西做出來」**的技術。
不管你是要切一塊金屬、雕刻一塊木頭，還是用 3D 列印機印一個公仔，這背後都少不了 CAM 的幫忙。

---

## 2. 製造業的「黃金三角」：CAD、CAM、CNC

要理解 CAM，我們一定要認識它的另外兩個好兄弟：**CAD** 和 **CNC**。
我們可以把它們想像成一家「超高級無人餐廳」的運作流程：

1. **CAD (電腦輔助設計)** 🎨：就像是**「設計師 / 畫家」**
   - **任務**：在電腦上畫出產品精確的 2D 或 3D 藍圖。在虛擬世界中把東西「建構」出來。
   - **生活範例**：想像你要做一個專屬的「金屬手機殼」。你不能直接拿金屬塊亂切，你要先在 CAD 軟體裡畫出手機殼的長度、寬度、厚度，甚至連相機鏡頭的圓孔直徑、按鍵的凹槽都要精準標示。這就像是在建立一份超詳細的「產品數位分身」。
   - **常見的 CAD 軟體 (業界與學校愛用)**：
     - **AutoCAD**：最經典的製圖軟體，蓋房子的平面圖或機器零件常用。
     - **SolidWorks**：工業界最愛！非常適合畫精密的機械零件、齒輪、甚至整台汽車的 3D 立體模型。
     - **Fusion 360 (Autodesk)**：現在非常紅的軟體，很多高中生或大學生創客 (Maker) 在用。最厲害的是它**同時結合了 CAD (設計) 和 CAM (製造) 的功能**，在同一個畫面就能完成所有工作。
     - **Tinkercad**：超級適合新手的網頁版 3D 建模軟體，用堆疊積木的方式就能畫出模型，常搭配 3D 列印使用。

2. **CAM (電腦輔助製造)** 🧠：就像是**「翻譯官 / 規劃師」**
   - 任務：機器是看不懂藍圖的，所以 CAM 負責把 CAD 畫好的藍圖，翻譯成機器聽得懂的「指令碼」（通常叫 **G-code**）。它還會規劃機器要從哪裡開始切、鑽頭要多快。
   - 舉例：CAM 告訴機器「先往右邊走 5 公分，然後往下鑽 2 公分」。

3. **CNC (電腦數值控制工具機)** 🤖：就像是**「超級主廚」**
   - 任務：負責拿著刀具，完全聽從 CAM 寫好的指令碼，把真實的材料（如一塊大鐵塊）切削成你要的樣子。

---

## 3. 圖解：從電腦螢幕到真實物品

讓我們看看下面這張圖，這是從設計到製造的完整過程：

![從 CAD 到 CAM 的完整流程](learning/cad_cam_process.jpg)

**流程解析：**
1. **左邊的電腦 (CAD)**：工程師在螢幕上畫出了一個藍色的 3D 齒輪。
2. **中間的數據流 (CAM 的工作)**：軟體把這個齒輪的形狀，轉換成無數條機器指令（G-code），透過網路或隨身碟傳送給機器。
3. **右邊的加工機 (CNC)**：機器收到指令後，裡面的鑽頭開始精準地切割金屬塊，最後做出右下角那顆一模一樣的真實齒輪！

---

## 4. 為什麼我們需要 CAM？

以前沒有電腦時，工廠裡的師傅必須手動轉動機器的把手，一小毫米、一小毫米地切削金屬。這會遇到什麼問題？
- **很慢**：純手工非常花時間。
- **容易出錯**：人會累，手會抖，一不小心切太多，整塊金屬就報廢了。
- **很難複製**：你要師傅連續做 100 個一模一樣的零件，幾乎是不可能的事。

**有了 CAM 之後：**

> [!TIP]
> **CAM 的三大超能力**
> 1. **極度精準**：機器可以精準到零點幾毫米（比頭髮還細！），做出手機裡面超精密的零件。
> 2. **24小時不休息**：只要程式寫好，機器可以不眠不休地工作。
> 3. **品質一致**：不管是第 1 個還是第 10,000 個產品，長得都會一模一樣。

---

## 5. 實際在工廠裡的樣子

當 CAM 把程式傳給機器後，真實的加工過程是非常震撼的。機器會以極高的速度旋轉刀具，並且會噴灑冷卻液來降溫（因為摩擦會產生超高溫）。

![現代 CNC 機器正在加工金屬](learning/cnc_machining.jpg)

*圖為：CNC 銑床機器的鑽頭正在根據 CAM 軟體的指令，精準地雕刻金屬塊。*

---

## 6. 總結

用一句話總結：**CAD 負責「想像與設計」，CAM 負責「思考怎麼做」，而機器（CNC）負責「實際動手做」。**

從你手上的 iPhone 金屬外殼、腳踏車的齒輪，到飛機上的引擎葉片，背後都是靠著 **CAM (電腦輔助製造)** 這項技術，把人類腦海中的創意，變成可以觸摸到的真實物品！

# AutoCAD 2024 (繁體中文版) 新手完全入門指南

> [!TIP]
> 歡迎來到 AutoCAD 的世界！這份指南專為剛接觸 **AutoCAD 2024 繁體中文版** 的新手設計。我們將從打開軟體開始，一步步帶你畫出第一張帶有尺寸的標準工程圖。請開啟你的 AutoCAD，跟著做吧！

---

## 第一階段：打開軟體與認識環境

### 步驟 1：開啟新圖面
1. 雙擊桌面上的 **AutoCAD 2024 - 繁體中文 (Traditional Chinese)** 捷徑開啟軟體。
2. 在啟動畫面（開始頁籤）的左側，點擊大大的 **「新增」** 按鈕（或是點擊旁邊的下拉選單選擇 \cadiso.dwt\，這是公制/公釐的標準範本）。
3. 你會看到中間出現了一大片黑色的網格區域，這就是你的「畫布」。

### 步驟 2：認識繁體中文介面 (超級重要！)
AutoCAD 的畫面主要分為四個區塊：
- **功能區 (Ribbon)**：在畫面最上方，包含「常用」、「插入」、「註解」等頁籤。你最常用的畫圖工具（直線、圓、矩形）都在**「常用」**頁籤裡。
- **繪圖區 (畫布)**：中間最大的黑色區域，是我們畫圖的地方。
- **指令行 (Command Line)**：在畫面正下方白色的長條輸入框。**這是 AutoCAD 的靈魂！** 它會一直提示你下一步該做什麼（例如：指定第一點）。
- **狀態列**：在畫面右下角的一排小圖示。用來控制繪圖輔助工具，例如「正交模式」(讓線只能畫直的)、「物件鎖點」(自動幫你抓線的端點)。

### 步驟 3：滑鼠的基本操作 (一定要熟練)
- **左鍵**：點擊按鈕、選擇物件、決定繪圖的點。
- **右鍵**：叫出選單，或是代表「Enter (確定/結束)」。
- **滾輪向上/向下滾動**：放大或縮小畫面（Zoom）。
- **按住滾輪不放並拖曳**：平移畫面（像是用手抓住紙張移動）。

---

## 第二階段：動手畫圖！(任務：畫一個長 100、寬 50 的矩形)

> [!IMPORTANT]
> 在 AutoCAD 中畫圖的核心口訣是：**「點擊工具 ➡️ 看指令行提示 ➡️ 點擊滑鼠或輸入數字 ➡️ 按 Enter」**。

### 步驟 4：畫出第一條底線 (長度 100)
1. 把滑鼠移到左下角的狀態列，確保 **「正交模式」** (圖示像一個直角 \⦜\，快捷鍵 F8) 是**開啟**的（背景會亮起藍色）。這能確保我們畫的線是絕對水平或垂直的。
2. 在上方的功能區「常用」頁籤中，點擊 **「直線」**。
3. 眼睛看向下方的**指令行**，它會說 \_line 指定第一點:\。
4. 在黑色畫布的任意位置，點擊滑鼠**左鍵**一下（當作起點），然後放開滑鼠。
5. 把滑鼠輕輕往**右邊**移動（不要按按鍵，只是移動游標），你會看到一條線跟著你的游標拉長。
6. 直接在鍵盤上輸入數字 \100\，然後按 **Enter** 鍵。
7. 第一條長度 100 的底線畫好了！(此時直線工具還沒結束，線會繼續跟著滑鼠走)。

### 步驟 5：畫出右側邊線 (長度 50)
1. 接著上一個動作，把滑鼠直接往**上方**移動。
2. 在鍵盤輸入 \50\，按 **Enter** 鍵。

### 步驟 6：畫出頂部邊線 (長度 100)
1. 把滑鼠往**左邊**移動。
2. 在鍵盤輸入 \100\，按 **Enter** 鍵。

### 步驟 7：封閉矩形並結束指令
1. 這時候我們要連回一開始的起點。
2. 你可以直接往下拉輸入 50，或者**更聰明的做法**：看向下方的指令行，它提示 \指定下一點 或 [封閉(C) / 退回(U)]:\。
3. 在鍵盤上輸入字母 \C\ (代表 Close 封閉)，然後按 **Enter** 鍵。
4. 恭喜！一個精準的 100x50 矩形完成了，且指令會自動結束。

*(如果畫完發現矩形太小或太大跑到畫面外，請連點兩下「滑鼠滾輪」，畫面會自動縮放將圖形置中顯示！)*

---

## 第三階段：加上尺寸標註

畫完圖後，工程師需要標上尺寸別人才能照著做。

### 步驟 8：標註長與寬
1. 在上方功能區，找到「常用」頁籤右邊一點的 **「註解」** 面板。
2. 點擊裡面大大的 **「標註」** 按鈕（圖示是兩端有箭頭的線）。
3. **開啟物件鎖點**：確保右下角狀態列的 **「物件鎖點」** (圖示是一個正方形帶亮點，快捷鍵 F3) 是**開啟**的。這會讓滑鼠自動吸附到矩形的角落。
4. **標註底邊長度**：
   - 將滑鼠靠近矩形底邊的**左下角**，會出現一個綠色框框，點擊左鍵。
   - 將滑鼠靠近矩形底邊的**右下角**，出現綠色框框，點擊左鍵。
   - 把滑鼠往下拉一點點（決定數字放的位置），點擊左鍵固定。你會看到漂亮的 \100\ 標註在上面。
5. **標註右邊寬度**：
   - 在標註指令還沒結束時，點擊右下角，再點擊右上角，把滑鼠往右拉並點擊左鍵固定。標出 \50\。
6. 按鍵盤左上角的 **ESC 鍵**，退出標註指令。

---

## 第四階段：存檔與輸出

### 步驟 9：儲存檔案
1. 點擊畫面最左上角的大紅色 **「A」** 圖示（應用程式功能表）。
2. 選擇 **「儲存」** (或另存新檔)。
3. 選擇你要存檔的資料夾。
4. 檔案類型預設為 **\AutoCAD 2018 圖面 (*.dwg)\**（副檔名是 .dwg，這是 CAD 最通用的格式，存 2018 版可以讓舊版軟體也打得開）。
5. 輸入檔名（例如：\我的第一個矩形\），點擊儲存。

> [!CAUTION]
> 畫圖時請養成隨時按 **Ctrl + S** (快速存檔) 的好習慣，以免電腦突然當機導致心血泡湯！

這樣你就完成了 AutoCAD 2024 最基礎但也最核心的整個流程了！從認識介面、精準畫線、標註尺寸到存檔，所有複雜的工程圖都是由這些基本動作延伸出來的。

# 從零基礎到 PCB 工業電路板繪圖：新手完全破關指南

> [!NOTE]
> 歡迎來到電子工程的核心世界！你每天在用的手機、電腦、甚至遙控器裡面那塊綠色或黑色的板子，就是 **PCB（Printed Circuit Board，印刷電路板）**。
> 要能自己畫出一片 PCB 看起來很難，但只要跟著正確的步驟，從零基礎到畫出第一片能運作的電路板，其實就像在玩闖關遊戲！

---

## 第一階段：基本功 — 看懂「藏寶圖」(電路學基礎)

在開始畫實體電路板之前，你必須先看懂「電路圖 (Schematic)」。這就像是蓋房子前必須先看懂建築藍圖。

1. **認識基礎電子零件 (元件)：**
   - **電阻 (Resistor)**：限制電流大小。
   - **電容 (Capacitor)**：儲存微小電量，用來穩壓或濾波。
   - **LED (發光二極體)**：通電就會發亮。
   - **IC (積體電路)**：像是晶片 (例如：大名鼎鼎的 555 計時器晶片)。
2. **看懂電路符號：** 在電路圖上，零件不會長得像真實世界的樣子，而是用簡單的符號代替。你要學會看懂這些符號以及它們是如何用「線」連在一起的。
3. **⭐ 新手第一關任務**：上網找一個「**LED 閃爍電路 (Blinking LED with 555 timer)**」的電路圖，並嘗試看懂每一條線是怎麼連的。

---

## 第二階段：挑選你的武器 — 認識 PCB 繪圖軟體 (EDA)

工業界和創客圈有幾套主流的畫圖軟體（我們稱之為 EDA 軟體）。作為新手，你需要選一套來練功：

| 軟體名稱 | 難易度 | 費用 | 適合對象與特點 |
| :--- | :--- | :--- | :--- |
| **EasyEDA (立創 EDA)** | ⭐ (最簡單) | 免費 (網頁版) | **[新手首選推薦]** 不用安裝，打開網頁就能畫。內建超龐大的零件庫，畫完還能直接一鍵下單送工廠做出來，非常方便！ |
| **KiCad** | ⭐⭐⭐ | 完全免費開源 | **[進階與創客最愛]** 功能非常強大，沒有限制，很多小公司和開源硬體專案都用這套。適合想長期發展的人。 |
| **Altium Designer (AD)** | ⭐⭐⭐⭐⭐ | 極高昂 (有學生版) | **[工業界霸主]** 業界最主流的商業軟體，找硬體工程師工作必備。但介面複雜，學習曲線非常陡峭。 |
| **Eagle (Autodesk)** | ⭐⭐⭐ | 需訂閱 | 以前創客圈很紅，現在與 Fusion 360 整合，也有一定市佔率。 |

---

## 第三階段：PCB 繪圖的標準 S.O.P (標準作業流程)

選好軟體（建議先用 EasyEDA 或 KiCad）後，畫出一片電路板的流程是固定的：

### 步驟 1：繪製電路圖 (Schematic Capture)
- 在軟體中把電阻、電容、IC 的「符號」抓出來。
- 用軟體裡的「畫線工具」把它們連起來。這一步只是在定義「誰跟誰要導通」。

### 步驟 2：指定封裝 (Footprint Assignment)
- **這是新手最容易卡關的地方！**
- 同一個「10k歐姆的電阻」，它可以長得像一顆芝麻大小的貼片 (SMD)，也可以是帶有兩根長長鐵絲的傳統零件 (DIP)。
- 你必須告訴軟體，你電路圖上的這個電阻，在真實世界中到底是「哪一種形狀、多大尺寸」，這個尺寸模型就叫做 **「封裝 (Footprint)」**。

### 步驟 3：轉成 PCB (Convert to PCB) & 擺放零件 (Placement)
- 把剛才的電路圖與封裝匯入到實體的 PCB 黑色畫布上。
- 這時候你會看到所有零件擠在一起，並有許多細細的線 (稱為飛線/鼠線) 提示你它們應該連在一起。
- **任務：** 像玩拼圖一樣，把零件擺放到合理的位置。例如：接頭要放在板子邊緣、發熱的零件要分散開來。

### 步驟 4：佈線 (Routing / Layout)
- **這是整個過程中最好玩、也最考驗功力的一步！**
- 你要用滑鼠畫出真實的銅箔走線，把剛剛的「飛線」變成實體的「銅線」。
- **基本規則：** 線不能交叉短路！遇到過不去的地方，可以打一個洞 (稱為「過孔 Via」) 鑽到電路板的背面繼續走線 (這就是雙層板的概念)。

### 步驟 5：鋪銅 (Copper Pour) & 規則檢查 (DRC)
- 佈線完成後，通常會在剩下空白的地方鋪滿銅箔，並接上 GND (地線)，這可以抗干擾。
- 點擊軟體裡的 **DRC (設計規則檢查)** 按鈕，讓電腦幫你檢查有沒有不小心短路，或是線畫得太細的情況。

---

## 第四階段：見證奇蹟 — 產出與送洗 (打樣)

當你完成設計且 DRC 檢查都沒問題後，就可以準備把你的心血變成實體了！

1. **輸出 Gerber 檔**：這就像是給 PCB 工廠的「列印說明書」，裡面包含了哪裡要有銅、哪裡要鑽孔、哪裡要印白色的字 (絲印層)。
2. **送廠打樣**：把 Gerber 檔上傳到 PCB 製造商 (如 JLCPCB, PCBWay 等)。現在工業技術超級發達，打樣 5 片雙層板通常只要台幣幾十塊到一百多塊錢，大約一週內就能寄到你家！

---

## 🚀 給零基礎新手的「第一週行動計畫」

如果你今天就想開始，請跟著這三步走：
1. **打開瀏覽器**：註冊並開啟 **EasyEDA (立創 EDA)**。
2. **看教學影片**：在 YouTube 搜尋 \EasyEDA 新手教學\ 或 \KiCad 新手教學\。
3. **動手做第一個專案**：不要一開始就想畫電腦主機板！請從畫一個 **「LED 閃爍電路 (555 Timer)」** 或是 **「Arduino 擴充板」** 開始。完成這一個小專案，你就已經掌握 PCB 工業繪圖 80% 的流程了！
